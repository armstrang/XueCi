plugins {
    id 'com.android.application'
}

// Each GitHub Actions run gets a higher versionCode, so a new APK installs over the old one (progress is kept).
// versionCode = 100 + run number, so it always rises; the visible version is 1.0, 1.1, ... per run.
// The application ID is com.armstrang.xueci (the Play Store ID). Builds up to v1.2 used com.jorgi.merdekamandarin;
// people move their progress over with Stats → Back up / Restore.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.armstrang.xueci'
    compileSdk 36

    defaultConfig {
        applicationId 'com.armstrang.xueci'
        minSdk 24
        targetSdk 36
        versionCode 100 + runNumber
        versionName "1.${Math.max(0, runNumber - 1)}"
    }

    signingConfigs {
        // One fixed key for every build: Android only accepts an update signed with the same key.
        merdeka {
            storeFile rootProject.file('keystore/merdeka.jks')
            storePassword 'merdekamandarin'
            keyAlias 'merdeka'
            keyPassword 'merdekamandarin'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.merdeka
        }
        debug {
            signingConfig signingConfigs.merdeka
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['html']
    }

    // Personal sideloaded app: don't let release-time lint checks block the APK build.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Aligns kotlin-stdlib / -jdk7 / -jdk8 versions pulled in by AndroidX (avoids duplicate-class errors).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
