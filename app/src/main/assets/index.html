<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>XueCi Mandarin</title>
<style>
/* generated by web/make_fonts.py; fonts are SIL OFL 1.1, licences in assets/fonts/ */
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/pjs.woff") format("woff");font-weight:400 800;font-style:normal;font-display:block}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/pjs-italic.woff") format("woff");font-weight:500 600;font-style:italic;font-display:block}
@font-face{font-family:"Noto Sans Thai";src:url("fonts/thai.woff") format("woff");font-weight:400 800;font-style:normal;font-display:block}
@font-face{font-family:"Noto Sans SC";src:url("fonts/sans-sc-400.woff") format("woff");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Noto Sans SC";src:url("fonts/sans-sc-700.woff") format("woff");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"Noto Serif SC";src:url("fonts/serif-sc-700.woff") format("woff");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"Noto Serif SC";src:url("fonts/serif-sc-900.woff") format("woff");font-weight:900;font-style:normal;font-display:block}
</style>
<script>/* text size: Android's font scale (or ?fs= for testing) → --fs for text, --fsd (half the change) for big display text */
(function(){var f=1;try{var q=new URLSearchParams(location.search).get('fs');if(q)f=+q;else if(window.MMAndroid&&MMAndroid.fontScale)f=+MMAndroid.fontScale()}catch(e){}
if(!(f>0))f=1;f=Math.min(1.6,Math.max(.85,f));var d=document.documentElement,r=d.style;r.setProperty('--fs',f);r.setProperty('--fsd',1+(f-1)/2);if(f>=1.15)d.classList.add('bigtext')})()</script>
<style>
/* Two kinds of screen: Home (logo · language · theme → level pills → big progress ring → three mode tiles)
   and focused screens (List / Cards / Quiz / Stats) that show only that task, with a back button and compact pickers.
   Level accent per HSK; tone colors on hanzi/pinyin; green/yellow/red = understanding. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --sunk:#e8ebf1; --fg:#161a22; --soft:#535b6b; --mute:#7d8494; --line:#e1e5ec;
  --mark:#ffe1a8; --on-acc:#ffffff; --shadow:0 18px 50px rgba(22,26,34,.18);
  --l1:#2f8a4c; --l2:#0f7f88; --l3:#1f78b4; --l4:#3c4fb8; --l5:#7a46b8; --l6:#a3386f;
  --t1:#cf3b2b; --t2:#d27a12; --t3:#24905a; --t4:#2a62c0; --t5:#8b928e;
  --s-red:#e5484d; --s-yellow:#f0bf26; --s-green:#3fae4c; --s-none:#d3d8e0;
  --good:#1d7a4d; --bad:#c2412d;
  --acc:var(--l1);
  --bar:var(--bg); --bar2:var(--bg);   /* Android status / navigation bar colours */
  --f-ui:"Plus Jakarta Sans","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hz:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b24; --sunk:#232937; --fg:#e8ebf1; --soft:#a6aebd; --mute:#7c8496; --line:#2a303d;
  --mark:#5a4515; --on-acc:#0f1218; --shadow:0 18px 50px rgba(0,0,0,.6);
  --l1:#6fd08f; --l2:#5cc8cf; --l3:#6dbbea; --l4:#94a3f5; --l5:#bf9af0; --l6:#ec8dbd;
  --t1:#ff7a66; --t2:#f2a64a; --t3:#5fd38f; --t4:#79a6ff; --t5:#9aa39e;
  --s-red:#ff6b6b; --s-yellow:#f5d04a; --s-green:#62d26f; --s-none:#3a4150;
  --good:#5fd38f; --bad:#ff7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b24; --sunk:#232937; --fg:#e8ebf1; --soft:#a6aebd; --mute:#7c8496; --line:#2a303d;
  --mark:#5a4515; --on-acc:#0f1218; --shadow:0 18px 50px rgba(0,0,0,.6);
  --l1:#6fd08f; --l2:#5cc8cf; --l3:#6dbbea; --l4:#94a3f5; --l5:#bf9af0; --l6:#ec8dbd;
  --t1:#ff7a66; --t2:#f2a64a; --t3:#5fd38f; --t4:#79a6ff; --t5:#9aa39e;
  --s-red:#ff6b6b; --s-yellow:#f5d04a; --s-green:#62d26f; --s-none:#3a4150;
  --good:#5fd38f; --bad:#ff7a66; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body[data-level="1"]{--acc:var(--l1)} body[data-level="2"]{--acc:var(--l2)} body[data-level="3"]{--acc:var(--l3)}
body[data-level="4"]{--acc:var(--l4)} body[data-level="5"]{--acc:var(--l5)} body[data-level="6"]{--acc:var(--l6)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:calc(15px*var(--fs,1));line-height:1.5;padding-inline:16px;padding-block:0 40px;transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent}
.wrap{max-width:920px;margin:0 auto}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h2[tabindex]:focus{outline:none}
.s-red{background:var(--s-red)}.s-yellow{background:var(--s-yellow)}.s-green{background:var(--s-green)}.s-none{background:var(--s-none)}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.stack{display:flex;width:100%;height:100%;background:var(--sunk)}
.stack i{display:block;height:100%;transition:width .4s}
.mbar{display:block;width:76px;height:6px;border-radius:99px;overflow:hidden;flex:none}
.screen{animation:scrIn .22s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Home ---------- */
.home{max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.seal{width:40px;height:40px;flex:none;border-radius:12px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--f-hz);font-weight:900;font-size:calc(22px*var(--fs,1));transition:background .25s}
/* wordmark: XueCi (Ci in the level colour) over a spaced-out MANDARIN */
.wm{margin:0;display:flex;flex-direction:column;line-height:1;min-width:0}
.wm1{font-size:calc(23px*var(--fsd,1));font-weight:800;letter-spacing:-.045em;color:var(--fg);white-space:nowrap}
.wm1 i{font-style:normal;color:var(--acc);transition:color .25s}
.wm2{font-size:calc(9px*var(--fsd,1));font-weight:800;letter-spacing:.42em;text-transform:uppercase;color:var(--soft);margin-top:5px;white-space:nowrap}
/* current HSK level, beside the language button */
.curlv{height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:7px;padding:0 12px 0 11px;font-size:calc(12.5px*var(--fsd,1));font-weight:800;color:var(--fg);white-space:nowrap;--lc:var(--l1)}
.curlv i{width:9px;height:9px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 24%,transparent);flex:none}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--soft);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{color:var(--fg);border-color:var(--mute)}

.lvpills{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:10px}
.lvpill{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2;min-width:0;transition:background .2s,border-color .2s}
.lvpill b{font-size:calc(13px*var(--fsd,1));font-weight:800;white-space:nowrap}
.lvpill small{font-size:calc(10.5px*var(--fsd,1));font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.lvpill:hover{border-color:var(--lc)}
.lvpill[aria-pressed="true"]{background:var(--lc);border-color:var(--lc);color:var(--on-acc)}
.lvpill[aria-pressed="true"] small{color:inherit;opacity:.85}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;align-items:center;cursor:pointer;transition:border-color .2s,transform .12s}
.hero:hover{border-color:var(--acc)}
.ring{position:relative;width:clamp(100px,18.5vh,156px);height:clamp(100px,18.5vh,156px)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:var(--sunk)}
.ring .sg{transition:stroke-dasharray .6s ease,stroke-dashoffset .6s ease}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center}
.rc b{font-size:calc(clamp(26px,4.6vh,38px)*var(--fsd,1));font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rc small{font-size:calc(12.5px*var(--fs,1));font-weight:700;color:var(--soft);margin-top:3px}
.hlv{font-size:calc(12.5px*var(--fs,1));font-weight:800;color:var(--acc);margin-bottom:6px;white-space:nowrap}
.hkeys{display:flex;flex-direction:column;gap:4px}
.hkey{display:flex;align-items:center;gap:8px;font-size:calc(12.5px*var(--fs,1));color:var(--soft);line-height:1.25}
.hkey b{margin-left:auto;color:var(--fg);font-size:calc(14px*var(--fs,1));font-variant-numeric:tabular-nums}
.hfoot{display:flex;align-items:center;justify-content:space-between;gap:2px 10px;border-top:1px dashed var(--line);padding-top:6px;margin-top:6px;font-size:calc(12px*var(--fs,1));flex-wrap:wrap}
.hfoot .cnt{color:var(--soft);font-variant-numeric:tabular-nums}
.hfoot .cnt b{color:var(--fg)}
.hfoot .go{color:var(--acc);font-weight:800;white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:11px 11px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-height:clamp(84px,12.5vh,116px);transition:border-color .2s,transform .12s}
.tile .ic{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 15%,var(--surface));color:var(--acc);margin-bottom:4px}
.tile .ic svg{width:20px;height:20px}
.tile b{font-size:calc(15.5px*var(--fs,1));font-weight:800;line-height:1.2}
.tile small{font-size:calc(11.5px*var(--fsd,1));color:var(--soft);line-height:1.3;overflow-wrap:anywhere}
.tile b{overflow-wrap:anywhere}
/* larger phone text: the "14" mark under the stats scale makes room for the "20 · mature" label */
.bigtext .tile small{display:none}   /* larger phone text: Home still fits one screen */
.bigtext .scalelbl span:nth-child(3){display:none}.bigtext .scalelbl .end{grid-column:9/21}
.tile:hover{border-color:var(--acc)}
.tile:active,.hero:active{transform:scale(.98)}

/* menus (shared) */
.menu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px;min-width:280px}
.mhead{font-size:calc(12px*var(--fs,1));color:var(--soft);padding:6px 12px 6px;font-variant-numeric:tabular-nums}
.mhead b{color:var(--fg)}
.msep{height:1px;background:var(--line);margin:6px 8px}

/* study-language picker */
.langwrap{position:relative;flex:none}
.langbtn{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--soft);display:flex;align-items:center;gap:6px;padding:0 10px}
.langbtn svg{width:17px;height:17px}
.langbtn b{font-size:calc(12.5px*var(--fs,1));font-weight:800;letter-spacing:.05em;color:var(--fg)}
.langbtn:hover{color:var(--fg);border-color:var(--mute)}
.langbtn[aria-expanded="true"]{border-color:var(--acc)}
.langmenu{left:auto;right:0;min-width:240px}
.lgrow{width:100%;min-height:48px;border:0;border-radius:13px;background:transparent;display:flex;align-items:center;gap:12px;padding:7px 12px;text-align:left}
.lgrow:hover{background:var(--sunk)}
.lgrow .lgcode{width:34px;height:26px;flex:none;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:calc(11.5px*var(--fs,1));font-weight:800;letter-spacing:.05em;color:var(--soft)}
.lgrow .nm{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.lgrow b{font-size:calc(14.5px*var(--fs,1));font-weight:700}
.lgrow small{font-size:calc(11.5px*var(--fs,1));color:var(--soft)}
.lgrow .ck{width:16px;height:16px;flex:none;color:var(--acc);visibility:hidden}
.lgrow[aria-selected="true"]{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.lgrow[aria-selected="true"] .lgcode{background:var(--acc);color:var(--on-acc)}
.lgrow[aria-selected="true"] .ck{visibility:visible}
html[lang="th"] .id{font-style:normal}

/* ---------- Focused screens ---------- */
.focus[data-mode="card"],.focus[data-mode="quiz"],.stats{max-width:620px;margin:0 auto}
/* today's session spans every level, so the HSK and unit pickers are hidden there */
.focus[data-mode="session"]{max-width:620px;margin:0 auto}
.focus[data-mode="session"] #lvbtn,.focus[data-mode="session"] #ubtn{display:none}
.fbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px;transition:background .25s}
.frow{position:relative;display:flex;align-items:center;gap:8px}
.backbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--fg)}
.backbtn svg{width:19px;height:19px}
.backbtn:hover{border-color:var(--acc)}
.frow h2{margin:0 0 0 2px;flex:1 1 auto;min-width:0;font-size:calc(18px*var(--fsd,1));font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip{height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:6px;padding:0 9px 0 12px;font-size:calc(13.5px*var(--fsd,1));font-weight:800;white-space:nowrap}
.pchip svg{width:14px;height:14px;color:var(--mute);transition:transform .2s}
.pchip:hover,.pchip[aria-expanded="true"]{border-color:var(--acc)}
.pchip[aria-expanded="true"] svg{transform:rotate(180deg)}
#lvName{color:var(--acc)}
.frow .menu{left:auto;right:0;width:min(100%,440px)}
.lvrow{width:100%;min-height:52px;border:0;border-radius:13px;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;text-align:left}
.lvrow .l{display:flex;align-items:center;gap:10px;min-width:0}
.lvrow .r{display:flex;align-items:center;gap:10px;flex:none}
.lvrow:hover{background:var(--sunk)}
.lvrow[aria-selected="true"]{background:color-mix(in srgb,var(--lc) 13%,transparent)}
.lvrow[aria-selected="true"] b{color:var(--lc)}
.lvrow .nm{display:flex;flex-direction:column;line-height:1.25}
.lvrow b{font-size:calc(14.5px*var(--fs,1));font-weight:800}
.lvrow small{font-size:calc(11.5px*var(--fs,1));color:var(--soft);font-variant-numeric:tabular-nums}
.lvrow .mbar{width:92px}
.lvrow .pct{width:38px;text-align:right;font-size:calc(13.5px*var(--fs,1));font-weight:800;font-variant-numeric:tabular-nums}
.mstats{width:100%;border:0;background:transparent;color:var(--acc);font-size:calc(13.5px*var(--fs,1));font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px}
.mstats:hover{background:var(--sunk)}
.mstats span{display:flex;align-items:center;gap:8px}
.umenu{max-height:min(380px,60vh);overflow:auto;padding:8px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.ucell{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 8px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.ucell b{font-size:calc(13px*var(--fs,1));font-weight:800}
.ucell small{font-size:calc(11px*var(--fs,1));color:var(--soft);font-variant-numeric:tabular-nums}
.ucell .mbar{width:100%;height:5px}
.ucell:hover{border-color:var(--acc)}
.ucell[aria-current="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}
.ucell[aria-current="true"] b{color:var(--acc)}
.ucell.done b::after{content:" ✓";color:var(--s-green)}
.ucell.uall{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px}
.ucell.uall .mbar{flex:1;width:auto}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;height:40px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;font-size:calc(14px*var(--fs,1))}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute)}
.tchip{height:36px;border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:99px;padding:0 13px;font-size:calc(12.5px*var(--fs,1));font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tchip svg{width:14px;height:14px}
.tchip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surface))}
.meta{font-size:calc(12.5px*var(--fs,1));color:var(--soft);margin:0 0 10px;font-variant-numeric:tabular-nums}

/* list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ihead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.hz{font-family:var(--f-hz);font-weight:900;font-size:calc(26px*var(--fsd,1));line-height:1.1}
.py{font-weight:700;font-size:calc(14px*var(--fs,1))}
.nos{display:flex;gap:7px;align-items:center;flex:none}
.no{font-size:calc(11px*var(--fs,1));color:var(--mute);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.lvchip{font-size:calc(10.5px*var(--fs,1));font-weight:800;letter-spacing:.03em;border-radius:6px;padding:1px 6px;color:var(--on-acc)}
.mean{font-size:calc(14px*var(--fs,1))}
.mean b{font-weight:700}.mean span{color:var(--soft)}
.ex{border-top:1px dashed var(--line);padding-top:7px;margin-top:2px}
.zh{font-family:var(--f-zh);font-size:calc(15px*var(--fs,1));line-height:1.6}
.zh mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;font-weight:700}
.id{color:var(--soft);font-size:calc(12.5px*var(--fs,1));font-style:italic}
.hidemean .mean,.hidemean .id{filter:blur(6px);transition:filter .2s}
.hidemean .item:hover .mean,.hidemean .item:hover .id,.hidemean .item:focus-within .mean,.hidemean .item:focus-within .id{filter:none}
.more{display:block;margin:16px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 14px;font-size:calc(13px*var(--fs,1));font-weight:700}
.empty{padding:40px;text-align:center;color:var(--soft)}
.st{font-size:calc(12px*var(--fs,1));color:var(--soft);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}

/* flashcards */
.fcmeta{display:flex;justify-content:space-between;align-items:center;font-size:calc(12.5px*var(--fs,1));color:var(--soft);margin-bottom:10px;font-variant-numeric:tabular-nums}
.fcmeta .mbar{width:120px;height:5px}
.flip{perspective:1400px;height:340px;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.face:first-child{border-top:4px solid var(--acc)}
.face.back{transform:rotateY(180deg);align-items:stretch;text-align:left;justify-content:flex-start;overflow:auto}
.face .big{font-family:var(--f-hz);font-weight:900;font-size:calc(clamp(56px,16vw,92px)*var(--fsd,1));line-height:1}
.face .hint{position:absolute;bottom:14px;font-size:calc(12px*var(--fs,1));color:var(--mute)}
.face .st{position:absolute;top:14px;right:16px}
.face.back .hz{font-size:calc(34px*var(--fsd,1))}
.face.back .mean{font-size:calc(16px*var(--fs,1));margin-block:4px 8px}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fcbtns button{border:0;border-radius:14px;padding:13px;font-weight:800;font-size:calc(15px*var(--fs,1))}
.no-btn{background:var(--sunk);color:var(--bad)}
.yes-btn{background:var(--acc);color:var(--on-acc)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 12px;font-size:calc(13px*var(--fs,1));font-weight:600}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:10px}
.score{display:flex;gap:12px;font-size:calc(12.5px*var(--fs,1));color:var(--soft);font-variant-numeric:tabular-nums}
.score b{color:var(--fg);font-size:calc(14px*var(--fs,1))}
.qcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:22px;padding:20px 18px;text-align:center}
.qcard .big{font-family:var(--f-hz);font-weight:900;font-size:calc(clamp(48px,13vw,72px)*var(--fsd,1));line-height:1.1}
.qcard .q{color:var(--soft);font-size:calc(13px*var(--fs,1));margin-bottom:6px}
.opts{display:grid;gap:8px;margin-top:14px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:11px 14px;font-size:calc(15px*var(--fs,1));font-weight:600}
@media (hover:hover){.opts button:hover:not(:disabled){border-color:var(--acc)}}
.opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opts button.ng{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.feedback{margin-top:14px;text-align:left}
.feedback:empty{display:none}
.next{margin-top:14px;border:0;background:var(--acc);color:var(--on-acc);border-radius:13px;padding:12px 20px;font-weight:800;width:100%}
.foot-note{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:26px;font-size:calc(12px*var(--fs,1));color:var(--mute);text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;color:var(--soft)}
.legend b{font-family:var(--f-hz);font-size:calc(14px*var(--fs,1))}
.foot-note p{margin:0;max-width:640px;text-wrap:balance}
.foot-note a{color:var(--soft)}

/* quiz type dropdown */
.qsel{position:relative}
.qtbtn{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px 0 5px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:calc(13px*var(--fs,1));font-weight:800;white-space:nowrap}
.qtbtn svg{width:14px;height:14px;color:var(--mute);transition:transform .2s}
.qtbtn[aria-expanded="true"]{border-color:var(--acc)}
.qtbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.qti{width:48px;flex:none;height:28px;padding:0;border-radius:999px;display:grid;place-items:center;font-size:calc(11.5px*var(--fs,1));font-weight:800;letter-spacing:.02em;font-family:var(--f-zh),var(--f-ui);color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent);white-space:nowrap}
.qmenu{left:0;right:auto;top:calc(100% + 8px);width:min(330px,calc(100vw - 32px));min-width:0}
.qtrow{width:100%;border:0;background:transparent;border-radius:13px;display:flex;align-items:center;gap:12px;padding:9px 10px;text-align:left}
.qtrow:hover{background:var(--sunk)}
.qtrow .nm{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.qtrow b{font-size:calc(14px*var(--fs,1));font-weight:800}
.qtrow small{font-size:calc(11.5px*var(--fs,1));color:var(--soft)}
.qtrow .ck{width:16px;height:16px;flex:none;color:var(--acc);visibility:hidden}
.qtrow[aria-selected="true"]{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.qtrow[aria-selected="true"] .qti{background:var(--acc);color:var(--on-acc)}
.qtrow[aria-selected="true"] .ck{visibility:visible}

/* tone colours & info */
.excl{width:24px;height:24px;flex:none;border-radius:50%;border:1.8px solid currentColor;display:grid;place-items:center;font-size:calc(13px*var(--fs,1));font-weight:900;line-height:1;font-family:var(--f-ui)}
.toneinfo{display:flex;align-items:center;gap:10px;margin:14px auto 0;padding:8px 14px 8px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-size:calc(12.5px*var(--fs,1));font-weight:700;max-width:100%}
.toneinfo .excl{color:var(--acc)}
.toneinfo .tz{display:flex;gap:3px;font-family:var(--f-hz);font-weight:900;font-size:calc(15px*var(--fs,1));line-height:1}
.toneinfo .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toneinfo .chev{color:var(--mute);font-size:calc(16px*var(--fs,1));line-height:1}
.toneinfo:hover{border-color:var(--acc)}
.zp{font-size:calc(12.5px*var(--fs,1));line-height:1.45;color:var(--soft);margin:1px 0 3px;letter-spacing:.005em}
.zp mark{background:none;color:var(--acc);font-weight:700}
.spk{display:inline-grid;place-items:center;width:32px;height:32px;flex:none;padding:0;border:0;border-radius:50%;vertical-align:middle;
  background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);margin-left:8px}
.spk svg{width:17px;height:17px}
.spk.sm{width:26px;height:26px;margin-left:6px}.spk.sm svg{width:14px;height:14px}
.spk.lg{width:46px;height:46px;margin:6px auto 0;display:grid}.spk.lg svg{width:22px;height:22px}
.spk.on{background:var(--acc);color:var(--on-acc)}
.spk.on .w1{animation:spkw .9s ease-in-out infinite}.spk.on .w2{animation:spkw .9s ease-in-out .15s infinite}
@keyframes spkw{50%{opacity:.25}}
.head .spk{align-self:center}
.homeacts{display:flex;justify-content:center;align-items:stretch;gap:8px;margin-top:10px;max-width:100%}
/* Home fits one screen: less padding under it */
body[data-screen="home"]{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.homeacts .toneinfo{margin:0;min-width:0}
.bkbtn{flex:none;gap:7px;padding-left:13px}
.bkbtn svg{width:17px;height:17px;flex:none;color:var(--acc)}
.bkbtn .tl{color:var(--fg)}
@media (max-width:479px){.homeacts #toneInfo .tl{display:none}}
.bkopts{display:grid;gap:8px}
.bkopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.bkopt .bi{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.bkopt .bi svg{width:20px;height:20px}
.bkopt .bt{flex:1;min-width:0}.bkopt b{display:block;font-size:calc(15px*var(--fs,1));font-weight:800}.bkopt small{display:block;font-size:calc(12.5px*var(--fs,1));color:var(--soft);line-height:1.35}
.bkopt .chev{color:var(--mute);font-size:calc(18px*var(--fs,1))}
.bkopt:hover{border-color:var(--acc)}
/* when the last backup was made (v1.12); after a month a quiet dot on the Home button, no notification */
.bklast{margin:4px 2px 0;font-size:calc(12.5px*var(--fs,1));line-height:1.4;color:var(--mute)}
.bklast.old{color:var(--soft);font-weight:700}
.bklast.old::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s-yellow);margin-right:7px;vertical-align:1px}
.bkbtn{position:relative}
.bkbtn.due::before{content:"";position:absolute;z-index:3;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--s-yellow);box-shadow:0 0 0 2px var(--surface)}
.sheetwrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.scrim2{position:absolute;inset:0;background:rgba(10,12,18,.45);animation:fadeIn .25s ease both}
.isheet{position:relative;width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:26px 26px 0 0;box-shadow:var(--shadow);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .35s cubic-bezier(.22,1,.36,1) both}
@media (min-width:600px){.sheetwrap{align-items:center}.isheet{border-radius:26px}}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.ihead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ihead .excl{color:var(--acc)}
.ihead h2{margin:0;flex:1;font-size:calc(18px*var(--fs,1));font-weight:800}
.xbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);color:var(--soft);font-size:calc(20px*var(--fs,1));line-height:1}
.ilead{margin:0 0 12px;font-size:calc(13.5px*var(--fs,1));color:var(--soft)}
.tones{display:flex;flex-direction:column;gap:6px}
.tone{display:grid;grid-template-columns:34px 38px 40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--sunk)}
.tone .tz{font-family:var(--f-hz);font-weight:900;font-size:calc(24px*var(--fs,1));line-height:1;text-align:center}
.tone .tp{font-weight:800;font-size:calc(14px*var(--fs,1))}
.tone .tc{width:40px;height:24px}
.tone .tn{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.tone .tn b{font-size:calc(13.5px*var(--fs,1))}.tone .tn small{font-size:calc(11.5px*var(--fs,1));color:var(--soft)}
.tone .tm{font-size:calc(12px*var(--fs,1));color:var(--soft);font-style:italic;text-align:right}
.isec{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.isec h3{margin:0 0 4px;font-size:calc(14px*var(--fs,1));font-weight:800}
.isec p{margin:0 0 10px;font-size:calc(13px*var(--fs,1));color:var(--soft)}
.gh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:800;font-size:calc(14px*var(--fs,1))}
.gh svg{width:20px;height:20px;flex:none}.gh span:nth-child(2){flex:1}.gh .ext{opacity:.7}
.plink{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:700;font-size:calc(14px*var(--fs,1))}
.plink .ext{opacity:.6}
.isec .icred{margin:12px 0 0;font-size:calc(11.5px*var(--fs,1));color:var(--mute)}
.isec .icred a{color:var(--soft)}
@media (max-width:400px){.tone{grid-template-columns:30px 34px 34px minmax(0,1fr);gap:8px}.tone .tm{display:none}}

/* stats screen */
.stbody{display:flex;flex-direction:column;gap:12px}
.stbody .lvpills{margin-bottom:0}
.stsum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stsum .big{font-size:calc(28px*var(--fsd,1));font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stsum .big small{font-size:calc(14px*var(--fs,1));font-weight:700;color:var(--soft);margin-left:4px}
.stsum .tot{font-size:calc(13px*var(--fs,1));color:var(--soft);font-variant-numeric:tabular-nums}
.stbar{height:10px;border-radius:99px;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:calc(11.5px*var(--fs,1));color:var(--soft);line-height:1.3}
.key b{display:flex;align-items:center;gap:5px;font-size:calc(16px*var(--fs,1));color:var(--fg);font-variant-numeric:tabular-nums}
.scale{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:14px}
.scale i{border-radius:3px}
.scalelbl{display:grid;grid-template-columns:repeat(20,1fr);font-size:calc(11px*var(--fsd,1));color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.scalelbl .end{grid-column:15/21;text-align:right;font-weight:700;color:var(--soft)}
.grid-wrap{display:flex;flex-direction:column;gap:10px}
.ublock .ulabel{font-size:calc(11px*var(--fs,1));font-weight:800;color:var(--mute);letter-spacing:.06em;margin-bottom:5px;font-variant-numeric:tabular-nums}
.ublock .ulabel span{font-weight:600;letter-spacing:0}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(17px,1fr));gap:5px}
.dots button{border:0;padding:0;aspect-ratio:1;max-width:100%;border-radius:50%;cursor:pointer}
.dots button[aria-current="true"]{outline:2.5px solid var(--fg);outline-offset:1.5px}
.stdetail{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stdetail .w{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.stdetail .w .hz{font-size:calc(24px*var(--fs,1))}
.stdetail .hint{font-size:calc(13px*var(--fs,1));color:var(--mute)}
.ans{display:flex;gap:6px}
.ans button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 11px;font-size:calc(12.5px*var(--fs,1));font-weight:700}
.bkcode{display:block;width:100%;min-height:104px;max-height:32vh;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--sunk);color:var(--fg);padding:10px 12px;font:calc(12px*var(--fs,1))/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.bkmsg{margin:8px 0 0;font-size:calc(13px*var(--fs,1));color:var(--soft);min-height:1.2em}.bkmsg.bad{color:var(--bad)}
.bkrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.bkrow button{min-width:96px}
.ghost.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:800}
.stfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.stfoot p{margin:0;font-size:calc(12px*var(--fs,1));color:var(--mute);flex:1 1 220px}
.danger{border:1.5px solid color-mix(in srgb,var(--bad) 50%,var(--line));background:transparent;color:var(--bad);border-radius:11px;padding:8px 12px;font-size:calc(13px*var(--fs,1));font-weight:800}
.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--on-acc)}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:calc(13px*var(--fs,1));font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:11px;font-size:calc(13px*var(--fs,1));font-weight:700;z-index:60;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

/* ---------- guided learning ---------- */
/* Home: today's plan */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:11px 14px 13px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.pmain{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
/* the text keeps at least ~150px (scaled with the phone's text size); when it can't, the button moves below it and
   spans the card, instead of squeezing the text into a column of single words (big text, long labels) */
.ptxt{flex:999 1 calc(150px*var(--fs,1));min-width:0;display:flex;flex-direction:column;gap:3px}
.pmain .planbtn{flex:1 0 auto}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.ptop h2{margin:0;font-size:calc(17px*var(--fsd,1));font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.gchip{height:32px;min-width:0;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:calc(12.5px*var(--fs,1));font-weight:800;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pline{font-size:calc(15px*var(--fs,1));font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.pline span{color:var(--soft);font-weight:600}
.pst{display:flex;align-items:baseline;gap:7px;font-size:calc(12.5px*var(--fs,1));color:var(--soft);line-height:1.4}
.pst .sd{flex:none;transform:translateY(-1px)}
.planbtn{flex:none;border:0;border-radius:999px;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:calc(15px*var(--fs,1));padding:12px 18px 12px 15px;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.planbtn.wide{width:100%;margin:4px 0 12px;padding:13px 16px}
.planbtn svg{width:15px;height:15px;flex:none}
/* goal sheet */
.gsec{margin-top:12px}
.glbl{display:block;font-size:calc(11.5px*var(--fs,1));font-weight:800;color:var(--soft);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.gsegs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.gsegs.lv{grid-auto-flow:row;grid-template-columns:repeat(6,minmax(0,1fr))}
.gseg,.gnum{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:13px;padding:9px 4px;font-size:calc(13px*var(--fs,1));font-weight:700;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.gseg[aria-pressed="true"],.gnum[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.gsegs.lv .gseg{font-size:calc(12px*var(--fs,1));padding:9px 0}
.gsegs.lv .gseg[aria-pressed="true"]{background:var(--lc);border-color:var(--lc)}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gnum{padding:7px 12px;border-radius:999px}
.gdate{width:100%;height:44px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--fg);font:inherit;font-size:calc(15px*var(--fs,1));padding:0 12px}
.gfc{margin-top:14px;padding:11px 13px;border-radius:14px;background:var(--sunk);font-size:calc(13.5px*var(--fs,1));line-height:1.45}
.gfc.good{background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.gfc.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.gfix{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.gfix .ghost{font-weight:700}
.bkrow button:disabled{opacity:.45}
/* cards: claim → check → result */
/* during the quick check the card shrinks to the word, so the options fit on the screen */
.flip.checking{height:230px}.flip.checking .face .hint{display:none}
.fcact{margin-top:12px}
.chk{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px}
.chk .q{font-size:calc(13px*var(--fs,1));font-weight:800;color:var(--acc);margin-bottom:8px;text-align:center}
.chk .opts{margin-top:0}
.res{font-size:calc(13.5px*var(--fs,1));font-weight:700;padding:10px 13px;border-radius:14px;margin-bottom:10px;line-height:1.4}
.res.ok{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.res.over{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.res.no,.res.trust{color:var(--soft);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.fcbtns.one{grid-template-columns:1fr}
.fcbtns .next{margin-top:0}
.face .newtag{font-weight:800;color:var(--acc)}
.fcmeta .tlabel{font-weight:800;color:var(--acc);margin-left:auto;margin-right:10px}
/* questions */
.pyo{font-weight:700;letter-spacing:.01em}
.hzo{font-family:var(--f-hz);font-weight:900;font-size:calc(20px*var(--fs,1))}

/* ---------- v1.10: realms, breakthrough, Soul Sea, rest ---------- */
:root{--gold:#b07d1f;--el-wood:#2f9a55;--el-fire:#d4483a;--el-earth:#a87a1c;--el-metal:#7c8799;--el-water:#2a74c4}

p.lvsrc{display:block;margin:6px auto 12px;text-align:center}

<script>
/* ---- store.js ---- */
/* ================= Progress store =================
   Everything a learner has done stays on this device, in the WebView's IndexedDB (database "xueci", object store
   "kv"). Keys and values are the same as before v1.12: JSON text under the old key names, which must never be renamed.
   The app reads and writes through `ls` without waiting. On start every key is loaded into memory, and each change is
   written to IndexedDB right after (all changes of one moment in a single transaction) and also copied to
   localStorage as a safety copy. If IndexedDB can't be opened, the app keeps working on localStorage alone, as it
   did before v1.12.

   Schema versions (stored under xc_schema):
     1  up to v1.7   mm_stats {id: [right, wrong] or [right, wrong, level]}, hsk16_known (an older list of known
                     words), mm_lang, hsk16_ui, hsk16_theme
     2  v1.8–v1.11   + xc_mem, xc_log, xc_logA, xc_goal, xc_w, xc_fit, xc_onb, xc_lvl, xc_rem, xc_tests, xc_rest,
                     xc_game, xc_amb, xc_note (all in localStorage)
     3  v1.12        everything in IndexedDB; new: xc_days (study days brought back by a backup code), xc_bk (when the
                     last backup code was made)
   Migrations run in order, once, on the data in memory, and never delete a key. */
const STORE = (() => {
  const SCHEMA = 3,
    DB = 'xueci',
    OS = 'kv';
  const mem = new Map();
  let db = null,
    mode = 'ls',
    from = SCHEMA,
    dirty = new Set(),
    queued = false,
    fails = 0;

  const lsSet = (k, v) => {
    try {
      if (v == null) localStorage.removeItem(k);
      else localStorage.setItem(k, v);
    } catch (e) {
      /* full or blocked: the safety copy is best effort */
    }
  };
  const lsAll = () => {
    const out = new Map();
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i),
          v = localStorage.getItem(k);
        if (v != null) out.set(k, v);
      }
    } catch (e) {}
    return out;
  };

  function openDb() {
    return new Promise((resolve, reject) => {
      if (typeof indexedDB === 'undefined' || !indexedDB) return reject(new Error('no IndexedDB'));
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(OS);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.onblocked = () => reject(new Error('IndexedDB blocked'));
      setTimeout(() => reject(new Error('IndexedDB timeout')), 5000);
    });
  }
  function readAll(d) {
    return new Promise((resolve, reject) => {
      const tx = d.transaction(OS, 'readonly'),
        st = tx.objectStore(OS),
        keys = st.getAllKeys(),
        vals = st.getAll();
      tx.oncomplete = () => resolve(new Map(keys.result.map((k, i) => [String(k), vals.result[i]])));
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
  }

  /* load everything into memory: IndexedDB when it already holds the data, otherwise the data in localStorage
     (the first start of v1.12, or IndexedDB was emptied) which is then written to IndexedDB in one go */
  async function open() {
    try {
      db = await openDb();
      const saved = await readAll(db);
      mode = 'idb';
      if (saved.has('xc_schema')) {
        saved.forEach((v, k) => mem.set(k, v));
        return;
      }
      lsAll().forEach((v, k) => {
        mem.set(k, v);
        dirty.add(k);
      });
    } catch (e) {
      db = null;
      mode = 'ls';
      lsAll().forEach((v, k) => mem.set(k, v));
    }
    try {
      navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {});
    } catch (e) {}
  }

  const J = k => {
    try {
      return JSON.parse(mem.get(k));
    } catch (e) {
      return null;
    }
  };
  /* the schema version of the data in memory: stored, or recognised from the keys an older version wrote */
  function version() {
    const v = +J('xc_schema');
    if (v) return v;
    const keys = [...mem.keys()];
    if (keys.some(k => k.startsWith('xc_'))) return 2;
    if (mem.has('mm_stats') || mem.has('hsk16_known')) return 1;
    return SCHEMA;
  }
  const MIGRATIONS = {
    /* 1 → 2: per-word records become [right, wrong, level]; a list of known words from the oldest versions becomes
       records (only words that still exist) */
    1(ctx) {
      let st = J('mm_stats');
      if (!st || typeof st !== 'object' || Array.isArray(st)) {
        st = {};
        const known = J('hsk16_known');
        if (Array.isArray(known))
          known.forEach(id => {
            if (ctx.ids.has(id)) st[id] = [1, 0];
          });
      }
      for (const k in st) {
        const e = st[k];
        if (!Array.isArray(e)) {
          delete st[k];
          continue;
        }
        if (e.length < 3) e[2] = Math.max(0, Math.min(20, (e[0] | 0) - (e[1] | 0)));
      }
      put('mm_stats', JSON.stringify(st));
    },
    /* 2 → 3: the data moves to IndexedDB unchanged (done by open()); nothing to convert */
    2() {},
  };
  function migrate(ctx) {
    from = version();
    for (let v = from; v < SCHEMA; v++) MIGRATIONS[v](ctx);
    if (J('xc_schema') !== SCHEMA) put('xc_schema', String(SCHEMA));
    flush();
  }

  function put(k, v) {
    if (v == null) mem.delete(k);
    else mem.set(k, v);
    lsSet(k, v);
    dirty.add(k);
    if (!queued) {
      queued = true;
      setTimeout(flush, 0);
    }
  }
  /* all changes waiting are written in one transaction; on a failure they are tried again a little later, and
     after three failures the app keeps going on localStorage */
  function flush() {
    queued = false;
    if (mode !== 'idb' || !db || !dirty.size) return;
    const keys = [...dirty];
    dirty.clear();
    const retry = () => {
      keys.forEach(k => dirty.add(k));
      if (++fails >= 3) {
        mode = 'ls';
        return;
      }
      setTimeout(flush, 1500);
    };
    try {
      const tx = db.transaction(OS, 'readwrite'),
        st = tx.objectStore(OS);
      for (const k of keys) {
        const v = mem.get(k);
        if (v == null) st.delete(k);
        else st.put(v, k);
      }
      tx.oncomplete = () => {
        fails = 0;
      };
      tx.onerror = tx.onabort = retry;
    } catch (e) {
      retry();
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) flush();
  });

  return {
    open,
    migrate,
    put,
    flush,
    SCHEMA,
    get: k => (mem.has(k) ? mem.get(k) : null),
    keys: () => [...mem.keys()],
    info: () => ({ mode, from, schema: SCHEMA, keys: mem.size }),
  };
})();

/* the app's view of the store: JSON values under the old key names */
const ls = {
  get(k, f) {
    const v = STORE.get(k);
    if (v == null) return f;
    try {
      return JSON.parse(v);
    } catch (e) {
      return f;
    }
  },
  set(k, v) {
    let s;
    try {
      s = JSON.stringify(v);
    } catch (e) {
      return;
    }
    STORE.put(k, s);
  },
  remove(k) {
    STORE.put(k, null);
  },
};
/* ---- boot.js ---- */
/* ================= Start-up =================
   The page shows only the background glow while it starts: the theme and the level colour are set at once from the
   localStorage safety copy (so a dark theme never flashes white), then
     1. the progress store is opened (store.js),
     2. the word data is loaded from beside the page: data/core.json (hanzi, pinyin, example sentences, levels) and the
        meanings in the study language (data/<lang>.json); other languages load when they are chosen,
     3. old saved data is migrated to the current schema,
     4. the app runs (script #xc-app), then the Liquid Glass layer (script #xc-glass). Both are run as ordinary
        scripts, so everything they declare is global, as before. */
const LANGS = ['id', 'en', 'th', 'vi'];
/* 'auto' follows the phone/browser language; unsupported languages fall back to English */
function sysLang() {
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
  for (const n of list) {
    const c = String(n).toLowerCase().slice(0, 2);
    if (c === 'id' || c === 'in' || c === 'ms') return 'id';
    if (c === 'en' || c === 'th' || c === 'vi') return c;
  }
  return 'en';
}
const XC = (() => {
  const root = document.documentElement;
  root.classList.add('booting');
  try {
    const t = JSON.parse(localStorage.getItem('hsk16_theme'));
    if (t && t !== 'auto') root.setAttribute('data-theme', t);
    const ui = JSON.parse(localStorage.getItem('hsk16_ui'));
    if (ui && ui.level >= 1 && ui.level <= 6) document.body.dataset.level = ui.level;
  } catch (e) {}

  const COLS = { id: ['m', 't'], en: ['em', 'et'], th: ['hm', 'ht'], vi: ['vm', 'vt'] };
  const have = new Set();
  let data = null;
  const get = path =>
    fetch(path).then(r => {
      if (!r.ok) throw new Error(path + ' ' + r.status);
      return r.json();
    });
  function addLang(l, j) {
    const [a, b] = COLS[l];
    if (!j || j.rows.length !== data.length) throw new Error('data/' + l + '.json does not match the word list');
    j.rows.forEach((r, i) => {
      data[i][a] = r[0];
      data[i][b] = r[1];
    });
    have.add(l);
  }
  function loadLang(l) {
    if (have.has(l)) return Promise.resolve();
    return get(`data/${l}.json`).then(j => addLang(l, j));
  }
  function run(id) {
    const s = document.createElement('script');
    s.textContent = document.getElementById(id).textContent;
    document.body.appendChild(s);
  }
  function fail(e) {
    console.error(e);
    root.classList.remove('booting');
    document.body.insertAdjacentHTML(
      'beforeend',
      '<p class="bootfail">Data kata gagal dimuat. Tutup aplikasi lalu buka lagi.<br>The word list could not be loaded. Close the app and open it again.</p>',
    );
  }
  async function start() {
    const core = get('data/core.json');
    await STORE.open();
    const pref = ls.get('mm_lang', 'auto'),
      lang = pref !== 'auto' && LANGS.includes(pref) ? pref : sysLang();
    const [c, m] = await Promise.all([core, get(`data/${lang}.json`)]);
    data = c.rows.map(r => {
      const d = {};
      c.cols.forEach((k, i) => {
        if (r[i] != null) d[k] = r[i];
      });
      return d;
    });
    addLang(lang, m);
    STORE.migrate({ ids: new Set(data.map(d => d.l + ':' + d.h)) });
    run('xc-app');
    run('xc-glass');
    root.classList.remove('booting');
  }
  start().catch(fail);
  return {
    get data() {
      return data;
    },
    loadLang,
    has: l => have.has(l),
  };
})();

      }
      if (isRest(d)) {
        n++;
        continue;
      }
      if (grace - d >= 7 || grace === -99) {

  let game = ls.get('xc_game', {});
  if (!game || typeof game !== 'object') game = {};
  /* today's challenge: the learner's weakest skill, with a target a bit above their own last-7-days level

  const SKQ = { m: ['m', 'cm'], f: ['f', 'c'], s: ['s', 'l', 'cs'] };
  function challenge() {
    const today = dayOf(now());
    if (!game.chal || game.chal.day !== today) {
      const L = allLog(),
        cnt = { m: 0, f: 0, s: 0 },
        ok = { m: 0, f: 0, s: 0 },
        days = new Set();
      for (let i = L.length - 1; i >= 0; i--) {
        const e = L[i],
          d = dayOf(e[0]);
        if (d >= today) continue;
        if (today - d > 7) break;
        if (e[6] & 24) continue;
        for (const k in SKQ)
          if (SKQ[k].includes(e[2])) {
            cnt[k]++;
            if (e[3] > 1) ok[k]++;
            days.add(d);
          }
      }
      const acc = k => (cnt[k] >= 8 ? ok[k] / cnt[k] : null);
      let k = 'm';
      const cand = ['s', 'f', 'm'].filter(x => acc(x) !== null).sort((a, b) => acc(a) - acc(b));
      if (cand.length) k = cand[0];
      else if (cnt.m >= 8) k = 'f';
      const perDay = days.size ? cnt[k] / days.size : 0;
      game.chal = {
        day: today,
        k,
        n: cl(Math.round((perDay * 1.15) / 5) * 5 || 10, 10, 30),
        a: acc(k) === null ? 75 : cl(Math.round((acc(k) * 100 + 10) / 5) * 5, 70, 95),
        done: false,
      };

    }
    const c = game.chal,
      L = allLog();
    let n = 0,
      o = 0;
    for (let i = L.length - 1; i >= 0; i--) {
      const e = L[i];
      if (dayOf(e[0]) !== today) break;
      if (e[6] & 24) continue;
      if (SKQ[c.k].includes(e[2])) {
        n++;
        if (e[3] > 1) o++;
      }
    }
    const acc = n ? Math.round((o / n) * 100) : 0,
      done = n >= c.n && acc >= c.a;
    if (done && !c.done) {
      c.done = true;
      game.chalN = (game.chalN || 0) + 1;
      ls.set('xc_game', game);

  /* ---- rest: the memory model's own numbers ---- */
  /* what one more right answer adds to a word's memory now vs after a night's sleep vs after 2 days (in days) */
  function restGain() {
    const e = Object.values(mem).filter(x => x.w[1] >= 1);
    if (!e.length) return null;
    const med = a => {
        a = a.slice().sort((x, y) => x - y);
        return a[a.length >> 1];
      },
      D = med(e.map(x => x.w[0])),
      S = med(e.map(x => x.w[1])),
      t0 = 1e6;
    const g = dt => step(W, [D, S, t0], 3, t0 + dt)[1] - S;
    return { now: g(10), day: g(1440), two: g(2880), S };
  }
  function gainList(words) {
    let a = 0,
      b = 0,
      n = 0;
    const t = now();
    for (const d of words) {
      const e = mem[d.id];
      if (!e || dayOf(e.w[2]) !== dayOf(t)) continue;
      n++;
      a += step(W, e.w, 3, t)[1] - e.w[1];
      b += step(W, e.w, 3, e.w[2] + 1440 * 1.5)[1] - e.w[1];

  /* days since the last practice and how much is still remembered (shown after a break) */
  function sinceLast() {
    const L = allLog();
    for (let i = L.length - 1; i >= 0; i--)
      if (!(L[i][6] & 16)) {
        const gap = dayOf(now()) - dayOf(L[i][0]);
        let rs = 0,
          rn = 0;
        const t = now();
        for (const id in mem) {

      }

  }

  /* ---- the five elements of the soul (五行), each 0–100 for the wheel ----
   Each one is a count against a fixed scale, so none fills up from a handful of answers (v1.12):
   土 根基 foundation = realm progress: solid words of the realm's level (+ half the placement test's estimate)
   木 修为 cultivation = memory days stored over all words (log scale; every word remembered 4 months = 100)
   水 神识 spiritual sense = words of the realm's level you'd recall right now (sum of recall chances ÷ the level's words)
   金 道心 dao heart = "I know it" claims that held up — checked at once, or by the next answer within 14 days —

  const DAO_A = 20;
  function daoStat() {
    const L = allLog(),

      const id = e[1],
        q = e[2],
        f = e[6];
      if (f & 2 && (q === 'cm' || q === 'cs')) {
        n++;
        if (e[3] > 1) c++;
        open.delete(id);
        continue;
      }
      if (f & 2 && f & 1) {
        open.set(id, e[0]);
        continue;
      }
      if (open.has(id) && (QUIZ.has(q) || q === 'cn') && !(f & 32)) {
        const t = open.get(id);
        open.delete(id);
        if (e[0] - t <= 14 * 1440) {
          n++;

  }
  function soul() {
    const t = now(),
      r = realm(),
      L = r < 1 ? baseLevel() : Math.min(6, r),
      st = stage(r < 1 ? L : r),
      es = Object.values(mem);
    let X = 0;
    for (const e of es) X += Math.min(e.w[1], 365);
    let rs = 0;
    for (const d of BY[L]) {
      const e = mem[d.id];
      if (e) rs += rNow(e, t);
    }
    const ks = es
        .filter(e => e.k && e.i)
        .map(e => (e.k - e.i) / 1440)
        .filter(x => x >= 0)
        .sort((a, b) => a - b),
      dao = daoStat();
    const v = x => (x === null ? null : Math.round(cl(x, 0, 100)));
    return {
      L,
      root: v(st ? st.share * 100 : es.length ? 0 : null),
      cult: v((100 * Math.log(1 + X / 100)) / Math.log(1 + (5334 * 120) / 100)),
      cultDays: Math.round(X),
      sense: v(es.length ? (rs / BY[L].length) * 100 : null),
      senseN: Math.round(rs),
      senseOf: BY[L].length,
      dao: v(dao.n >= 5 ? dao.score * 100 : null),
      daoN: dao.n,
      daoOk: dao.c,
      insight: v(ks.length >= 10 ? (100 * (30 - ks[ks.length >> 1])) / 26 : null),
      insightDays: ks.length >= 10 ? Math.round(ks[ks.length >> 1]) : null,

  }

  /* ---- guidance (指点): what to work on to move up, and when the next stage is likely ----
   Everything is read from the memory model: a word is solid at level 10+ with a passed recall (f) and tone (s)
   question, so the quickest wins are words already at level 10 that miss one of those answers. Young words need time:
   their expected days to solid come from simulating FSRS with right answers on the due dates. */
  const SOLID_S = Math.pow(121, 0.5) - 1; /* stability (days) that gives level 10 */
  function daysToSolid(e, t) {
    let D = e.w[0],
      S = e.w[1],
      d = Math.max(0, (e.w[2] + ivl(S, 0.9) * 1440 - t) / 1440),
      n = 0;
    while (S < SOLID_S && n < 30) {
      const gap = Math.max(1, ivl(S, 0.9));
      const st = step(W, [D, S, 0], 3, gap * 1440);
      D = st[0];
      S = st[1];
      if (S >= SOLID_S) break;
      d += gap;
      n++;
    }
    return Math.min(365, d);
  }
  function advice() {
    const t = now(),
      r = realm(),
      L = r < 1 ? baseLevel() : Math.min(6, r),
      Wd = BY[L],
      R0 = dr(),
      out = [];
    const neu = [],
      young = [],
      needF = [],
      needS = [],
      due = [];
    for (const d of Wd) {
      const e = mem[d.id];
      if (!e) {
        neu.push(d);
        continue;
      }
      if (rNow(e, t) < R0) due.push(d);
      if (solid(e)) continue;
      if (levelOf(e) >= 10 || e.w[1] >= SOLID_S) {
        if (!okS(e.f)) needF.push(d);
        else if (!okS(e.s)) needS.push(d);
      } else young.push(e);
    }
    if (r < 1 && canTest()) out.push({ k: 'test' });
    if (needF.length) out.push({ k: 'f', n: needF.length, words: needF.slice(0, 12), L });
    if (needS.length) out.push({ k: 's', n: needS.length, words: needS.slice(0, 12), L });
    if (due.length) out.push({ k: 'due', n: due.length, L });
    const I = insights();
    if (I.weak) out.push({ k: 'skill', q: I.weak, p: I.skills[I.weak].p });
    if (young.length) {
      const ds = young
        .slice(0, 300)
        .map(e => daysToSolid(e, t))
        .sort((a, b) => a - b);
      out.push({ k: 'young', n: young.length, days: Math.max(1, Math.round(ds[ds.length >> 1])), L });
    }
    if (neu.length) out.push({ k: 'new', n: neu.length, L });
    const pr = [...confs()].filter(p => p[1] >= 2).sort((a, b) => b[1] - a[1])[0];
    if (pr) {
      const [a, b] = pr[0].split('|');
      if (IDX.has(a) && IDX.has(b)) out.push({ k: 'conf', a: IDX.get(a), b: IDX.get(b), n: pr[1] });
    }
    const c = calib();
    if (c.n >= 8 && c.acc < 0.75) out.push({ k: 'dao', p: Math.round(c.acc * 100) });
    return { L, items: out };
  }
  /* when the next stage (and 圆满) is likely: new solid words of the level over the last 14 days */
  function forecast() {
    const r = realm(),
      L = r < 1 ? baseLevel() : Math.min(6, r),
      st = stage(r < 1 ? L : r);
    if (!st || r > 6) return null;
    /* progress gained by words that became solid in the last 14 days (a word the test already credited adds the rest) */
    const t = now(),
      P = testP(L);
    let n = 0;
    BY[L].forEach((d, j) => {
      const e = mem[d.id];
      if (e && e.k && t - e.k < 14 * 1440 && solid(e)) n += P ? 1 - 0.5 * P[j] : 1;
    });
    const done = st.share * st.total,
      rate = n / 14,
      T = [0.25, 0.5, 0.8],
      next = st.i < 3 ? Math.max(0, Math.ceil(st.total * T[st.i] - done)) : 0;
    return {
      rate,
      week: Math.round(rate * 7),
      next,
      need: st.need,
      dNext: rate > 0 && next ? Math.ceil(next / rate) : null,
      dFull: rate > 0 && st.need ? Math.ceil(st.need / rate) : null,
    };
  }
  /* chance to pass a breakthrough now: every bank word is answered right with its recall chance (plus a little
   guessing when it is forgotten); the score of 20 is about normal, so P(score ≥ needed) follows from mean and spread */
  function btChance() {
    const r = realm();
    if (r < 1 || r > 6) return null;
    placementBank();
    const t = now(),
      bank = PB[r].length >= 20 ? PB[r] : BY[r],
      hard = r >= 4 ? 0.9 : 0.95;
    let s = 0,
      v = 0;
    for (const d of bank) {
      const e = mem[d.id],
        R = e ? rNow(e, t) : 0,
        p = Math.min(0.99, R * hard + (1 - R * hard) * 0.12);
      s += p;
      v += p * (1 - p);
    }
    const n = bank.length,
      N = 20,
      m = (N * s) / n,
      sd = Math.sqrt(Math.max(0.25, (N * v) / n)),
      need = Math.ceil(N * (r >= 5 ? 0.8 : 0.75)),
      z = (need - 0.5 - m) / sd;
    const phi = x => {
      const k = 1 / (1 + 0.2316419 * Math.abs(x)),
        y =
          0.3989423 *
          Math.exp((-x * x) / 2) *
          k *
          (0.3193815 + k * (-0.3565638 + k * (1.781478 + k * (-1.821256 + k * 1.330274))));
      return x > 0 ? 1 - y : y;
    };

  /* ---- goals and the daily plan ---- */
  function validGoal(g) {
    return (
      !!g &&
      typeof g === 'object' &&
      ['level', 'exam', 'none'].includes(g.t) &&
      (g.t === 'none' || (LEVELS.includes(g.lv) && /^\d{4}-\d\d-\d\d$/.test(g.date || ''))) &&
      ['min', 'new', 'auto'].includes(g.pace) &&
      (g.pace === 'auto' || g.n > 0)
    );
  }
  function daysTo(date) {
    const [y, m, d] = date.split('-').map(Number),
      a = new Date(y, m - 1, d),
      b = new Date();
    b.setHours(0, 0, 0, 0);
    return Math.round((a - b) / 864e5);
  }
  function dayAfter(n) {
    const d = new Date();
    d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + Math.round(n));
    return d;
  }
  const isoDay = d =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  /* seconds per review / per new word, learned from your own answering speed */
  function pace() {
    const L = allLog(),
      a = [],
      c = [];
    for (let i = L.length - 1; i >= 0 && i > L.length - 600; i--) {
      const e = L[i];
      if (QUIZ.has(e[2])) a.push(e[4] / 10);
      else if (e[2][0] === 'c') c.push(e[4] / 10);
    }
    const med = x => {
      x.sort((p, q) => p - q);
      return x[x.length >> 1];
    };
    return { rev: a.length >= 15 ? cl(med(a) + 4, 5, 30) : 10, neu: c.length >= 10 ? cl(med(c) + 24, 18, 60) : 30 };
  }
  /* days until every target word has been introduced; with a minutes-per-day budget the reviews of words already
   learned take a growing share of the time (about 0.08 reviews a day per word), so fewer new words fit later on */
  function finishDays(g, nd, remaining, load, sp) {
    if (g.pace !== 'min') return nd > 0 ? Math.ceil(remaining / nd) : null;
    const perNew = sp.neu + 2.5 * sp.rev;
    let rem = remaining,
      l = load,
      d = 0;
    while (rem > 0 && d < 1500) {
      const n = cl(Math.floor((g.n * 60 - l * sp.rev) / perNew), 0, 40);
      if (n <= 0) return null;
      rem -= n;
      l += n * 0.08;
      d++;
    }
    return rem > 0 ? null : d;
  }
  /* the fewest minutes a day that still introduce every target word in time (null if even 4 hours a day can't) */
  function minutesFor(remaining, load, sp, limit) {
    const fd = m => finishDays({ pace: 'min', n: m }, 0, remaining, load, sp);
    const ok = m => {
      const d = fd(m);
      return d !== null && d <= limit;
    };
    if (!ok(240)) return null;
    let lo = 1,
      hi = 240;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      if (ok(m)) hi = m;
      else lo = m + 1;
    }
    return lo;
  }
  function plan(g = goal) {
    const t = now(),
      today = dayOf(t),
      r = dr(g),
      sp = pace();
    let due = 0,
      load = 0,
      introT = 0;
    const pre = isRest(today + 1) ? 1440 : 0; /* before a meditation day, tomorrow's reviews are pulled into today */
    for (const id in mem) {
      const e = mem[id];
      if (rNow(e, t + pre) < r) due++;
      load += 1 / Math.max(1, ivl(e.w[1], r));
      if (e.i && !e.p && dayOf(e.i) === today) introT++;
    }
    let ansT = 0,
      secT = 0;
    const L = allLog();
    for (let i = L.length - 1; i >= 0; i--) {
      const e = L[i];
      if (dayOf(e[0]) !== today) break;
      ansT++;
      secT += e[4] / 10 + 4;
    }
    const P = { t: g ? g.t : 'none', due, introT, ansT, minT: Math.round(secT / 60), sp };
    let remaining = null,
      need = 0,
      days = null,
      buffer = 0;
    /* words below the starting level count as known; a goal below it is already reached */
    if (g && g.t !== 'none') {
      const lo = baseLevel(),
        tw = g.lv >= lo ? DATA.filter(d => d.l <= g.lv && d.l >= lo) : [];
      remaining = tw.filter(d => !mem[d.id]).length;
      days = daysTo(g.date);
      buffer =
        g.t === 'exam'
          ? Math.min(7, Math.floor(Math.max(0, days) / 4))
          : Math.min(3, Math.floor(Math.max(0, days) / 5));
      need = remaining ? Math.ceil(remaining / Math.max(1, days - buffer)) : 0;
      P.lv = g.lv;
      P.date = g.date;
    }
    P.remaining = remaining;
    P.need = need;
    P.days = days;
    const perNew = sp.neu + 2.5 * sp.rev;
    let nd;
    if (g && g.pace === 'min') nd = cl(Math.floor((g.n * 60 - load * sp.rev) / perNew), 0, 40);
    else if (g && g.pace === 'new') nd = g.n;
    else nd = remaining !== null ? cl(need, 3, 40) : 10;
    if (remaining === 0) nd = 0;
    if (g && g.t === 'exam' && days !== null && days <= 7) nd = 0;
    if (remaining !== null && remaining > 0) nd = Math.min(nd, remaining);
    P.newPerDay = nd;
    P.revPerDay = Math.round(load + nd * 2.5);
    P.minutes = Math.max(1, Math.round((P.revPerDay * sp.rev + nd * sp.neu) / 60));
    P.needMin = remaining ? minutesFor(remaining, load, sp, Math.max(1, days - buffer)) : null;
    P.newToday = Math.max(0, nd - introT);
    /* reviews today are capped by the daily time (or 1.5× a normal day), most at-risk first, so days off never pile up */
    let cap = Math.max(0, Math.max(20, Math.round(P.revPerDay * 1.5)) - ansT);
    if (g && g.pace === 'min') cap = Math.max(0, Math.floor((g.n * 60 - secT - P.newToday * sp.neu) / sp.rev));
    P.revToday = Math.min(due, cap);
    if (!g || g.t === 'none') P.status = 'free';
    else if (days < 0) P.status = 'past';
    else if (remaining === 0) P.status = 'review';
    else if (g.t === 'exam' && days <= 7) P.status = 'examweek';
    else {
      const fd = finishDays(g, nd, remaining, load, sp);
      P.finish = fd === null ? null : dayAfter(fd);
      P.status = fd !== null && fd <= days - buffer ? 'ok' : 'behind';
      /* a later date that works: at this pace, or (if the reviews would fill the time first) at 20 new words a day */
      if (P.status === 'behind') {
        const fdays = fd === null ? Math.ceil(remaining / 20) + buffer : fd + buffer;
        P.fixDate = fdays > days ? dayAfter(fdays) : null;
      }

      P.newToday = 0;
      P.revToday = 0;

    return P;
  }
  /* today's session: due reviews (most at risk first), up to three old green words to confirm, new words as cards
   (in curriculum order from the current level up to the goal's level) */
  function session(extra) {
    const P = plan(),
      t = now(),
      r = dr();
    const lo = curLevel(),
      src = tsort(DATA.filter(d => d.l >= lo && (!goal || goal.t === 'none' || d.l <= Math.max(goal.lv, lo))));
    let rev = [],
      conf = [];
    const all = [];
    for (const id in mem) {
      const e = mem[id];
      all.push([rNow(e, t), IDX.get(id), e]);
    }
    all.sort((a, b) => a[0] - b[0]);
    if (extra) {
      const td = dayOf(t);
      rev = all
        .filter(p => dayOf(p[2].w[2]) !== td)
        .slice(0, 12)
        .map(p => p[1]);
    } /* reviewing the same word again today adds little */ else {
      const pre = isRest(dayOf(t) + 1) ? 1440 : 0;
      rev = all
        .filter(p => rNow(p[2], t + pre) < r)
        .slice(0, P.revToday)
        .map(p => p[1]);
      conf = all
        .filter(p => p[2].L === 1 && levelOf(p[2]) > 13 && !rev.includes(p[1]))
        .sort((a, b) => levelOf(b[2]) - levelOf(a[2]))
        .slice(0, 3)
        .map(p => p[1]);
    }
    const fresh = pickNew(extra ? 5 : P.newToday, src);
    const q = rev.map(d => ({ k: 'q', d, q: pickType(d) }));
    conf.forEach(d => {
      const e = mem[d.id];
      if (!e.f) q.push({ k: 'q', d, q: 'f' });
      if (!e.s) q.push({ k: 'q', d, q: 's' });
    });
    const items = shuf(q),
      out = [];
    let k = 0;
    for (const d of fresh) {
      out.push(...items.splice(0, k ? 3 : 1));
      out.push({ k: 'card', d, isNew: true });
      k++;
    }
    return out.concat(items);
  }

  /* ---- insights for the Stats screen ---- */
  function insights() {
    const t = now(),
      L = allLog(),
      acc = {},
      cnt = {};
    let n7 = 0,
      ver = 0;
    for (let i = L.length - 1; i >= 0; i--) {
      const e = L[i];
      if (t - e[0] < 7 * 1440) n7++;
      if (!(e[6] & 1)) ver++;
      const q = e[2];

function qAnswer(it, i) {
  if (it.done) return;
  it.done = true;
  it.pick = i;
  const ok = i === it.ans;
  it.ok = ok;
  const x = !ok && it.q !== 's' ? it.opts[i].id : 0;
  LM.answer(it.d, { q: it.q, ok, ms: performance.now() - it.t0, x, exam: run.exam, hint: !!it.hint });
  run.tot++;
  if (!run.exam) noteAns(ok, performance.now() - it.t0);
  if (ok) run.ok++;
  else {
    run.wrong.set(it.d.id, it.d);
    if (x) run.conf.push([it.d.id, x]);
    again(it, { k: 'q', d: it.d, q: it.q });
  }
  window.mmFeedback && mmFeedback(ok);
  afterChange();

/* the learner says their wrong pick also fits the sentence: the answer is taken back, and the two words are never

const ambLeft = () => {
  const d = new Date().toDateString();

};
function qAmbig(it) {
  const d = it.d,
    p = it.opts[it.pick];

  LM.undo();
  LM.markAmbiguous(d.id, p.id);
  it.amb = true;
  run.tot--;
  run.wrong.delete(d.id);
  const k = run.conf.findIndex(c => c[0] === d.id && c[1] === p.id);
  if (k >= 0) run.conf.splice(k, 1);
  const j = run.items.findIndex((x, i) => i > run.i && x.d === d && x.q === it.q && !x.opts);
  if (j > 0) {
    run.items.splice(j, 1);
    run.again.set(d.id, Math.max(0, (run.again.get(d.id) || 1) - 1));
  }
  if (sit.ans.length) sit.ans.pop();
  const day = new Date().toDateString();

}

/* notes under the summary: how the answers went after a break, the gain of repeating now vs tomorrow, and a late-night note */
function sumNotes() {
  const out = [];
  if (run.exam || !run.tot) return out;
  if (sit.brk && !sit.brk.told && sit.ans.length - sit.brk.at >= 5) {
    const a = sit.ans.slice(sit.brk.at);
    sit.brk.told = true;
    out.push(
      L10.brAfter(
        a.reduce((x, y) => x + y[0], 0),
        a.length,
        sit.brk.acc,
      ),
    );
  }
  const P = LM.plan();
  if ((run.mode === 'session' && sessionExtra) || (run.mode !== 'session' && P.todayLeft === 0)) {
    const g = LM.gainList([...run.before.keys()].map(id => IDX.get(id)));
    if (g.n >= 5 && g.later > g.now * 1.5) {
      const f = x => (x / g.n).toLocaleString(L10.loc, { maximumFractionDigits: 1 });
      out.push(L10.capNote(g.n, f(g.now), f(g.later)));
    }
  }
  if (lateNow() && note.night !== nightKey()) {
    note.night = nightKey();
    saveNote();
    out.push(L10.nightNote);
  }
  return out;
}
function renderSummary() {
  if (run.timer) {

  if (!run.closed) {
    run.closed = true;
    LM.updWeak();
    run.notes = sumNotes();
  }
  const n = run.tot,
    ok = run.ok,
    pct = n ? Math.round((ok / n) * 100) : 0;
  const up = [...run.before].filter(([id, b]) => lvl(IDX.get(id)) > Math.max(b, 0)).length,
    wrong = [...run.wrong.values()];
  const seen = new Set(),
    pairs = run.conf
      .filter(([a, b]) => {
        const k = a < b ? a + b : b + a;
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      })
      .slice(0, 3);
  const kind = run.exam ? 'exam' : run.mode;
  let note = '';
  if (run.exam) {
    const est = Math.max(0, Math.round(((ok / run.items.length - 0.25) / 0.75) * 100));
    note =
      `<p class="sumnote">${L10.examScore(pct, run.lv, est)}</p>` +

  view.innerHTML =
    (run.mode === 'quiz' ? runHead() : '') +
    `<div class="qcard sum">
    <div class="big t3">${!n ? '好' : pct >= 80 ? '好!' : '加油'}</div><h3>${L10.sumT[kind]}</h3>
    ${n ? `<div class="sumgrid"><div><b>${ok}/${n}</b><small>${L10.sumRight}</small></div><div><b>${up}</b><small>${L10.sumUp}</small></div><div><b>${wrong.length}</b><small>${L10.sumAgain}</small></div></div>` : `<p class="sumnote">${L10.sumEmpty}</p>`}
    ${note}
    ${run.over ? `<p class="sumnote">${L10.sumOver(run.over)}</p>` : ''}
    ${(run.notes || []).map(x => `<p class="sumnote rnote">${x}</p>`).join('')}
    ${pairs.length ? `<div class="sumrow"><span>${L10.sumConf}</span>${pairs.map(([a, b]) => `<span class="pair"><b>${esc(IDX.get(a).h)}</b>↔<b>${esc(IDX.get(b).h)}</b></span>`).join('')}</div>` : ''}
    ${

            .slice(0, 12)

}

view.addEventListener('click', e => {
  if (!['card', 'quiz', 'session'].includes(state.screen) || !run) return;
  if (e.target.closest('#qTypeBtn')) {
    qMenu(!qMenuOpen());
    return;
  }
  const qt = e.target.closest('.qtrow');
  if (qt) {
    qMenu(false);
    if (qt.dataset.qt !== qType) {
      qType = qt.dataset.qt;
      saveUI();
      resetRun();
    }
    renderRun();
    $('qTypeBtn')?.focus();
    return;
  }
  const id = e.target.closest('[id]')?.id;
  if (id === 'sumHome') {
    go('home');
    return;
  }
  if (id === 'sumMore') {
    if (run.mode === 'session') sessionExtra = true;
    resetRun();
    renderRun();
    window.scrollTo(0, 0);
    return;
  }
  if (run.brk) {
    if (id === 'brGo') breakStart();
    else if (id === 'brSkip') breakEnd(false);
    else if (id === 'brStop') breakEnd(true);
    return;
  }
  const it = run.items[run.i];
  if (!it) return;
  if (it.k === 'card') {
    if (id === 'fcNo' && it.st === 'front') cardDont(it);
    else if (id === 'fcYes' && it.st === 'front') cardKnow(it);
    else if (id === 'fcOops' && it.res === 'trust') cardOops(it);
    else if (id === 'fcNext' && it.st === 'back') nextItem();
    else {
      const c = e.target.closest('[data-c]');
      if (c && it.st === 'check') cardCheck(it, +c.dataset.c);
    }
    return;
  }
  if (id === 'qNext') {
    nextItem();
    return;
  }
  if (id === 'qTr' && !it.done) {
    it.hint = true;
    renderQItem(it);
    return;
  }
  if (id === 'qAmb') {
    qAmbig(it);
    return;
  }
  const b = e.target.closest('.opts button');
  if (b && !it.done) qAnswer(it, +b.dataset.i);
});
