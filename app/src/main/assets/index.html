<script>
const STORE = (() => {
const SCHEMA = 3,

OS = 'kv';
const mem = new Map();
let db = null,
mode = 'ls',
from = SCHEMA,
dirty = new Set(),
queued = false,
fails = 0;
const lsSet = (k, v) => {
try {
if (v == null) localStorage.removeItem(k);
else localStorage.setItem(k, v);
} catch (e) {
}
};
const lsAll = () => {
const out = new Map();
try {
for (let i = 0; i < localStorage.length; i++) {
const k = localStorage.key(i),
v = localStorage.getItem(k);
if (v != null) out.set(k, v);
}
} catch (e) {}

};
function openDb() {
return new Promise((resolve, reject) => {
if (typeof indexedDB === 'undefined' || !indexedDB) return reject(new Error('no IndexedDB'));
const r = indexedDB.open(DB, 1);
r.onupgradeneeded = () => r.result.createObjectStore(OS);
r.onsuccess = () => resolve(r.result);
r.onerror = () => reject(r.error);
r.onblocked = () => reject(new Error('IndexedDB blocked'));

});
}
function readAll(d) {
return new Promise((resolve, reject) => {
const tx = d.transaction(OS, 'readonly'),
st = tx.objectStore(OS),
keys = st.getAllKeys(),
vals = st.getAll();
tx.oncomplete = () => resolve(new Map(keys.result.map((k, i) => [String(k), vals.result[i]])));
tx.onerror = tx.onabort = () => reject(tx.error);
});
}
async function open() {
try {
db = await openDb();
const saved = await readAll(db);
mode = 'idb';
if (saved.has('xc_schema')) {
saved.forEach((v, k) => mem.set(k, v));
return;
}
lsAll().forEach((v, k) => {
mem.set(k, v);
dirty.add(k);
});
} catch (e) {

mode = 'ls';
lsAll().forEach((v, k) => mem.set(k, v));
}

navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {});
} catch (e) {}

try {
return JSON.parse(mem.get(k));
} catch (e) {
return null;
}
};
function version() {
const v = +J('xc_schema');
if (v) return v;
const keys = [...mem.keys()];
if (keys.some(k => k.startsWith('xc_'))) return 2;
if (mem.has('mm_stats') || mem.has('hsk16_known')) return 1;

}
const MIGRATIONS = {
1(ctx) {
let st = J('mm_stats');
if (!st || typeof st !== 'object' || Array.isArray(st)) {
st = {};
const known = J('hsk16_known');
if (Array.isArray(known))
known.forEach(id => {
if (ctx.ids.has(id)) st[id] = [1, 0];
});
}
for (const k in st) {
const e = st[k];
if (!Array.isArray(e)) {
delete st[k];
continue;
}
if (e.length < 3) e[2] = Math.max(0, Math.min(20, (e[0] | 0) - (e[1] | 0)));
}
put('mm_stats', JSON.stringify(st));
},
2() {},
};
function migrate(ctx) {
from = version();
for (let v = from; v < SCHEMA; v++) MIGRATIONS[v](ctx);
if (J('xc_schema') !== SCHEMA) put('xc_schema', String(SCHEMA));
flush();
}
function put(k, v) {
if (v == null) mem.delete(k);
else mem.set(k, v);
lsSet(k, v);
dirty.add(k);
if (!queued) {
queued = true;
setTimeout(flush, 0);
}
}
function flush() {
queued = false;
if (mode !== 'idb' || !db || !dirty.size) return;
const keys = [...dirty];
dirty.clear();
const retry = () => {
keys.forEach(k => dirty.add(k));
if (++fails >= 3) {
mode = 'ls';
return;
}
setTimeout(flush, 1500);
};
try {
const tx = db.transaction(OS, 'readwrite'),
st = tx.objectStore(OS);
for (const k of keys) {
const v = mem.get(k);
if (v == null) st.delete(k);
else st.put(v, k);
}
tx.oncomplete = () => {
fails = 0;
};
tx.onerror = tx.onabort = retry;
} catch (e) {
retry();
}
}
document.addEventListener('visibilitychange', () => {
if (document.hidden) flush();
});
return {
open,
migrate,
put,
flush,
SCHEMA,
get: k => (mem.has(k) ? mem.get(k) : null),
keys: () => [...mem.keys()],
info: () => ({ mode, from, schema: SCHEMA, keys: mem.size }),
};
})();
const ls = {
get(k, f) {
const v = STORE.get(k);
if (v == null) return f;
try {
return JSON.parse(v);
} catch (e) {
return f;
}
},
set(k, v) {
let s;
try {
s = JSON.stringify(v);
} catch (e) {
return;
}
STORE.put(k, s);
},
remove(k) {
STORE.put(k, null);
},
};

function sysLang() {
const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
for (const n of list) {
const c = String(n).toLowerCase().slice(0, 2);
if (c === 'id' || c === 'in' || c === 'ms') return 'id';
if (c === 'en' || c === 'th' || c === 'vi') return c;
}

}
const XC = (() => {
const root = document.documentElement;
root.classList.add('booting');
try {
const t = JSON.parse(localStorage.getItem('hsk16_theme'));
if (t && t !== 'auto') root.setAttribute('data-theme', t);

} catch (e) {}
const COLS = { id: ['m', 't'], en: ['em', 'et'], th: ['hm', 'ht'], vi: ['vm', 'vt'] };
const parts = [{ key: '', words: null, langs: new Set(), file: l => get(`data/${l}.json`) }];
const data = [];
const get = path =>
fetch(path).then(r => {
if (!r.ok) throw new Error(path + ' ' + r.status);

const toWords = c =>
c.rows.map(r => {
const d = {};
c.cols.forEach((k, i) => {
if (r[i] != null) d[k] = r[i];
});

});
function addLang(l, part, j) {
const [a, b] = COLS[l];
if (!j || j.rows.length !== part.words.length)
throw new Error(`data/${l}${part.key}.json does not match the word list`);
j.rows.forEach((r, i) => {
part.words[i][a] = r[0];
part.words[i][b] = r[1];
});
part.langs.add(l);
}
const partLang = (l, part) => (part.langs.has(l) ? Promise.resolve() : part.file(l).then(j => addLang(l, part, j)));
async function unseal(name) {
const r = await fetch('data/' + name);
if (!r.ok) throw new Error(name + ' ' + r.status);
const buf = new Uint8Array(await r.arrayBuffer()),
z = buf.indexOf(0),
x = buf.slice(z + 1);
const mat =
'天外有天|' +
parts[0].words
.filter(d => d.l === 6)
.map(d => d.h)
.join('') +
'|' +
name;
const sd = new DataView(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(mat)));

b = sd.getUint32(4, true),
c = sd.getUint32(8, true),
d = sd.getUint32(12, true);

const o = Math.imul(rotl(Math.imul(b, 5), 7), 9),
t = b << 9;
c ^= a;
d ^= b;
b ^= c;
a ^= d;
c ^= t;
d = rotl(d, 11);

if (i + 1 < x.length) x[i + 1] ^= (o >>> 8) & 255;

if (i + 3 < x.length) x[i + 3] ^= (o >>> 24) & 255;

const text = await new Response(new Blob([x]).stream().pipeThrough(new DecompressionStream('deflate'))).text();

}
const has = l => parts.every(p => p.langs.has(l));
function loadLang(l) {
return Promise.all(parts.map(p => partLang(l, p)));
}
let band = null,
sealJs = null,
appRan = false;
const runText = t => {
const s = document.createElement('script');
s.textContent = t;
document.body.appendChild(s);
};
function loadBand() {
if (band) return band;
const part = { key: '-b', words: null, langs: new Set(), file: l => unseal(`s-${l}.bin`) };
const langs = [...parts[0].langs];
band = unseal('s0.bin')
.then(pk => {
part.words = toWords(pk.core);
sealJs = pk.js || '';
return Promise.all(langs.map(l => part.file(l).then(j => addLang(l, part, j))));
})
.then(() => {
parts.push(part);
data.push(...part.words);

}
let bandIdSet = null;
function bandIds() {
if (!bandIdSet)
bandIdSet = unseal('s0.bin').then(({ core: c }) => {
const l = c.cols.indexOf('l'),
h = c.cols.indexOf('h');

}
function run(id) {
const s = document.createElement('script');
s.textContent = document.getElementById(id).textContent;
document.body.appendChild(s);
}
function fail(e) {
console.error(e);
root.classList.remove('booting');
document.body.insertAdjacentHTML(
'beforeend',
'<p class="bootfail">Data kata gagal dimuat. Tutup aplikasi lalu buka lagi.<br>The word list could not be loaded. Close the app and open it again.</p>',
);
}
async function start() {
const core = get('data/core.json');
await STORE.open();
const pref = ls.get('mm_lang', 'auto'),
lang = pref !== 'auto' && LANGS.includes(pref) ? pref : sysLang(),
lv = ls.get('xc_lvl', null),
gate = !!(lv && lv.gate);
const [c, m] = await Promise.all([core, get(`data/${lang}.json`)]);

data.push(...parts[0].words);

run('xc-glass');

}
start().catch(fail);

loadLang,
loadBand,
bandIds,
has,
get band() {
return parts.length > 1;
},
};
})();

function bestRun(S) {
const all = [...S].sort((a, b) => a - b);
if (!all.length) return 0;
let best = 0;
for (let i = 0; i < all.length; i++) {
if (i && S.has(all[i] - 1)) continue;
let d = all[i],
n = 0,
grace = -99;
const end = LM.today();
for (; d <= end; d++) {
if (S.has(d) || LM.isRest(d)) n++;
else if (grace === -99 || d - grace >= 7) {
grace = d;
n++;
} else break;
}
while (n > 0 && !S.has(d - 1) && d - 1 >= all[i]) {
d--;
n--;
}
best = Math.max(best, n);
}
return best;
}
