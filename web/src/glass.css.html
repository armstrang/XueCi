<style>
/* ================= Liquid Glass look =================
   Light comes from the top-left, where the HSK logo sits: a soft glow in the level's colour spreads
   from that corner, and the glass panels are clear enough to show it through them. Each panel has a
   bright rim (strongest top-left and bottom-right), a glossy highlight along its top, an inner glow
   that gives it thickness, and a soft shadow. Everything behind the glass is static, so it stays smooth. */
@property --tone{syntax:'<color>';inherits:true;initial-value:#2f8a4c}
:root{
  --bg:#eceef1; --surface:#f6f7f9; --sunk:#e0e3e8; --line:#d6dae0; --s-none:#cfd3da;
  --bg-top:#f5f6f8; --bg-bot:#e1e4e9; --bar:#f5f6f8; --bar2:#e1e4e9; --glow-o:55%;
  --g-fill:radial-gradient(140% 90% at 12% -30%,rgba(255,255,255,.62),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 55%,rgba(255,255,255,.18));
  --g-solid:radial-gradient(140% 70% at 12% -30%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%),rgba(255,255,255,.46);
  --g-head:rgba(246,247,249,.60); --g-bar:rgba(255,255,255,.58);
  --g-edge:rgba(255,255,255,.45);
  --g-rim:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.6) 15%,rgba(255,255,255,.06) 40%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.55) 86%,#fff 100%);
  --g-inset:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -16px 26px -20px rgba(255,255,255,.85),inset 0 0 0 .5px rgba(255,255,255,.35);
  --g-drop:0 20px 40px -24px rgba(25,35,60,.45),0 3px 8px -4px rgba(25,35,60,.14);
  --g-blur:blur(16px) saturate(210%) brightness(1.03);
  --lens:radial-gradient(120% 80% at 20% -20%,#fff,rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.45));
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#23262c; --surface:#2a2d34; --sunk:#353840; --line:#3a3e46; --s-none:#454952;
  --fg:#eceef2; --soft:#a9aeb8; --mute:#80868f;
  --bg-top:#2f3238; --bg-bot:#15171b; --bar:#2f3238; --bar2:#15171b; --glow-o:46%;
  --g-fill:radial-gradient(140% 90% at 12% -30%,rgba(255,255,255,.17),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%,rgba(255,255,255,.05));
  --g-solid:radial-gradient(140% 70% at 12% -30%,rgba(255,255,255,.10),rgba(255,255,255,0) 60%),rgba(255,255,255,.05);
  --g-head:rgba(40,43,50,.62); --g-bar:rgba(52,55,63,.56);
  --g-edge:rgba(255,255,255,.07);
  --g-rim:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.25) 15%,rgba(255,255,255,.03) 40%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.22) 86%,rgba(255,255,255,.62) 100%);
  --g-inset:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -16px 26px -20px rgba(255,255,255,.14);
  --g-drop:0 22px 40px -22px rgba(0,0,0,.85);
  --g-blur:blur(16px) saturate(180%);
  --lens:radial-gradient(120% 80% at 20% -20%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06))}}
:root[data-theme="dark"]{
  --bg:#23262c; --surface:#2a2d34; --sunk:#353840; --line:#3a3e46; --s-none:#454952;
  --fg:#eceef2; --soft:#a9aeb8; --mute:#80868f;
  --bg-top:#2f3238; --bg-bot:#15171b; --bar:#2f3238; --bar2:#15171b; --glow-o:46%;
  --g-fill:radial-gradient(140% 90% at 12% -30%,rgba(255,255,255,.17),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%,rgba(255,255,255,.05));
  --g-solid:radial-gradient(140% 70% at 12% -30%,rgba(255,255,255,.10),rgba(255,255,255,0) 60%),rgba(255,255,255,.05);
  --g-head:rgba(40,43,50,.62); --g-bar:rgba(52,55,63,.56);
  --g-edge:rgba(255,255,255,.07);
  --g-rim:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.25) 15%,rgba(255,255,255,.03) 40%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.22) 86%,rgba(255,255,255,.62) 100%);
  --g-inset:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -16px 26px -20px rgba(255,255,255,.14);
  --g-drop:0 22px 40px -22px rgba(0,0,0,.85);
  --g-blur:blur(16px) saturate(180%);
  --lens:radial-gradient(120% 80% at 20% -20%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06))}
/* True black: pure #000 for OLED screens; only the level glow and the glass edges catch the light */
:root[data-theme="black"]{
  --bg:#000000; --surface:#0b0b0c; --sunk:#1a1a1d; --fg:#f4f4f6; --soft:#a2a2a9; --mute:#75757c; --line:#26262a;
  --mark:#4a3a10; --on-acc:#000000; --shadow:0 18px 50px rgba(0,0,0,.8);
  --l1:#6fd08f; --l2:#5cc8cf; --l3:#6dbbea; --l4:#94a3f5; --l5:#bf9af0; --l6:#ec8dbd;
  --t1:#ff7a66; --t2:#f2a64a; --t3:#5fd38f; --t4:#79a6ff; --t5:#9aa39e;
  --s-red:#ff6b6b; --s-yellow:#f5d04a; --s-green:#62d26f; --s-none:#2b2b2f;
  --good:#5fd38f; --bad:#ff7a66; color-scheme:dark;
  --bg-top:#000000; --bg-bot:#000000; --bar:#000000; --bar2:#000000; --glow-o:34%;
  --g-fill:radial-gradient(140% 90% at 12% -30%,rgba(255,255,255,.14),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 55%,rgba(255,255,255,.04));
  --g-solid:radial-gradient(140% 70% at 12% -30%,rgba(255,255,255,.08),rgba(255,255,255,0) 60%),rgba(255,255,255,.04);
  --g-head:rgba(0,0,0,.6); --g-bar:rgba(30,30,33,.62);
  --g-edge:rgba(255,255,255,.06);
  --g-rim:linear-gradient(135deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.2) 15%,rgba(255,255,255,.03) 40%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.18) 86%,rgba(255,255,255,.55) 100%);
  --g-inset:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -16px 26px -20px rgba(255,255,255,.10);
  --g-drop:0 20px 36px -22px rgba(0,0,0,.95);
  --g-blur:blur(16px) saturate(180%);
  --lens:radial-gradient(120% 80% at 20% -20%,rgba(255,255,255,.3),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05))}

/* ---- background: a static glow in the level colour from the top-left corner (fades to the new colour on level change) ---- */
body{background:var(--bg)}
.liquid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;--tone:var(--acc);transition:--tone .9s ease;
  --gx:calc(max(16px,50vw - 280px) + 20px);--gy:36px;   /* centre of the HSK logo on Home */
  background:radial-gradient(90vmax 90vmax at var(--gx) var(--gy),color-mix(in srgb,var(--tone) var(--glow-o),transparent) 0%,color-mix(in srgb,var(--tone) calc(var(--glow-o)*.4),transparent) 36%,transparent 72%),
    linear-gradient(180deg,var(--bg-top),var(--bg-bot))}
/* in the Android app, a few pixels at the very top blend into the status bar colour */
html.app .liquid-bg::after{content:"";position:absolute;left:0;right:0;top:0;height:18px;background:linear-gradient(var(--bar),transparent)}

/* ---- glass ---- */
.hero,.tile,.lvseg,.frow,.langbtn,.iconbtn,.qcard,.tchip,.ghost,.no-btn,.more,.qtbtn,.toneinfo,.xbtn,.search input,.danger,.menu,.stdetail,.toast,.opts button{
  background:var(--g-fill);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop)}
.item,.face,.key,.ucell{background:var(--g-solid);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop)}
/* real frosting only on layers that float over scrolling content (the page background itself is a smooth glow,
   so blurring it would cost frames and show nothing) */
.menu,.stdetail,.toast{background:var(--g-head);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
/* thin bright rim, as on real glass */
.hero,.tile,.lvseg,.langbtn,.iconbtn,.qcard,.no-btn,.yes-btn,.next,.opts button,.qtbtn,.toneinfo{position:relative}
.hero::after,.tile::after,.lvseg::after,.frow::after,.qtbtn::after,.toneinfo::after,.isheet::after,.langbtn::after,.iconbtn::after,.qcard::after,.face::after,.lens::after,.no-btn::after,.yes-btn::after,.next::after,.menu::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:var(--g-rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* ---- springy feedback (transform only, so it stays smooth) ---- */
.tile,.hero,.langbtn,.iconbtn,.opts button,.fcbtns button,.next,.ghost,.tchip,.more,.ucell,.lvrow,.lgrow,.mstats,.danger{transition:transform .32s var(--spring),background .2s,border-color .2s}
.tile:active,.hero:active{transform:scale(.965)}
.langbtn:active,.iconbtn:active,.tchip:active,.ghost:active,.qtbtn:active,.xbtn:active{transform:scale(1.06)}
.toneinfo:active,.qtrow:active{transform:scale(.97)}
.qtbtn,.toneinfo,.xbtn,.qtrow{transition:transform .32s var(--spring),background .2s,border-color .2s}
.opts button:active:not(:disabled),.fcbtns button:active,.next:active,.ucell:active,.lvrow:active,.lgrow:active,.more:active{transform:scale(.97)}
.screen{animation:none}

/* ---- home ---- */
header.top .seal{position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -6px 12px -8px rgba(0,0,0,.2),0 8px 22px -6px color-mix(in srgb,var(--acc) 75%,transparent),0 0 46px 6px color-mix(in srgb,var(--acc) 32%,transparent)}
.langbtn,.iconbtn{border-radius:999px}
.iconbtn{width:42px;height:42px}.langbtn{height:42px;padding:0 13px}
.lvseg{position:relative;border-radius:22px;padding:4px;margin-bottom:12px}
.stbody .lvseg{margin-bottom:0}
.lvseg .lvpills{position:relative;z-index:3;margin:0;gap:0;touch-action:pan-y}
.lvseg .lvpill{background:transparent;border:0;border-radius:18px;padding:7px 0 6px;box-shadow:none}
.lvseg .lvpill b{transition:color .3s}
.lvseg .lvpill[aria-pressed="true"]{background:transparent;color:var(--fg)}
.lvseg .lvpill[aria-pressed="true"] b{color:var(--lc)}
.lvseg .lvpill[aria-pressed="true"] small{color:var(--soft);opacity:1}
.lens{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:18px;z-index:2;pointer-events:none;background:var(--lens);
  box-shadow:var(--g-inset),0 6px 14px -8px rgba(0,0,0,.35);will-change:transform}
.lens.drag{transform:scale(1.1,1.16)}
.hero{border-radius:30px}
.ring .trk{stroke:color-mix(in srgb,var(--fg) 9%,transparent)}
.ring .sg{transition:stroke-dasharray .7s var(--ease),stroke-dashoffset .7s var(--ease)}
.hfoot{border-top-color:var(--line)}
.tile{border-radius:26px}
.tile .ic{border-radius:15px;background:color-mix(in srgb,var(--acc) 16%,transparent);border:1px solid var(--g-edge);box-shadow:var(--g-inset);color:var(--acc)}
.allnote{color:var(--soft)}

/* ---- focused screens: one floating glass capsule (back · title · HSK · unit), nothing stacked on top of it ---- */
.fbar{background:none;border-bottom:0;padding-bottom:6px;margin-bottom:10px}
.frow{border-radius:999px;padding:4px;gap:2px;background:var(--g-bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--g-inset),0 10px 26px -16px rgba(20,25,40,.45)}
.frow h2{padding-left:6px}
.frow .backbtn,.frow .pchip{background:transparent;border:0;box-shadow:none;border-radius:999px;height:40px;transition:background .15s,transform .2s var(--ease)}
.frow .backbtn{width:40px}
.frow .pchip{padding:0 8px 0 11px;gap:4px}
.frow .pchip+.pchip{position:relative}
.frow .pchip+.pchip::before{content:"";position:absolute;left:-1px;top:11px;bottom:11px;width:1px;background:color-mix(in srgb,var(--fg) 14%,transparent)}
.frow .backbtn:hover,.frow .pchip:hover,.frow .pchip[aria-expanded="true"]{background:color-mix(in srgb,var(--fg) 7%,transparent);border:0}
.frow .backbtn:active,.frow .pchip:active{background:color-mix(in srgb,var(--fg) 11%,transparent);transform:scale(.95)}
.menu{border-radius:22px;transform-origin:top right;animation:pop .26s cubic-bezier(.2,.9,.3,1.15)}
.fbar>.menu{left:auto;right:0;top:calc(100% + 2px);width:min(100%,440px)}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.qmenu{transform-origin:top left}
.lvrow,.lgrow{border-radius:15px}
.lvrow:hover,.lgrow:hover,.mstats:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.msep{background:var(--line)}
.ucell{border-radius:15px}
.search input{border-radius:999px;height:42px}
.tchip{height:38px}
.item{border-radius:20px}
.ex{border-top-color:var(--line)}
.more,.ghost{border-radius:999px}

/* flashcards (faces stay free of blur so the 3D flip keeps working) */
.face{border-radius:30px}
.face:first-child{border-top:1px solid var(--g-edge)}
.face:first-child::before{content:"";position:absolute;left:30%;right:30%;top:-1px;height:3px;border-radius:0 0 4px 4px;background:var(--acc)}
.fcbtns button{border-radius:20px}
.no-btn{color:var(--bad)}
.yes-btn,.next{border:0;background:var(--acc);color:var(--on-acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--g-drop)}
.next{border-radius:20px}

/* quiz */
.qcard{border-radius:30px;border-top:1px solid var(--g-edge)}
.qcard>.q:first-child::before{content:"";display:block;width:40px;height:4px;border-radius:4px;margin:-6px auto 12px;background:var(--acc)}
.opts button{border-radius:18px}
.opts button.ok{border-color:color-mix(in srgb,var(--good) 65%,transparent);background:color-mix(in srgb,var(--good) 16%,transparent);animation:okPulse .55s var(--spring)}
.opts button.ng{border-color:color-mix(in srgb,var(--bad) 65%,transparent);background:color-mix(in srgb,var(--bad) 13%,transparent);animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes okPulse{0%{transform:scale(.97)}55%{transform:scale(1.02)}100%{transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.feedback{animation:fbIn .4s var(--ease)}
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}}

/* stats */
.key{border-radius:16px}
.stdetail{margin:0 0 calc(8px + env(safe-area-inset-bottom,0px));border-radius:24px;padding:10px 14px;bottom:8px}
.toast{color:var(--fg);border-radius:999px;padding:10px 18px;animation:toastIn .26s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.94)}to{opacity:1;transform:translateX(-50%)}}

html[data-vt="theme"]::view-transition-old(root){animation:none}
html[data-vt="theme"]::view-transition-new(root){animation:reveal .45s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vt-x,90%) var(--vt-y,5%))}to{clip-path:circle(150vmax at var(--vt-x,90%) var(--vt-y,5%))}}
@media (prefers-reduced-motion:reduce){.menu,.toast,.feedback,.opts button.ok,.opts button.ng{animation:none}}

/* quiz type dropdown */
.qtbtn{border-radius:999px;height:40px}
.qti{background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.qtrow{border-radius:15px}
.qtrow:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.qtrow[aria-selected="true"]{background:color-mix(in srgb,var(--acc) 14%,transparent)}

/* tone colours & info */
.toneinfo{border-radius:999px;margin-top:16px;color:var(--soft)}
.homeacts{margin-top:16px}.homeacts .toneinfo{margin:0}
.bkopt{background:var(--g-solid);border-color:var(--g-edge);box-shadow:var(--g-inset),var(--g-drop);transition:transform .32s var(--spring),background .2s}
.bkopt:active{transform:scale(.98)}
.bkopt .bi{box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.toneinfo .excl{color:var(--acc);box-shadow:0 0 14px -2px color-mix(in srgb,var(--acc) 60%,transparent)}
.scrim2{background:rgba(8,10,16,.34);animation:fadeIn .22s ease both}
.isheet{background:var(--g-head);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);border:1px solid var(--g-edge);border-radius:32px 32px 0 0;
  box-shadow:var(--g-inset),0 -24px 60px -24px rgba(0,0,0,.4);animation:sheetUpL .34s cubic-bezier(.2,.9,.25,1) both}
@media (min-width:600px){.isheet{border-radius:32px;animation-name:sheetPopL}}
@keyframes sheetUpL{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetPopL{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.ihead .excl{box-shadow:0 0 16px -2px color-mix(in srgb,var(--acc) 60%,transparent)}
.xbtn{border-radius:50%;color:var(--fg)}
.tone{background:var(--g-solid);border:1px solid var(--g-edge);box-shadow:var(--g-inset);border-radius:16px}
.isec{border-top-color:var(--line)}
.gh{border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),var(--g-drop)}
.bkcode{background:var(--g-solid);border-color:var(--g-edge);border-radius:16px;box-shadow:var(--g-inset)}
.ghost.pri{background:var(--acc);border-color:transparent;color:var(--on-acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--g-drop)}
.plink{background:var(--g-solid);border-color:var(--g-edge);border-radius:16px;box-shadow:var(--g-inset)}
</style>
