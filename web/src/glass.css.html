<style>
/* ================= Liquid Glass look =================
   Light comes from the top-left, where the HSK logo sits: a soft glow in the level's colour spreads
   from that corner, and the glass panels are clear enough to show it through them. Each panel has a
   bright rim (strongest top-left and bottom-right), a glossy highlight along its top, an inner glow
   that gives it thickness, and a soft shadow. Everything behind the glass is static, so it stays smooth. */
@property --tone{syntax:'<color>';inherits:true;initial-value:#2f8a4c}
:root{
  --bg:#eceef1; --surface:#f6f7f9; --sunk:#e0e3e8; --line:#d6dae0; --s-none:#cfd3da;
  --bg-top:#f5f6f8; --bg-bot:#e1e4e9; --bar:#f5f6f8; --bar2:#e1e4e9; --glow-o:55%;
  --g-fill:radial-gradient(140% 90% at 12% -30%,rgba(255,255,255,.62),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 55%,rgba(255,255,255,.18));
  --g-solid:radial-gradient(140% 70% at 12% -30%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%),rgba(255,255,255,.46);
  --g-head:rgba(246,247,249,.60); --g-bar:rgba(255,255,255,.58);
  --g-edge:rgba(255,255,255,.45);
  --g-rim:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.6) 15%,rgba(255,255,255,.06) 40%,rgba(255,255,255,.04) 62%,rgba(255,255,255,.55) 86%,#fff 100%);
  --g-inset:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -16px 26px -20px rgba(255,255,255,.85),inset 0 0 0 .5px rgba(255,255,255,.35);
  --g-drop:0 20px 40px -24px rgba(25,35,60,.45),0 3px 8px -4px rgba(25,35,60,.14);
  --g-blur:blur(16px) saturate(210%) brightness(1.03);
  --lens:radial-gradient(120% 80% at 20% -20%,#fff,rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.45));
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#23262c; --surface:#2a2d34; --sunk:#353840; --line:#3a3e46; --s-none:#454952;
  --fg:#eceef2; --soft:#c0c5ce; --mute:#a3a9b3;
  --bg-top:#2f3238; --bg-bot:#15171b; --bar:#2f3238; --bar2:#15171b; --glow-o:46%;
  --g-fill:radial-gradient(140% 90% at 12% -30%,rgba(255,255,255,.17),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%,rgba(255,255,255,.05));
  --g-solid:radial-gradient(140% 70% at 12% -30%,rgba(255,255,255,.10),rgba(255,255,255,0) 60%),rgba(255,255,255,.05);
  --g-head:rgba(40,43,50,.62); --g-bar:rgba(52,55,63,.56);
  --g-edge:rgba(255,255,255,.07);
  --g-rim:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.25) 15%,rgba(255,255,255,.03) 40%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.22) 86%,rgba(255,255,255,.62) 100%);
  --g-inset:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -16px 26px -20px rgba(255,255,255,.14);
  --g-drop:0 22px 40px -22px rgba(0,0,0,.85);
  --g-blur:blur(16px) saturate(180%);
  --lens:radial-gradient(120% 80% at 20% -20%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06))}}
:root[data-theme="dark"]{
  --bg:#23262c; --surface:#2a2d34; --sunk:#353840; --line:#3a3e46; --s-none:#454952;
  --fg:#eceef2; --soft:#c0c5ce; --mute:#a3a9b3;
  --bg-top:#2f3238; --bg-bot:#15171b; --bar:#2f3238; --bar2:#15171b; --glow-o:46%;
  --g-fill:radial-gradient(140% 90% at 12% -30%,rgba(255,255,255,.17),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 55%,rgba(255,255,255,.05));
  --g-solid:radial-gradient(140% 70% at 12% -30%,rgba(255,255,255,.10),rgba(255,255,255,0) 60%),rgba(255,255,255,.05);
  --g-head:rgba(40,43,50,.62); --g-bar:rgba(52,55,63,.56);
  --g-edge:rgba(255,255,255,.07);
  --g-rim:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.25) 15%,rgba(255,255,255,.03) 40%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.22) 86%,rgba(255,255,255,.62) 100%);
  --g-inset:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -16px 26px -20px rgba(255,255,255,.14);
  --g-drop:0 22px 40px -22px rgba(0,0,0,.85);
  --g-blur:blur(16px) saturate(180%);
  --lens:radial-gradient(120% 80% at 20% -20%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.06))}
/* True black: pure #000 for OLED screens; only the level glow and the glass edges catch the light */
:root[data-theme="black"]{
  --bg:#000000; --surface:#0b0b0c; --sunk:#1a1a1d; --fg:#f4f4f6; --soft:#b4b4bb; --mute:#8d8d94; --line:#26262a;
  --mark:#4a3a10; --on-acc:#000000; --shadow:0 18px 50px rgba(0,0,0,.8);
  --l1:#6fd08f; --l2:#5cc8cf; --l3:#6dbbea; --l4:#94a3f5; --l5:#bf9af0; --l6:#ec8dbd;
  --t1:#ff7a66; --t2:#f2a64a; --t3:#5fd38f; --t4:#79a6ff; --t5:#9aa39e;
  --s-red:#ff6b6b; --s-yellow:#f5d04a; --s-green:#62d26f; --s-none:#2b2b2f;
  --good:#5fd38f; --bad:#ff7a66; color-scheme:dark;
  --bg-top:#000000; --bg-bot:#000000; --bar:#000000; --bar2:#000000; --glow-o:34%;
  --g-fill:radial-gradient(140% 90% at 12% -30%,rgba(255,255,255,.14),rgba(255,255,255,0) 58%),linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 55%,rgba(255,255,255,.04));
  --g-solid:radial-gradient(140% 70% at 12% -30%,rgba(255,255,255,.08),rgba(255,255,255,0) 60%),rgba(255,255,255,.04);
  --g-head:rgba(0,0,0,.6); --g-bar:rgba(30,30,33,.62);
  --g-edge:rgba(255,255,255,.06);
  --g-rim:linear-gradient(135deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.2) 15%,rgba(255,255,255,.03) 40%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.18) 86%,rgba(255,255,255,.55) 100%);
  --g-inset:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -16px 26px -20px rgba(255,255,255,.10);
  --g-drop:0 20px 36px -22px rgba(0,0,0,.95);
  --g-blur:blur(16px) saturate(180%);
  --lens:radial-gradient(120% 80% at 20% -20%,rgba(255,255,255,.3),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05))}

/* ---- background: a static glow in the level colour from the top-left corner (fades to the new colour on level change) ---- */
body{background:var(--bg)}
.liquid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;--tone:var(--acc);transition:--tone .9s ease;
  --gx:calc(max(16px,50vw - 280px) + 20px);--gy:36px;   /* centre of the HSK logo on Home */
  background:radial-gradient(90vmax 90vmax at var(--gx) var(--gy),color-mix(in srgb,var(--tone) var(--glow-o),transparent) 0%,color-mix(in srgb,var(--tone) calc(var(--glow-o)*.4),transparent) 36%,transparent 72%),
    linear-gradient(180deg,var(--bg-top),var(--bg-bot))}
/* in the Android app, a few pixels at the very top blend into the status bar colour */
html.app .liquid-bg::after{content:"";position:absolute;left:0;right:0;top:0;height:18px;background:linear-gradient(var(--bar),transparent)}

/* ---- glass ---- */
.hero,.tile,.lvseg,.frow,.langbtn,.iconbtn,.qcard,.tchip,.ghost,.no-btn,.more,.qtbtn,.toneinfo,.xbtn,.search input,.danger,.menu,.stdetail,.toast,.opts button{
  background:var(--g-fill);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop)}
.item,.face,.key,.ucell{background:var(--g-solid);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop)}
/* real frosting only on layers that float over scrolling content (the page background itself is a smooth glow,
   so blurring it would cost frames and show nothing) */
.menu,.stdetail,.toast{background:var(--g-head);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur)}
/* thin bright rim, as on real glass */
.hero,.tile,.lvseg,.langbtn,.iconbtn,.qcard,.no-btn,.yes-btn,.next,.opts button,.qtbtn,.toneinfo{position:relative}
.hero::after,.tile::after,.lvseg::after,.frow::after,.qtbtn::after,.toneinfo::after,.isheet::after,.langbtn::after,.iconbtn::after,.qcard::after,.face::after,.lens::after,.no-btn::after,.yes-btn::after,.next::after,.menu::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:var(--g-rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* ---- springy feedback (transform only, so it stays smooth) ---- */
.tile,.hero,.langbtn,.iconbtn,.opts button,.fcbtns button,.next,.ghost,.tchip,.more,.ucell,.lvrow,.lgrow,.mstats,.danger{transition:transform .32s var(--spring),background .2s,border-color .2s}
.tile:active,.hero:active{transform:scale(.965)}
.langbtn:active,.iconbtn:active,.tchip:active,.ghost:active,.qtbtn:active,.xbtn:active{transform:scale(1.06)}
.toneinfo:active,.qtrow:active{transform:scale(.97)}
.qtbtn,.toneinfo,.xbtn,.qtrow{transition:transform .32s var(--spring),background .2s,border-color .2s}
.opts button:active:not(:disabled),.fcbtns button:active,.next:active,.ucell:active,.lvrow:active,.lgrow:active,.more:active{transform:scale(.97)}
.screen{animation:none}

/* ---- home ---- */
header.top .seal{position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -6px 12px -8px rgba(0,0,0,.2),0 8px 22px -6px color-mix(in srgb,var(--acc) 75%,transparent),0 0 46px 6px color-mix(in srgb,var(--acc) 32%,transparent)}
.langbtn,.iconbtn,.curlv{border-radius:999px}
.curlv{position:relative;background:var(--g-fill);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop);height:42px;transition:transform .32s var(--spring)}
.curlv:active{transform:scale(1.06)}
.idkbtn{transition:transform .25s var(--spring)}.idkbtn:active{transform:scale(.97)}
.iconbtn{width:42px;height:42px}.langbtn{height:42px;padding:0 13px}
.lvseg{position:relative;border-radius:22px;padding:4px;margin-bottom:12px}
.stbody .lvseg{margin-bottom:0}
.lvseg .lvpills{position:relative;z-index:3;margin:0;gap:0;touch-action:pan-y}
.lvseg .lvpill{background:transparent;border:0;border-radius:18px;padding:7px 0 6px;box-shadow:none}
.lvseg .lvpill b{transition:color .3s}
.lvseg .lvpill[aria-pressed="true"]{background:transparent;color:var(--fg)}
.lvseg .lvpill[aria-pressed="true"] b{color:var(--lc)}
.lvseg .lvpill[aria-pressed="true"] small{color:var(--soft);opacity:1}
.lens{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:18px;z-index:2;pointer-events:none;background:var(--lens);
  box-shadow:var(--g-inset),0 6px 14px -8px rgba(0,0,0,.35);will-change:transform}
.lens.drag{transform:scale(1.1,1.16)}
.hero{border-radius:30px}
.ring .trk{stroke:color-mix(in srgb,var(--fg) 9%,transparent)}
.ring .sg{transition:stroke-dasharray .7s var(--ease),stroke-dashoffset .7s var(--ease)}
.hfoot{border-top-color:var(--line)}
.tile{border-radius:26px}
.tile .ic{border-radius:15px;background:color-mix(in srgb,var(--acc) 16%,transparent);border:1px solid var(--g-edge);box-shadow:var(--g-inset);color:var(--acc)}

/* ---- focused screens: one floating glass capsule (back · title · HSK · unit), nothing stacked on top of it ---- */
.fbar{background:none;border-bottom:0;padding-bottom:6px;margin-bottom:10px}
.frow{border-radius:999px;padding:4px;gap:2px;background:var(--g-bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--g-inset),0 10px 26px -16px rgba(20,25,40,.45)}
.frow h2{padding-left:6px}
.frow .backbtn,.frow .pchip{background:transparent;border:0;box-shadow:none;border-radius:999px;height:40px;transition:background .15s,transform .2s var(--ease)}
.frow .backbtn{width:40px}
.frow .pchip{padding:0 8px 0 11px;gap:4px}
.frow .pchip+.pchip{position:relative}
.frow .pchip+.pchip::before{content:"";position:absolute;left:-1px;top:11px;bottom:11px;width:1px;background:color-mix(in srgb,var(--fg) 14%,transparent)}
.frow .backbtn:hover,.frow .pchip:hover,.frow .pchip[aria-expanded="true"]{background:color-mix(in srgb,var(--fg) 7%,transparent);border:0}
.frow .backbtn:active,.frow .pchip:active{background:color-mix(in srgb,var(--fg) 11%,transparent);transform:scale(.95)}
.menu{border-radius:22px;transform-origin:top right;animation:pop .26s cubic-bezier(.2,.9,.3,1.15)}
.fbar>.menu{left:auto;right:0;top:calc(100% + 2px);width:min(100%,440px)}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.qmenu{transform-origin:top left}
.lvrow,.lgrow{border-radius:15px}
.lvrow:hover,.lgrow:hover,.mstats:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.msep{background:var(--line)}
.ucell{border-radius:15px}
.search input{border-radius:999px;height:42px}
.tchip{height:38px}
.item{border-radius:20px}
.ex{border-top-color:var(--line)}
.more,.ghost{border-radius:999px}

/* flashcards (faces stay free of blur so the 3D flip keeps working) */
.face{border-radius:30px}
.face:first-child{border-top:1px solid var(--g-edge)}
.face:first-child::before{content:"";position:absolute;left:30%;right:30%;top:-1px;height:3px;border-radius:0 0 4px 4px;background:var(--acc)}
.fcbtns button{border-radius:20px}
.no-btn{color:var(--bad)}
.yes-btn,.next{border:0;background:var(--acc);color:var(--on-acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--g-drop)}
.next{border-radius:20px}

/* quiz */
.qcard{border-radius:30px;border-top:1px solid var(--g-edge)}
.qcard>.q:first-child::before{content:"";display:block;width:40px;height:4px;border-radius:4px;margin:-6px auto 12px;background:var(--acc)}
.opts button{border-radius:18px}
.opts button.ok{border-color:color-mix(in srgb,var(--good) 65%,transparent);background:color-mix(in srgb,var(--good) 16%,transparent);animation:okPulse .55s var(--spring)}
.opts button.ng{border-color:color-mix(in srgb,var(--bad) 65%,transparent);background:color-mix(in srgb,var(--bad) 13%,transparent);animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes okPulse{0%{transform:scale(.97)}55%{transform:scale(1.02)}100%{transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.feedback{animation:fbIn .4s var(--ease)}
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}}

/* stats */
.key{border-radius:16px}
.stdetail{margin:0 0 calc(8px + env(safe-area-inset-bottom,0px));border-radius:24px;padding:10px 14px;bottom:8px}
.toast{color:var(--fg);border-radius:999px;padding:10px 18px;animation:toastIn .26s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.94)}to{opacity:1;transform:translateX(-50%)}}

html[data-vt="theme"]::view-transition-old(root){animation:none}
html[data-vt="theme"]::view-transition-new(root){animation:reveal .45s cubic-bezier(.4,0,.2,1)}
@keyframes reveal{from{clip-path:circle(0 at var(--vt-x,90%) var(--vt-y,5%))}to{clip-path:circle(150vmax at var(--vt-x,90%) var(--vt-y,5%))}}
@media (prefers-reduced-motion:reduce){.menu,.toast,.feedback,.opts button.ok,.opts button.ng{animation:none}}

/* quiz type dropdown */
.qtbtn{border-radius:999px;height:40px}
.qti{background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.qtrow{border-radius:15px}
.qtrow:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.qtrow[aria-selected="true"]{background:color-mix(in srgb,var(--acc) 14%,transparent)}

/* tone colours & info */
.toneinfo{border-radius:999px;margin-top:16px;color:var(--soft)}
.spk{box-shadow:var(--g-inset);transition:transform .25s var(--spring),background .2s}.spk:active{transform:scale(.9)}
.homeacts{margin-top:10px}.homeacts .toneinfo{margin:0}
.bkopt{background:var(--g-solid);border-color:var(--g-edge);box-shadow:var(--g-inset),var(--g-drop);transition:transform .32s var(--spring),background .2s}
.bkopt:active{transform:scale(.98)}
.bkopt .bi{box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.toneinfo .excl{color:var(--acc);box-shadow:0 0 14px -2px color-mix(in srgb,var(--acc) 60%,transparent)}
.scrim2{background:rgba(8,10,16,.34);animation:fadeIn .22s ease both}
.isheet{background:var(--g-head);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);border:1px solid var(--g-edge);border-radius:32px 32px 0 0;
  box-shadow:var(--g-inset),0 -24px 60px -24px rgba(0,0,0,.4);animation:sheetUpL .34s cubic-bezier(.2,.9,.25,1) both}
@media (min-width:600px){.isheet{border-radius:32px;animation-name:sheetPopL}}
@keyframes sheetUpL{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetPopL{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.ihead .excl{box-shadow:0 0 16px -2px color-mix(in srgb,var(--acc) 60%,transparent)}
.xbtn{border-radius:50%;color:var(--fg)}
.tone{background:var(--g-solid);border:1px solid var(--g-edge);box-shadow:var(--g-inset);border-radius:16px}
.isec{border-top-color:var(--line)}
.gh{border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),var(--g-drop)}
.bkcode{background:var(--g-solid);border-color:var(--g-edge);border-radius:16px;box-shadow:var(--g-inset)}
.ghost.pri{background:var(--acc);border-color:transparent;color:var(--on-acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--g-drop)}
.plink{background:var(--g-solid);border-color:var(--g-edge);border-radius:16px;box-shadow:var(--g-inset)}
/* guided learning */
.plan,.insights,.chk,.gchip{background:var(--g-fill);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop)}
.plan{position:relative;border-radius:30px}.plan::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:var(--g-rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.planbtn{position:relative;border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--g-drop);transition:transform .32s var(--spring)}
.planbtn:active{transform:scale(.97)}
.gchip{transition:transform .32s var(--spring)}.gchip:active{transform:scale(1.05)}
.insights{border-radius:24px}
.chk{border-radius:24px}
.gseg,.gnum,.gdate{background:var(--g-solid);border-color:var(--g-edge);box-shadow:var(--g-inset);transition:transform .25s var(--spring),background .2s}
.gseg:active,.gnum:active{transform:scale(.96)}
.gseg[aria-pressed="true"],.gnum[aria-pressed="true"]{background:var(--acc);border-color:transparent;color:var(--on-acc)}
.gsegs.lv .gseg[aria-pressed="true"]{background:var(--lc)}
.gfc{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.res{animation:fbIn .3s var(--ease)}
/* v1.10: realm chip, Soul Sea cards, trial chip, help topics */
.curlv b{text-shadow:0 0 14px color-mix(in srgb,var(--lc) 35%,transparent)}
.scard,.chalchip{background:var(--g-fill);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop)}
.scard{border-radius:26px}
.chalchip{transition:transform .32s var(--spring)}.chalchip:active{transform:scale(1.05)}
.hlp{background:var(--g-solid);border-color:var(--g-edge);box-shadow:var(--g-inset)}
.wheel .elg:not(.strong):not(.weak) circle{fill:color-mix(in srgb,var(--bg) 80%,transparent)}
.adv,.hrow2{box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.rp.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 25%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
/* ===== v1.13 design pass ===== */
/* long word lists: cards off screen are not laid out or painted until scrolled near */
.list .item{content-visibility:auto;contain-intrinsic-size:auto 150px}
/* tribulation: the rules in one quiet box; strike results with aligned bars */
.btrules{background:color-mix(in srgb,var(--fg) 5%,transparent);border-radius:16px;padding:11px 14px;margin:12px 0 16px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45}
.btrules p{margin:0}.btrules .mute{color:var(--soft);font-size:12.5px}
.stkres .skrow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 4.6em}
.stkres .skrow>b{white-space:nowrap}
/* realm history: name, pinyin and meaning, date in fixed columns */
.hist .hrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;column-gap:10px;align-items:baseline}
.hist .hrow .hmid{font-size:13px;min-width:0}
.hist .hrow small.hpy{margin-left:0;font-size:11.5px}
.hist .hrow .hdt{margin-left:0;font-size:12px;color:var(--soft);white-space:nowrap}
.eln em.na{color:var(--mute);font-weight:600;font-size:12px}
/* model accuracy folds into one line */
.mcheck>summary{cursor:pointer;font-size:14px}
.mcheck>summary b{font-weight:800}
.mcheck .mcsum{display:block;margin:1px 0 0 18px;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.mcheck[open]>summary{margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.res{animation:none}}

/* ---- v1.14 fixes ---- */
/* the glass rim is an absolute layer one box tall: inside a box that scrolls it scrolled away with the content and left
   a straight line with square corners mid-sheet (Josh's screenshot). Scrolling boxes keep their own 1px edge instead. */
.isheet::after,.umenu::after,.face.back::after{content:none}

/* ===== v1.14 Home: Fluid Glass (Josh: "Ruang Kultivasi" × Liquid Glass × fluid, like his references) =====
   One screen, top to bottom: header pills (wordmark · cultivation days · Settings), the realm orb flowing into the
   panel with the realm line and today's plan (one SVG shape, static), word mastery with the HSK picker, the dock.
   Nothing here blurs (Home does not scroll under anything) and nothing moves except on a tap. */
:root{--gold:#9a6a12;--f0:rgba(255,255,255,.66);--f1:rgba(255,255,255,.36);--r0:rgba(255,255,255,.98);--r1:rgba(255,255,255,.22);--r2:rgba(255,255,255,.75);
  --card:rgba(255,255,255,.88);--card-sh:0 12px 28px -16px rgba(30,40,60,.35);--shape-sh:drop-shadow(0 26px 30px rgba(30,45,70,.16));--warm:rgba(255,190,140,.42)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold:#ebc277;--f0:rgba(255,255,255,.115);--f1:rgba(255,255,255,.045);--r0:rgba(255,255,255,.4);--r1:rgba(255,255,255,.05);--r2:rgba(255,255,255,.2);
  --card:rgba(255,255,255,.075);--card-sh:inset 0 1px 0 rgba(255,255,255,.12);--shape-sh:drop-shadow(0 26px 30px rgba(0,0,0,.5));--warm:color-mix(in srgb,var(--gold) 16%,transparent)}}
:root[data-theme="dark"]{--gold:#ebc277;--f0:rgba(255,255,255,.115);--f1:rgba(255,255,255,.045);--r0:rgba(255,255,255,.4);--r1:rgba(255,255,255,.05);--r2:rgba(255,255,255,.2);
  --card:rgba(255,255,255,.075);--card-sh:inset 0 1px 0 rgba(255,255,255,.12);--shape-sh:drop-shadow(0 26px 30px rgba(0,0,0,.5));--warm:color-mix(in srgb,var(--gold) 16%,transparent)}
:root[data-theme="black"]{--gold:#ebc277;--f0:rgba(255,255,255,.09);--f1:rgba(255,255,255,.03);--r0:rgba(255,255,255,.34);--r1:rgba(255,255,255,.04);--r2:rgba(255,255,255,.16);
  --card:rgba(255,255,255,.06);--card-sh:inset 0 1px 0 rgba(255,255,255,.1);--shape-sh:none;--warm:color-mix(in srgb,var(--gold) 10%,transparent)}
/* a second, warm light low on the right so the glass has colour to show through */
.liquid-bg::before{content:"";position:absolute;inset:0;background:radial-gradient(70vmax 55vmax at 105% 78%,var(--warm),transparent 70%)}

body[data-screen="home"] #scr-home{display:flex;flex-direction:column;gap:12px;min-height:calc(100svh - 12px - env(safe-area-inset-bottom,0px))}
#scr-home>*{margin-top:0;margin-bottom:0}
header.top{gap:8px}
.hp{height:48px;border-radius:24px;display:flex;align-items:center;background:var(--g-fill);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop);color:var(--fg);position:relative}
.brand.hp{flex:0 1 auto;padding:0 18px 0 16px}
header.top .wm1{font-size:calc(20px*var(--fsd,1))}
header.top .wm2{font-size:calc(8px*var(--fsd,1));margin-top:4px;letter-spacing:.36em}
header.top .brand{margin-right:auto}
.streak{gap:7px;padding:0 15px 0 7px;font-weight:800;font-size:calc(14.5px*var(--fsd,1));font-variant-numeric:tabular-nums;transition:transform .32s var(--spring)}
.streak small{font-size:calc(12.5px*var(--fsd,1));font-weight:700;color:var(--soft)}
.streak .inc{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mute);background:color-mix(in srgb,var(--fg) 7%,transparent)}
.streak .inc svg{width:17px;height:19px}
.streak .inc .smoke{opacity:.35}
.streak.lit .inc{color:#fff;background:radial-gradient(90% 80% at 30% 20%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),linear-gradient(160deg,#f2a15c,#d9573a);box-shadow:0 6px 14px -6px #d9573a}
.streak.lit .inc .smoke{opacity:1}
.hpi{width:48px;justify-content:center;transition:transform .32s var(--spring)}
.hpi svg{width:21px;height:21px}
.hp:active{transform:scale(1.06)}
.hpi.due::before{content:"";position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--s-yellow);box-shadow:0 0 0 2px var(--bg-top)}

/* the realm orb and the panel it flows into */
.fluid{position:relative;flex:1 1 auto;display:flex;flex-direction:column;--ob:clamp(124px,min(calc(21svh + max(0px,100svh - 780px)*.35),52vw),214px);--lc:var(--mute);isolation:isolate}
.fshape{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:-1;filter:var(--shape-sh)}
.fshape #fpath{fill:url(#fgFill);stroke:url(#fgRim);stroke-width:1.2}
.fshape .f0{stop-color:var(--f0)}.fshape .f1{stop-color:var(--f1)}
.fshape .r0{stop-color:var(--r0)}.fshape .r1{stop-color:var(--r1)}.fshape .r2{stop-color:var(--r2)}
.fshape .o0{stop-color:var(--gold)}.fshape .o1{stop-color:var(--lc)}
.fglow{position:absolute;z-index:-2;left:12%;right:12%;bottom:-6px;height:110px;border-radius:50%;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 70%,transparent),var(--acc),color-mix(in srgb,var(--lc) 60%,#e89ab0));opacity:.32;filter:blur(30px)}
.rorbw{position:relative;align-self:center;margin-top:auto}
.rorb{position:relative;width:var(--ob);height:var(--ob);border-radius:50%;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--fg);
  background:radial-gradient(110% 80% at 34% 16%,rgba(255,255,255,.55),rgba(255,255,255,0) 52%);transition:transform .32s var(--spring)}
:root[data-theme="dark"] .rorb,:root[data-theme="black"] .rorb{background:radial-gradient(110% 80% at 34% 16%,rgba(255,255,255,.13),rgba(255,255,255,0) 52%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rorb{background:radial-gradient(110% 80% at 34% 16%,rgba(255,255,255,.13),rgba(255,255,255,0) 52%)}}
.rorb:active{transform:scale(.96)}
.oring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.oring circle{fill:none;stroke-width:4.5}
.otrk{stroke:color-mix(in srgb,var(--fg) 10%,transparent)}
.oarc{stroke:url(#orbG);stroke-linecap:round;stroke-dasharray:0 400;transition:stroke-dasharray .7s var(--ease)}
.rorb b{font-family:var(--f-hz);font-weight:900;font-size:calc(var(--ob)*.3);line-height:1.05;letter-spacing:.04em;color:var(--lc);text-shadow:0 0 22px color-mix(in srgb,var(--lc) 30%,transparent)}
.rorb .opy{font-size:calc(11.5px*var(--fsd,1));color:var(--soft);margin-top:1px}
.rorb .opct{font-size:calc(var(--ob)*.125);font-weight:400;font-variant-numeric:tabular-nums;margin-top:1px}
.rorb.mortal b{color:var(--soft);text-shadow:none}
.rorb.mortal .opct{font-size:calc(12px*var(--fsd,1));font-weight:800;color:var(--acc)}
.rorb.btready{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 60%,transparent);animation:btGlow 2.4s ease-in-out infinite}
@keyframes btGlow{50%{box-shadow:0 0 34px 6px color-mix(in srgb,var(--gold) 45%,transparent)}}
.rorb.unstable .oarc{stroke-dasharray:3 6!important;stroke:var(--s-red)}
.ringq{position:absolute;left:calc(100% - 6px);top:2px;width:42px;height:42px;border-radius:50%;border:2.5px solid #fff;background:color-mix(in srgb,var(--bg) 30%,transparent);color:var(--fg);font-weight:800;font-size:calc(15px*var(--fsd,1));
  box-shadow:0 0 16px rgba(255,255,255,.85),inset 0 0 10px rgba(255,255,255,.55);transition:transform .32s var(--spring)}
:root[data-theme="dark"] .ringq,:root[data-theme="black"] .ringq{border-color:rgba(255,255,255,.8);box-shadow:0 0 14px rgba(255,255,255,.4),inset 0 0 8px rgba(255,255,255,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ringq{border-color:rgba(255,255,255,.8);box-shadow:0 0 14px rgba(255,255,255,.4),inset 0 0 8px rgba(255,255,255,.25)}}
.ringq:active{transform:scale(1.08)}
.rtext{text-align:center;padding:14px 20px 0}
.rname2{font-size:calc(19px*var(--fsd,1));font-weight:800;letter-spacing:-.01em;line-height:1.25}
.rname2 span{font-weight:500;color:var(--soft)}
.rline{font-size:13.5px;color:var(--soft);margin-top:3px;line-height:1.4}
.rline .rgo{color:var(--gold)}.rline .rwarn{color:var(--s-red)}
.rname2 .grade{margin-left:2px;vertical-align:3px}
.rstage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:10px auto 0;max-width:420px}
.rstage .rs{display:flex;flex-direction:column;gap:4px;min-width:0}
.rstage i{display:block;height:5px;border-radius:3px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden}
.rstage u{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--lc))}
.rstage small{font-size:calc(11px*var(--fsd,1));color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rstage .on small{color:var(--fg);font-weight:800}
.fluid .plan{margin:0 12px 12px;background:var(--card);border:0;box-shadow:var(--card-sh);border-radius:26px;padding:12px 14px 14px}
.fluid .plan::after{content:none}
.fluid .rtext{margin-bottom:auto;padding-bottom:14px}
.fluid .planbtn{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 22px -10px var(--acc)}

/* word mastery: HSK picker like a calendar row, one bar, the counts */
.mast{position:relative;border-radius:30px;padding:10px 14px 12px;background:var(--g-fill);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop)}
.mhd{display:flex;align-items:center;gap:8px;min-width:0}
.mhd h2{margin:0;font-size:calc(15px*var(--fsd,1));font-weight:800;white-space:nowrap}
.mcnt{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgo{flex:none;border:0;background:none;padding:0 2px;min-height:36px;font-size:13px;font-weight:800;color:var(--acc)}
.mast .lvseg{margin:2px 0 0;padding:2px;background:none;border:0;box-shadow:none}
.mast .lvseg::after{content:none}
.mast .lvpill{padding:5px 0 6px;border-radius:20px}
.mast .lvpill b{display:flex;flex-direction:column;align-items:center;font-size:calc(20px*var(--fsd,1));font-weight:500;line-height:1.05}
.mast .lvpill .hl{font-size:calc(9.5px*var(--fsd,1));font-weight:700;color:var(--soft);letter-spacing:.02em}
.mast .lvpill small{font-size:calc(10px*var(--fsd,1))}
.mast .lvpill[aria-pressed="true"] b,.mast .lvpill[aria-pressed="true"] .hl,.mast .lvpill[aria-pressed="true"] small{color:var(--on-acc)}
.mast .lens{border-radius:20px;background:radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.45),rgba(255,255,255,0) 55%),var(--acc);box-shadow:0 8px 18px -8px var(--acc),inset 0 1px 0 rgba(255,255,255,.4)}
.mast .lens::after{content:none}
.mbar2{display:flex;align-items:center;gap:10px;margin-top:6px}
.mbar2 b{font-size:calc(19px*var(--fsd,1));font-weight:700;font-variant-numeric:tabular-nums;min-width:3ch}
.mstack{flex:1 1 auto;display:flex;gap:2px;height:8px;border-radius:5px;overflow:hidden;background:color-mix(in srgb,var(--fg) 9%,transparent)}
.mstack i{display:block;height:100%}
.mkeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 8px;margin-top:6px}
.mkeys .hkey{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:0}
.mkeys .hkey b{margin:0}
.mkeys b{font-size:14px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.2}
.mkeys small{display:block;font-size:calc(11px*var(--fsd,1));color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkeys small{align-self:stretch;max-width:100%}
.mkeys .sd{width:7px;height:7px;margin-right:4px;vertical-align:1px}
/* the plan's status line stays one line on Home (the full text is in the goal sheet) */
.fluid .pst span{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.bigtext .fluid .pst span{-webkit-line-clamp:3}

/* the dock: three practice modes on one glass bar */
.tiles.dock{margin:0;gap:0;padding:4px;border-radius:28px;background:var(--g-fill);border:1px solid var(--g-edge);box-shadow:var(--g-inset),var(--g-drop)}
.dock .tile{background:none;border:0;box-shadow:none;border-radius:24px;min-height:58px;padding:6px 4px;align-items:center;justify-content:center;text-align:center;gap:2px}
.dock .tile::after{content:none}
.dock .tile .ic{width:auto;height:auto;background:none;border:0;box-shadow:none;margin:0;color:var(--fg)}
.dock .tile .ic svg{width:23px;height:23px}
.dock .tile b{font-size:calc(12.5px*var(--fsd,1));font-weight:700}
.dock .tile:active{transform:scale(.95);background:color-mix(in srgb,var(--fg) 6%,transparent)}

/* short phones: a smaller orb and tighter gaps; larger phone text: Home may scroll */
/* the plan button sits beside the plan line (not below it) whenever there is room */
.fluid .pmain{flex-wrap:nowrap}.fluid .ptxt{flex:1 1 auto;min-width:0}.fluid .pmain .planbtn{flex:none}
@media (max-height:760px){body[data-screen="home"] #scr-home{gap:9px}.fluid{--ob:clamp(100px,16svh,132px)}.rtext{padding-top:6px}.fluid .rtext{margin-bottom:8px}
  .rstage{margin-top:6px}.mkeys{display:none}.fluid .pst{display:none}.fluid .plan{padding:10px 12px 12px;gap:4px}
  .mast{padding:8px 12px 10px}.mast .lvpill{padding:3px 0 4px}.mbar2{margin-top:4px}.dock .tile{min-height:50px}.hp{height:44px}.hpi{width:44px}}
/* a new learner on a short phone: word mastery is all zero anyway, so the two ways in get its room */
@media (max-height:760px){#scr-home.newbie .mast{display:none}}
@media (max-height:620px){.rline{display:none}.rname2{font-size:calc(16px*var(--fsd,1))}}
@media (max-width:380px){.rname2{font-size:calc(16.5px*var(--fsd,1))}}
.bigtext body[data-screen="home"] #scr-home{min-height:0}
.bigtext .wm2{display:none}
.bigtext .fluid{flex:none}
.bigtext .fluid .pmain{flex-wrap:wrap}.bigtext .fluid .pmain .planbtn{flex:1 0 auto}
.bigtext .mkeys{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:359px){.brand.hp{padding:0 12px}.streak small{display:none}header.top .wm1{font-size:calc(18px*var(--fsd,1))}}

/* Settings and cultivation days */
.sgrp{margin-top:14px}
.sgrp h3{margin:0 0 6px 4px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border-radius:18px;border:1px solid var(--g-edge);background:var(--g-solid);box-shadow:var(--g-inset);color:var(--fg);text-align:left;text-decoration:none;font-size:15px;font-weight:600}
.srow+.srow,.langwrap+.srow{margin-top:6px}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}
.srow .sl{font-weight:700}
.sbtn:active{transform:scale(.985)}
.sbtn{transition:transform .25s var(--spring)}
.si{width:22px;height:22px;flex:none;color:var(--acc)}
.tzs{display:flex;gap:1px;font-family:var(--f-hz);font-weight:900;font-size:15px;line-height:22px;width:auto}
.stx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.stx small{font-size:12.5px;font-weight:500;color:var(--soft);margin-top:1px}
.sv{font-size:13px;color:var(--soft)}
.srow .chev{color:var(--mute);font-size:18px;line-height:1}
.bkbtn.due .si{color:var(--s-yellow)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:3px;border-radius:14px;background:color-mix(in srgb,var(--fg) 6%,transparent)}
.seg button{min-height:40px;border:0;border-radius:11px;background:none;font-size:13px;font-weight:700;color:var(--soft);display:flex;align-items:center;justify-content:center;gap:5px;padding:4px 6px;min-width:0}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px -3px rgba(0,0,0,.3)}
.seg .thi svg{width:15px;height:15px;display:block}
.snote{margin:0;font-size:12.5px;color:var(--soft)}
.lmenu{margin-top:6px;padding:4px;border-radius:18px;border:1px solid var(--g-edge);background:var(--g-solid)}
.sbig{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
.sbig .inc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--mute);background:color-mix(in srgb,var(--fg) 7%,transparent)}
.sbig .inc svg{width:26px;height:29px}
.sbig .inc.lit{color:#fff;background:radial-gradient(90% 80% at 30% 20%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),linear-gradient(160deg,#f2a15c,#d9573a)}
.sbig b{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sbig span:last-child{font-size:15px;color:var(--soft);font-weight:700}
.snow{margin:0 0 12px;font-size:14px;color:var(--soft)}.snow.ok{color:var(--good);font-weight:700}
.scal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.scal .sw{font-size:11px;font-weight:800;color:var(--mute)}
.sc{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-size:12.5px;font-weight:700;color:var(--soft);background:color-mix(in srgb,var(--fg) 5%,transparent)}
.sc.done{background:linear-gradient(160deg,#f2a15c,#d9573a);color:#fff}
.sc.rest{background:color-mix(in srgb,var(--l2) 22%,transparent);color:var(--fg)}
.sc.fut{background:none;opacity:.35}
.sc.now{box-shadow:0 0 0 2px var(--fg)}
.skeys{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 4px;font-size:12px;color:var(--soft)}
.skeys span{display:inline-flex;align-items:center;gap:6px}
.skeys .sc{width:14px;height:14px;aspect-ratio:auto;display:inline-block}
.sbest{margin:6px 0 0;font-size:13px;font-weight:700}

/* new learner: two ways in; the short tour */
.nbopt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 16px;border-radius:20px;border:1px solid var(--g-edge);background:var(--g-solid);color:var(--fg);text-align:left;transition:transform .25s var(--spring)}
.nbopt span{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.nbopt b{font-size:15.5px;font-weight:800}
.nbopt small{font-size:12.5px;color:var(--soft)}
.nbopt.pri{border:0;background:radial-gradient(130% 95% at 30% -25%,rgba(255,255,255,.45),rgba(255,255,255,0) 52%),var(--acc);color:var(--on-acc);box-shadow:0 10px 22px -10px var(--acc)}
.nbopt.pri small{color:inherit;opacity:.85}
.nbopt svg{width:18px;height:18px;flex:none}
.nbopt .chev{flex:none;font-size:18px;color:var(--mute)}
.nbopt:active{transform:scale(.98)}
.fluid .plan .nbopt+.nbopt{margin-top:2px}
.tsheet{text-align:center;padding-top:22px}
.tdots{display:flex;justify-content:center;gap:6px}
.tdots i{width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--fg) 18%,transparent)}
.tdots i.on{width:20px;border-radius:4px;background:var(--acc)}
.tart{width:96px;height:96px;margin:18px auto 6px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(110% 80% at 34% 16%,rgba(255,255,255,.6),rgba(255,255,255,0) 52%),color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid var(--g-edge);color:var(--acc)}
.tart b{font-family:var(--f-hz);font-weight:900;font-size:28px;color:var(--gold)}
.tart svg{width:34px;height:34px}
.tsheet h2{margin:10px 0 6px;font-size:21px}
