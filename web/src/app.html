/* ---------- practice: Cards, Quiz and today's session share one runner ----------
   A run is a list of items: cards ({k:'card'}) and questions ({k:'q', q: m|f|s|l|c}). Answers go to LM.answer,
   which updates the memory model, the 0–20 level and the answer log. Wrong answers come back a few items later. */
let run=null,sessionExtra=false,pendingRun=null;   /* pendingRun {mode, items}: a ready-made round (today's trial, words to strengthen) */
const EXAM_N=20,EXAM_SEC=300,ROUND_Q=12,ROUND_C=20;
function resetRun(){if(run&&run.timer)clearInterval(run.timer);if(run&&run.brT)clearInterval(run.brT);run=null}
const startCards=resetRun,startQuiz=resetRun;      /* level/unit change, restore and reset start a fresh run */
function ttsOK(){try{if(window.MMAndroid&&typeof MMAndroid.ttsStatus==='function')return MMAndroid.ttsStatus()==='ready';
  return 'speechSynthesis' in window&&speechSynthesis.getVoices().some(v=>/^zh[-_]?(CN|Hans)?/i.test(v.lang)&&!/TW|HK/i.test(v.lang))}catch(e){return false}}
LM.setTts(ttsOK);
function makeRun(mode){
  resetRun();let items,exam=false,lv=state.level;
  if(pendingRun&&pendingRun.mode===mode){items=pendingRun.items;pendingRun=null}
  else if(mode==='card')items=LM.cardDeck(pool(),ROUND_C).map(d=>({k:'card',d}));
  else if(mode==='session')items=LM.session(sessionExtra);
  else if(qType==='exam'){exam=true;items=LM.exam(lv,EXAM_N)}
  else items=LM.quizRound(pool(),ROUND_Q,qType==='auto'?null:qType);
  run={mode,items,i:0,ok:0,tot:0,before:new Map(),wrong:new Map(),conf:[],again:new Map(),exam,lv,over:0};
  if(exam){run.end=Date.now()+EXAM_SEC*1000;run.timer=setInterval(tick,1000)}}
function renderRun(){
  if(!run)makeRun(state.screen);
  if(run.brk){renderBreak();return}
  const it=run.items[run.i];
  if(!it){renderSummary();return}
  if(!run.exam&&!it.st&&!it.opts){const f=fatigue();if(f){sit.shown=true;run.brk={f};renderBreak();return}}
  if(!run.before.has(it.d.id))run.before.set(it.d.id,lvl(it.d));
  if(it.k==='card')renderCardItem(it);else renderQItem(it)}
function nextItem(){run.i++;renderRun();window.scrollTo(0,0)}

/* ---- rest (调息): a "sitting" is a run of answers with no gap over 10 minutes. Tiredness shows as falling accuracy
   (last 10 answers 15+ points below the first 10), slower answers (median time ×1.4) or a long sitting (25 min);
   then, once per sitting, a short break is offered — never forced. */
let sit={t0:0,last:0,ans:[],shown:false,brk:null};
const accOf=a=>a.length?Math.round(a.reduce((x,y)=>x+y[0],0)/a.length*100):0;
function noteAns(ok,ms){const t=Date.now();if(!sit.last||t-sit.last>6e5)sit={t0:t,last:t,ans:[],shown:false,brk:null};sit.last=t;sit.ans.push([ok?1:0,Math.min(6e4,ms||0)])}
function fatigue(){const a=sit.ans;if(sit.shown||a.length<20||Date.now()-sit.last>6e5)return null;
  const f=a.slice(0,10),l=a.slice(-10),med=x=>{const m=x.map(y=>y[1]).sort((p,q)=>p-q);return (m[4]+m[5])/2},A=accOf(f),B=accOf(l);
  if(A-B>=15)return {k:'acc',a:A,b:B};
  if(med(l)>=1.4*Math.max(1500,med(f)))return {k:'slow'};
  const m=Math.round((Date.now()-sit.t0)/6e4);return m>=25?{k:'time',m}:null}
const mmss=x=>`${x/60|0}:${String(x%60).padStart(2,'0')}`;
function renderBreak(){const b=run.brk,f=b.f,left=b.end?Math.max(0,Math.ceil((b.end-Date.now())/1000)):300,done=!!b.end&&left<=0;
  const why=f.k==='acc'?L10.brAcc(f.a,f.b):f.k==='slow'?L10.brSlow:L10.brTime(f.m);
  view.innerHTML=`<div class="qcard sum restcard"><div class="big t4" lang="zh-CN">调息</div><h3>${b.end?(done?L10.brDone:L10.brT2):L10.brT}</h3>
    ${b.end?`<div class="breath">${done?'':'<div class="bcirc" aria-hidden="true"></div>'}<div class="btime" id="brTime" role="timer">${mmss(left)}</div><div class="bcue" id="brCue" aria-live="polite">${done?'':L10.brIn}</div></div>${done?'':`<p class="sumnote">${L10.brHow}</p>`}`
      :`<p class="sumnote">${why}</p><p class="sumnote">${L10.brWhy}</p>`}
    <div class="sumbtns${b.end?'':' three'}"><button class="ghost" id="brStop">${L10.brStop}</button>${b.end?'':`<button class="ghost" id="brGo">${L10.brGo}</button>`}<button class="next" id="brSkip">${b.end?L10.brCont:L10.brSkip}</button></div></div>`;
  $('brSkip')?.focus({preventScroll:true})}
function breakStart(){const b=run.brk;b.end=Date.now()+300000;b.t0=Date.now();renderBreak();
  run.brT=setInterval(()=>{if(!run||run.brk!==b)return;const left=Math.max(0,Math.ceil((b.end-Date.now())/1000));
    if(left<=0){clearInterval(run.brT);run.brT=0;renderBreak();window.mmFeedback&&mmFeedback(true);return}
    const el=$('brTime'),cue=$('brCue');if(el)el.textContent=mmss(left);if(cue)cue.textContent=Math.floor((Date.now()-b.t0)/4000)%2?L10.brOut:L10.brIn},1000)}
function breakEnd(stop){if(run.brT){clearInterval(run.brT);run.brT=0}const b=run.brk;run.brk=null;
  if(b&&b.end)sit.brk={at:sit.ans.length,acc:accOf(sit.ans.slice(-10))};
  if(stop)run.i=run.items.length;
  renderRun();window.scrollTo(0,0)}
/* bring a word back a few items later (at most twice per word in a run) */
function again(item,copy){const n=run.again.get(item.d.id)||0;if(n>=2||run.exam)return;run.again.set(item.d.id,n+1);
  run.items.splice(Math.min(run.items.length,run.i+4),0,copy)}
const progH=(i,n)=>`<span class="mbar"><span class="stack"><i style="width:${Math.min(100,i/Math.max(1,n)*100)}%;background:var(--acc)"></i></span></span>`;
const TNAME=()=>({m:L10.tMean,f:L10.tHz,s:L10.tTone,l:L10.tListen,c:L10.tCloze});
function qtList(){return [['auto',L10.tAuto,L10.dAuto,'智'],['m',L10.tMean,L10.dMean,'汉→a'],['f',L10.tHz,L10.dHz,'a→汉'],['s',L10.tTone,L10.dTone,'mā'],
  ...(canSpeak()?[['l',L10.tListen,L10.dListen,'♪→汉']]:[]),['c',L10.tCloze,L10.dCloze,'汉＿'],['exam',L10.tExam,L10.dExam(EXAM_N,EXAM_SEC/60),'考']]}
function clock(){const s=run&&run.end?Math.max(0,Math.ceil((run.end-Date.now())/1000)):0;return `${s/60|0}:${String(s%60).padStart(2,'0')}`}
function tick(){if(!run||!run.exam)return;const el=$('exTimer');if(el)el.textContent=clock();
  if(Date.now()>=run.end){clearInterval(run.timer);run.timer=0;run.timeUp=true;run.i=run.items.length;if(state.screen==='quiz')renderRun()}}
function runHead(){
  const n=run.items.length,i=Math.min(run.i+1,n),it=run.items[run.i];
  if(run.mode==='card')return `<div class="fcmeta"><span>${L10.cardN(i,n)}</span>${progH(run.i,n)}</div>`;
  if(run.mode==='session'){const lab=!it||it.k==='card'?'':TNAME()[it.q];   /* a card shows "new word" or its level on its face */
    return `<div class="fcmeta"><span>${L10.qN(i,n)}</span><span class="tlabel">${esc(lab)}</span>${progH(run.i,n)}</div>`}
  const QT=qtList(),cur=QT.find(q=>q[0]===qType)||QT[0];
  return `<div class="qhead"><div class="qsel" id="qsel">
      <button class="qtbtn" id="qTypeBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="${L10.qTypeL}: ${cur[1]}"><span class="qti">${cur[3]}</span><span class="qtl">${cur[1]}</span>${CHEV}</button>
      <div class="menu qmenu" id="qTypeMenu" role="listbox" aria-label="${L10.qTypeL}" hidden>${QT.map(q=>`<button class="qtrow" role="option" data-qt="${q[0]}" aria-selected="${q[0]===qType}"><span class="qti">${q[3]}</span><span class="nm"><b>${q[1]}</b><small>${q[2]}</small></span>${CHECK}</button>`).join('')}</div>
     </div><div class="score">${run.exam?`<span class="timer" id="exTimer">${clock()}</span><span>${L10.qN(i,n)}</span>`
       :`<span>${L10.qN(i,n)}</span><span>${L10.right} <b>${run.ok}</b>/${run.tot}</span>`}</div></div>`}

/* ---- cards: "Don't know" / "I know it" → a quick check (adaptive) → the back of the card ---- */
const pyOpt=a=>esc(a.map((s,i)=>(i&&/^[aeoāáǎàēéěèōóǒò]/i.test(s)?"'":'')+s).join(''));
function backFace(d){return `<div class="face back"><div class="head"><span class="hz">${hzH(d)}</span><span class="py">${pyH(d)}</span>${spk(d.h)}</div>
      <div class="mean">${mH(M(d))}</div><div class="ex"><div class="zh">${exH(d)}${spk(d.z,' sm')}</div>${zpH(d)}<div class="id">${esc(TR(d))}</div></div></div>`}
function renderCardItem(it){
  const d=it.d;if(!it.st){it.st='front';it.t0=performance.now();it.fresh=!LM.has(d.id)}
  view.innerHTML=runHead()+`<div class="flip${it.st==='back'?' on':it.st==='check'?' checking':''}" id="flip"><div class="inner">
    <div class="face">${it.fresh?`<span class="st newtag">${L10.newWord}</span>`:stH(d)}<div class="big">${esc(d.h)}</div>${spk(d.h,' lg')}<div class="hint">${L10.fcHint}</div></div>
    ${backFace(d)}</div></div><div class="fcact" id="fcAct">${cardAct(it)}</div>`}
function cardAct(it){
  if(it.st==='front')return `<div class="fcbtns"><button class="no-btn" id="fcNo">${L10.fcDont}</button><button class="yes-btn" id="fcYes">${L10.fcKnow}</button></div>`;
  if(it.st==='check'){const c=it.chk;return `<div class="chk"><div class="q">${c.q==='cs'?L10.chkTone:L10.chkMean}</div><div class="opts">${c.opts.map((o,i)=>
    `<button data-c="${i}">${i+1}. ${c.q==='cs'?`<span class="pyo">${pyOpt(o)}</span>`:esc(M1(o))}</button>`).join('')}</div></div>`}
  const msg={ok:L10.resOk,over:L10.resOver,no:L10.resNo,trust:L10.resTrust}[it.res];
  return `<div class="res ${it.res}" role="status">${msg}</div><div class="fcbtns${it.res==='trust'?'':' one'}">${it.res==='trust'?`<button class="no-btn" id="fcOops">${L10.oops}</button>`:''}<button class="next" id="fcNext">${L10.next}</button></div>`}
/* keep the buttons under the card in view (small screens, large text) */
function inView(el){if(!el)return;const r=el.getBoundingClientRect();if(r.bottom>innerHeight-8)el.scrollIntoView({block:'end',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function cardShow(it,ok){
  it.st='back';run.tot++;if(ok)run.ok++;else run.wrong.set(it.d.id,it.d);noteAns(ok,performance.now()-it.t0);
  window.mmFeedback&&mmFeedback(ok);afterChange();studied();$('flip')?.classList.remove('checking');$('flip')?.classList.add('on');$('fcAct').innerHTML=cardAct(it);$('fcNext')?.focus({preventScroll:true});inView($('fcAct'))}
/* in today's session a new word that was proven also gets a tone question a few items later */
function cardFollow(it,ok){
  if(!ok){again(it,{k:'card',d:it.d});return}
  if(run.mode==='session'&&it.fresh&&!it.followed){it.followed=true;run.items.splice(Math.min(run.items.length,run.i+5),0,{k:'q',d:it.d,q:'s'})}}
function cardDont(it){LM.answer(it.d,{q:'cn',ok:false,ms:performance.now()-it.t0});it.res='no';cardShow(it,false);cardFollow(it,false)}
function cardKnow(it){
  it.claimMs=performance.now()-it.t0;
  if(Math.random()<LM.checkP(it.d)){const q=LM.checkType(it.d,it.heard);it.chk=Object.assign({q},LM.question(it.d,q));it.st='check';
    $('flip').classList.add('checking');$('fcAct').innerHTML=cardAct(it);$('fcAct').querySelector('[data-c]')?.focus({preventScroll:true});inView($('fcAct'));return}
  LM.answer(it.d,{q:'cu',ok:true,ms:it.claimMs,claim:true,unchecked:true});it.res='trust';cardShow(it,true);cardFollow(it,true)}
function cardCheck(it,i){
  const c=it.chk,ok=i===c.ans,x=!ok&&c.q==='cm'?c.opts[i].id:0;c.pick=i;
  LM.answer(it.d,{q:c.q,ok,ms:it.claimMs,x,claim:true,over:!ok});
  if(!ok){run.over++;if(x)run.conf.push([it.d.id,x])}
  it.res=ok?'ok':'over';cardShow(it,ok);cardFollow(it,ok)}
/* "I was wrong" after an unchecked claim: the claim is taken back and counted as not known (no extra penalty) */
function cardOops(it){LM.undo();LM.answer(it.d,{q:'cn',ok:false,ms:it.claimMs});run.ok--;run.wrong.set(it.d.id,it.d);it.res='no';if(sit.ans.length)sit.ans[sit.ans.length-1][0]=0;
  $('fcAct').innerHTML=cardAct(it);$('fcNext')?.focus({preventScroll:true});cardFollow(it,false)}

/* ---- questions ---- */
/* o: {tr: show the translation, hint: offer "Show translation"} — sentence gaps hide the translation until answered */
function qPrompt(d,T,o){return T==='m'?`<div class="q">${L10.qMean}</div><div class="big">${hzH(d)}</div>`
    :T==='f'?`<div class="q">${L10.qHz}</div><div style="font-size:22px;font-weight:800">${esc(M1(d))}</div><div class="id">${esc(M(d).split(';').slice(1).join(';'))}</div>`
    :T==='s'?`<div class="q">${L10.qTone}</div><div class="big">${esc(d.h)}</div><div class="id">${esc(M1(d))}</div>`
    :T==='l'?`<div class="q">${L10.qListen}</div><button class="spk xl" id="qSay" data-say="${esc(d.h)}" aria-label="${esc(L10.replay)}" title="${esc(L10.replay)}">${SPK}</button>`
    :`<div class="q">${L10.qCloze}</div><div class="zh" style="font-size:20px">${esc(d.z).replace(esc(d.h),'<mark>＿＿</mark>')}</div>${d.l<=3&&d.zp?`<div class="zp">${esc(d.zp).replace(/\{[^}]*\}/,'＿＿')}</div>`:''}${o&&o.tr?`<div class="id">${esc(TR(d))}</div>`:o&&o.hint?`<button class="linkbtn trbtn" id="qTr">${L10.showTr}</button>`:''}`}
const qLab=(o,T)=>T==='m'?esc(M1(o)):T==='s'?`<span class="pyo">${pyOpt(o)}</span>`:`<span class="hzo">${esc(o.h)}</span>`;
function renderQItem(it){
  const d=it.d,T=it.q;if(!it.opts){Object.assign(it,LM.question(d,T));it.t0=performance.now()}
  const ans=it.done&&!run.exam,ok=it.ok,prompt=qPrompt(d,T,{tr:it.hint&&!ans,hint:!run.exam&&!it.done}),lab=o=>qLab(o,T);
  const cls=i=>!ans?'':i===it.ans?' class="ok"':i===it.pick?' class="ng"':'';
  const picked=ans&&!ok&&T!=='s'?it.opts[it.pick]:null;
  const amb=T==='c'&&ans&&!ok&&picked&&!it.amb&&ambLeft()>0;
  const fb=!ans?'':`${it.amb?`<div class="fbv amb">${L10.ambDone}</div>`:`<div class="fbv ${ok?'good':'bad'}">${ok?L10.ok:L10.ng}</div>`}
    ${picked?`<div class="picked">${L10.picked} <b class="hzs">${esc(picked.h)}</b> ${esc(picked.p)} · ${esc(M1(picked))}</div>`:''}${amb?`<button class="linkbtn ambbtn" id="qAmb">${L10.ambBtn}</button>`:''}
    <div class="head"><span class="hz" style="font-size:26px">${hzH(d)}</span><span class="py">${pyH(d)}</span>${spk(d.h)}</div><div class="mean">${mH(M(d))}</div>
    <div class="zh">${exH(d)}${spk(d.z,' sm')}</div>${zpH(d)}<div class="id">${esc(TR(d))}</div><div style="margin-top:6px">${stH(d)}</div><button class="next" id="qNext">${L10.next}</button>`;
  view.innerHTML=runHead()+`<div class="qcard qt-${T}">${prompt}<div class="opts">${it.opts.map((o,i)=>`<button data-i="${i}"${cls(i)} ${ans?'disabled':''}>${i+1}. ${lab(o)}</button>`).join('')}</div><div class="feedback" id="fb">${fb}</div></div>`;
  if(T==='l'&&!it.played&&ttsOK()){it.played=true;setTimeout(()=>{const b=$('qSay');if(b&&state.screen===run?.mode)speak(d.h,b)},250)}}
function qAnswer(it,i){
  if(it.done)return;it.done=true;it.pick=i;const ok=i===it.ans;it.ok=ok;
  const x=!ok&&it.q!=='s'?it.opts[i].id:0;
  LM.answer(it.d,{q:it.q,ok,ms:performance.now()-it.t0,x,exam:run.exam,hint:!!it.hint});run.tot++;if(!run.exam)noteAns(ok,performance.now()-it.t0);
  if(ok)run.ok++;else{run.wrong.set(it.d.id,it.d);if(x)run.conf.push([it.d.id,x]);again(it,{k:'q',d:it.d,q:it.q})}
  window.mmFeedback&&mmFeedback(ok);afterChange();studied();
  if(run.exam){run.i++;renderRun();return}
  renderQItem(it)}

/* the learner says their wrong pick also fits the sentence: the answer is taken back, and the two words are never
   offered together again (at most 3 times a day, so it can't be used to skip questions) */
const ambLeft=()=>{const d=new Date().toDateString();return note.amb&&note.amb.d===d?3-note.amb.n:3};
function qAmbig(it){const d=it.d,p=it.opts[it.pick];if(!p||it.amb||it.ok)return;
  LM.undo();LM.markAmbiguous(d.id,p.id);it.amb=true;run.tot--;run.wrong.delete(d.id);
  const k=run.conf.findIndex(c=>c[0]===d.id&&c[1]===p.id);if(k>=0)run.conf.splice(k,1);
  const j=run.items.findIndex((x,i)=>i>run.i&&x.d===d&&x.q===it.q&&!x.opts);if(j>0){run.items.splice(j,1);run.again.set(d.id,Math.max(0,(run.again.get(d.id)||1)-1))}
  if(sit.ans.length)sit.ans.pop();
  const day=new Date().toDateString();note.amb={d:day,n:(note.amb&&note.amb.d===day?note.amb.n:0)+1};saveNote();
  afterChange();renderQItem(it)}

/* ---- end of a run ---- */
/* notes under the summary: how the answers went after a break, the gain of repeating now vs tomorrow, and a late-night note */
function sumNotes(){const out=[];if(run.exam||!run.tot)return out;
  if(sit.brk&&!sit.brk.told&&sit.ans.length-sit.brk.at>=5){const a=sit.ans.slice(sit.brk.at);sit.brk.told=true;out.push(L10.brAfter(a.reduce((x,y)=>x+y[0],0),a.length,sit.brk.acc))}
  const P=LM.plan();
  if((run.mode==='session'&&sessionExtra)||(run.mode!=='session'&&P.todayLeft===0)){const g=LM.gainList([...run.before.keys()].map(id=>IDX.get(id)));
    if(g.n>=5&&g.later>g.now*1.5){const f=x=>(x/g.n).toLocaleString(L10.loc,{maximumFractionDigits:1});out.push(L10.capNote(g.n,f(g.now),f(g.later)))}}
  if(lateNow()&&note.night!==nightKey()){note.night=nightKey();saveNote();out.push(L10.nightNote)}
  return out}
function renderSummary(){
  if(run.timer){clearInterval(run.timer);run.timer=0}
  if(!run.closed){run.closed=true;LM.updWeak();run.notes=sumNotes()}
  const n=run.tot,ok=run.ok,pct=n?Math.round(ok/n*100):0;
  const up=[...run.before].filter(([id,b])=>lvl(IDX.get(id))>Math.max(b,0)).length,wrong=[...run.wrong.values()];
  const seen=new Set(),pairs=run.conf.filter(([a,b])=>{const k=a<b?a+b:b+a;if(seen.has(k))return false;seen.add(k);return true}).slice(0,3);
  const kind=run.exam?'exam':run.mode;
  let note='';
  if(run.exam){const est=Math.max(0,Math.round((ok/run.items.length-.25)/.75*100));note=`<p class="sumnote">${L10.examScore(pct,run.lv,est)}</p>`+(run.timeUp?`<p class="sumnote">${L10.timeUp}</p>`:'')}
  view.innerHTML=(run.mode==='quiz'?runHead():'')+`<div class="qcard sum">
    <div class="big t3">${!n?'好':pct>=80?'好!':'加油'}</div><h3>${L10.sumT[kind]}</h3>
    ${n?`<div class="sumgrid"><div><b>${ok}/${n}</b><small>${L10.sumRight}</small></div><div><b>${up}</b><small>${L10.sumUp}</small></div><div><b>${wrong.length}</b><small>${L10.sumAgain}</small></div></div>`:`<p class="sumnote">${L10.sumEmpty}</p>`}
    ${note}
    ${run.over?`<p class="sumnote">${L10.sumOver(run.over)}</p>`:''}
    ${(run.notes||[]).map(x=>`<p class="sumnote rnote">${x}</p>`).join('')}
    ${pairs.length?`<div class="sumrow"><span>${L10.sumConf}</span>${pairs.map(([a,b])=>`<span class="pair"><b>${esc(IDX.get(a).h)}</b>↔<b>${esc(IDX.get(b).h)}</b></span>`).join('')}</div>`:''}
    ${wrong.length?`<div class="sumwords"><div class="lbl">${L10.sumWrong}</div>${wrong.slice(0,12).map(d=>`<span class="wchip"><b>${hzH(d)}</b>${esc(M1(d))}</span>`).join('')}</div>`:''}
    <div class="sumbtns"><button class="ghost" id="sumHome">${L10.sumHome}</button><button class="next" id="sumMore">${run.mode==='session'?L10.sumSessionMore:L10.sumMore}</button></div></div>`}

view.addEventListener('click',e=>{
  if(!['card','quiz','session'].includes(state.screen)||!run)return;
  if(e.target.closest('#qTypeBtn')){qMenu(!qMenuOpen());return}
  const qt=e.target.closest('.qtrow');if(qt){qMenu(false);if(qt.dataset.qt!==qType){qType=qt.dataset.qt;saveUI();resetRun()}renderRun();$('qTypeBtn')?.focus();return}
  const id=e.target.closest('[id]')?.id;
  if(id==='sumHome'){go('home');return}
  if(id==='sumMore'){if(run.mode==='session')sessionExtra=true;resetRun();renderRun();window.scrollTo(0,0);return}
  if(run.brk){if(id==='brGo')breakStart();else if(id==='brSkip')breakEnd(false);else if(id==='brStop')breakEnd(true);return}
  const it=run.items[run.i];if(!it)return;
  if(it.k==='card'){
    if(id==='fcNo'&&it.st==='front')cardDont(it);
    else if(id==='fcYes'&&it.st==='front')cardKnow(it);
    else if(id==='fcOops'&&it.res==='trust')cardOops(it);
    else if(id==='fcNext'&&it.st==='back')nextItem();
    else{const c=e.target.closest('[data-c]');if(c&&it.st==='check')cardCheck(it,+c.dataset.c)}
    return}
  if(id==='qNext'){nextItem();return}
  if(id==='qTr'&&!it.done){it.hint=true;renderQItem(it);return}
  if(id==='qAmb'){qAmbig(it);return}
  const b=e.target.closest('.opts button');if(b&&!it.done)qAnswer(it,+b.dataset.i);
});
const qMenuOpen=()=>{const m=$('qTypeMenu');return !!m&&!m.hidden};
function qMenu(open){const m=$('qTypeMenu'),b=$('qTypeBtn');if(!m)return;m.hidden=!open;b.setAttribute('aria-expanded',open);if(open)(m.querySelector('[aria-selected="true"]')||m.firstElementChild).focus()}
view.addEventListener('keydown',e=>{if(!qMenuOpen())return;const rows=[...$('qTypeMenu').querySelectorAll('.qtrow')],i=rows.indexOf(document.activeElement);

  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();qMenu(false);$('qTypeBtn').focus()}});

/* ---------- progress backup / restore ----------
   A backup is one line of text: "XUECI1:" + base64url(deflate-raw(JSON)), or "XUECI0:" + base64url(JSON)
   where compression isn't available. It can be copied, shared, and pasted into another install. */

const pipeBytes=async(u,stream)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(stream)).arrayBuffer());

async function makeCode(){
  const raw=new TextEncoder().encode(JSON.stringify({app:'xueci',v:2,at:Date.now(),stats,mem:LM.exportMem(),goal:LM.goal,w:LM.params,lvl:LM.level,rest:LM.rest,tests:LM.tests,ui:{level:state.level,unitBy:state.unitBy,qt:qType},lang:langPref,theme}));
  if(canZip){try{return 'XUECI1:'+B64(await pipeBytes(raw,new CompressionStream('deflate-raw')))}catch(e){}}

  try{let u=UNB64(m[2]);if(m[1]==='1'){if(!canZip)return null;u=await pipeBytes(u,new DecompressionStream('deflate-raw'))}
    const o=JSON.parse(new TextDecoder().decode(u));if(!o||o.app!=='xueci'||!o.stats||typeof o.stats!=='object')return null;
    const st={};
    for(const k in o.stats){const e=o.stats[k];
      if(!IDX.has(k)||!Array.isArray(e)||e.length<2||!e.every(x=>Number.isFinite(x)&&x>=0))continue;
      const r=Math.floor(e[0]),w=Math.floor(e[1]);st[k]=[r,w,Math.max(0,Math.min(MAXL,Math.floor(e.length>2?e[2]:r-w)))]}
    return {stats:st,at:+o.at||Date.now(),ui:o.ui,lang:o.lang,theme:o.theme,mem:o.mem?LM.importMem(o.mem):null,goal:'goal' in o?o.goal:undefined,w:o.w,lvl:o.lvl,rest:o.rest,tests:o.tests}}catch(e){return null}}

/* ---------- realm chip (beside the language button) and the realm sheet ----------

const lvlSheet=$('lvlSheet');let lvlOpener=null;
const realmPct=r=>{const st=LM.stage(r<1?LM.baseLevel():r);return st?Math.round(Math.min(1,st.share/.8)*100):0};
/* the chip: realm name, HSK, and a small ring that fills up to 圆满 (share of solid words ÷ 80 %) */
function renderCurLv(){const r=LM.realm(),b=$('curLvBtn'),st=LM.stage(r<1?LM.baseLevel():r),open=LM.btOpen()&&LM.canTest(),p=realmPct(r);

const perBars=per=>`<div class="lvper">${per.map((p,i)=>`<div class="skrow"><span>HSK ${i+1}</span><span class="mbar"><span class="stack"><i style="width:${p}%;background:var(--l${i+1})"></i></span></span><b>${p}%</b></div>`).join('')}</div>`;
const realmHead=(r,big)=>`<div class="rhead${big?' lg':''}" style="--lc:${rc(r)}"><span class="rname" lang="zh-CN">${RN[r]}</span><span class="rpy">${RPY[r]}</span><span class="rmean">${esc(L10.realmM[r])}${r?` · HSK ${realmLv(r)}`:''}</span></div>`;
const hd=(hz,py,t)=>`<h3 class="shd"><span lang="zh-CN">${hz}</span> <small class="hpy">${py}</small> <span class="hsep">·</span> ${esc(t)}</h3>`;
/* the path of the eight realms: passed ones filled, the current one ringed; tap any to read its name, pinyin and meaning */
function rpInfo(i,r){return `<b lang="zh-CN" style="color:${rc(i)}">${RN[i]}</b> <span class="rpy2">${RPY[i]}</span> · ${esc(L10.realmM[i])} · ${i?(i>6?'HSK 6 ✓':'HSK '+i):esc(L10.notTested)}${i===r?` · <em>${L10.youHere}</em>`:''}<br><small>${esc(L10.realmD[i])}</small>`}
function pathH(r){return `<div class="rpath">${RN.map((n,i)=>`${i?`<span class="rpl${i<=r?' done':''}" aria-hidden="true"></span>`:''}<button class="rp${i<r?' done':i===r?' cur':''}" data-rp="${i}" style="--lc:${rc(i)}" aria-pressed="${i===r}" aria-label="${n} ${RPY[i]}, ${esc(L10.realmM[i])}"><span lang="zh-CN">${RS[i]}</span></button>`).join('')}</div><p class="rpinfo" aria-live="polite">${rpInfo(r,r)}</p>`}
function rpPick(p){const box=p.closest('.rpath');box.querySelectorAll('.rp').forEach(x=>x.setAttribute('aria-pressed',String(x===p)));const info=box.nextElementSibling;if(info)info.innerHTML=rpInfo(+p.dataset.rp,LM.realm())}
/* progress inside the realm: four stage segments (初期 <25 %, 中期 25–50 %, 后期 50–80 %, 圆满 ≥80 % of the level's words
   solid), the next step, and the engine's forecast (pace of the last 14 days) or, at 圆满, the chance to pass a breakthrough */
const TH=[0,.25,.5,.8,1];
function stageH(r){const L=r<1?LM.baseLevel():r,st=LM.stage(L);if(!st)return '';
  const i=st.i,pct=Math.round(Math.min(1,st.share/.8)*100),fc=r>=1&&r<=6?LM.forecast():null;
  const segs=[0,1,2,3].map(k=>{const f=Math.max(0,Math.min(1,(st.share-TH[k])/(TH[k+1]-TH[k])));return `<span class="sg"><i style="width:${(f*100).toFixed(1)}%"></i></span>`}).join('');
  const labs=SN.map((n,k)=>`<span class="sgl${k===i?' cur':''}"><b lang="zh-CN">${n}</b><small>${SPY[k]}</small></span>`).join('');
  let note;
  if(r<1)note=L10.prepNote;
  else if(r>6)note=L10.stAll;
  else if(i===3){const p=LM.btChance();note=L10.stOpen+(p===null?'':' '+L10.btChance(p<5?'<5':p>95?'>95':p))}
  else note=L10.stNext(fmt(fc?fc.next:0),SN[i+1]);
  const eta=fc&&i<3?(fc.dNext?`<div class="steta"><b>${L10.etaL}:</b> ${L10.etaNext(dateS(LM.dayAfter(fc.dNext)))}${fc.dFull&&fc.dFull>fc.dNext?' · '+L10.etaFull(dateS(LM.dayAfter(fc.dFull))):''} · ${L10.perWeek(fmt(fc.week))}</div>`:`<div class="steta">${L10.etaNone}</div>`):'';
  return `<div class="stage" style="--lc:${rc(r<1?L:r)}"><div class="sthd"><span>${r<1?esc(L10.prepT(RN[L],L)):L10.progT}</span><b>${pct}%</b></div>
    <div class="sgtrack" role="img" aria-label="${pct}%, ${SN[i]} ${esc(L10.stageM[i])}">${segs}</div><div class="sglabels" aria-hidden="true">${labs}</div>
    <div class="stl2"><b lang="zh-CN">${SN[i]}</b> ${esc(L10.stageM[i])} · ${L10.stShare(fmt(st.solid),fmt(st.total))}</div>
    <div class="stn">${note}</div>${eta}</div>`}
function testH(){const r=LM.realm(),can=LM.canTest();let h='';
  if(LM.btOpen())h+=`<button class="planbtn wide btbtn" id="btGo"${can?'':' disabled'} style="--lc:${rc(r+1)}"><span lang="zh-CN">突破</span><span>${esc(L10.btGo(RN[r+1]))}</span></button>`;
  h+=r?`<button class="ghost wide" id="ptGo"${can?'':' disabled'}>${L10.ptAgain}</button>`:`<button class="planbtn wide" id="ptGo"${can?'':' disabled'}>${PLAY}<span>${L10.ptStart}</span></button>`;
  if(!can)h+=`<p class="gnote lockn">${LOCK}<span>${esc(L10.testNext(dateS(tDate(LM.nextTestAt()))))}</span></p>`;
  return h}
/* guidance (指点): what to work on, ranked by LM.advice(); each with a button that starts the right practice */
let advCur=null,advL=1;
function advText(x){const h='HSK '+x.L;switch(x.k){
  case 'test':return [L10.advTest,L10.advTestWhy,L10.advStart];
  case 'f':return [L10.advF(fmt(x.n),h),L10.advFWhy,L10.advGo];
  case 's':return [L10.advS(fmt(x.n),h),L10.advSWhy,L10.advGo];
  case 'due':return [L10.advDue(fmt(x.n),h),L10.advDueWhy,L10.advStart];
  case 'skill':return [L10.advSkill(TNAME()[x.q],x.p),L10.advSkillWhy,L10.advGo];
  case 'young':return [L10.advYoung(fmt(x.n),h),L10.advYoungWhy(x.days),''];
  case 'new':return [L10.advNew(fmt(x.n),h),L10.advNewWhy,L10.advStart];
  case 'conf':return [L10.advConf(esc(x.a.h),esc(x.b.h),x.n),L10.advConfWhy,L10.advGo];
  default:return [L10.advDao(x.p),L10.advDaoWhy,'']}}
function adviceH(max){const A=LM.advice();advCur=A.items;advL=A.L;
  if(!A.items.length)return `<p class="gnote">${L10.advNone}</p>`;
  return `<ol class="advs">${A.items.slice(0,max).map((x,i)=>{const [t,w,b]=advText(x);
    return `<li class="adv adv-${x.k}"><span class="advn" aria-hidden="true">${i+1}</span><div class="advt"><b>${t}</b><small>${w}</small></div>${b?`<button class="ghost advgo" data-adv="${i}">${b}</button>`:''}</li>`}).join('')}</ol>`}
function advGo(i){const x=advCur&&advCur[i];if(!x)return;
  if(x.k==='test'){go('placement');return}
  if(x.k==='f'||x.k==='s'){pendingRun={mode:'quiz',items:x.words.map(d=>({k:'q',d,q:x.k}))};go('quiz');return}
  if(x.k==='skill'){pendingRun={mode:'quiz',items:LM.quizRound(BY[advL],ROUND_Q,x.q)};go('quiz');return}
  if(x.k==='conf'){pendingRun={mode:'quiz',items:[{k:'q',d:x.a,q:'m'},{k:'q',d:x.b,q:'m'},{k:'q',d:x.a,q:'f'},{k:'q',d:x.b,q:'f'}]};go('quiz');return}
  sessionExtra=LM.plan().todayLeft===0;go('session')}
function renderLvl(){
  const info=LM.level,r=LM.realm(),cur=LM.curLevel();
  const src=!info?L10.lvSrcDefault:!r&&info.src==='manual'?L10.lvSrcOld(info.lv):info.src==='bt'?L10.lvSrcBt(dateS(tDate(info.at))):L10.lvSrcTest(dateS(tDate(info.at)));

function openLvl(){lvlOpener=document.activeElement;renderLvl();lvlSheet.hidden=false;document.body.style.overflow='hidden';lvlSheet.querySelector('.xbtn').focus()}

/* leaving a test after 10 answers still uses this week's test (so a test going badly can't simply be restarted) */
function leaveTest(){if(state.screen==='placement'&&pt&&pt.st&&!pt.res&&pt.st.items.length>=10)LM.noteTest();
  if(state.screen==='bt'&&bt&&bt.st&&!bt.res&&bt.st.i>=10)LM.noteTest()}
const lockedH=()=>`<div class="qcard ptintro"><div class="big t5" lang="zh-CN">静</div><h3>${L10.testLocked}</h3><p class="sumnote">${esc(L10.testNext(dateS(tDate(LM.nextTestAt()))))}</p><p class="sumnote">${L10.testWhy}</p><button class="next" id="tHome">${L10.sumHome}</button></div>`;

/* ---------- placement test: 50 quick questions that adapt to the answers (LM.ptStart/ptNext/ptAnswer/ptResult) ---------- */
let pt=null;
function renderPlacement(){
  if(!pt)pt={st:null,it:null,res:null};

    view.innerHTML=`<div class="qcard sum ptres"><div class="q">${L10.ptResT}</div>${realmHead(R,true)}
      <p class="sumnote">${r.m?L10.ptResM(r.m):L10.ptRes0}</p><div class="glbl">${L10.ptPer}</div>${perBars(r.per)}
      <p class="sumnote">${L10.ptResN(r.right,r.n,r.idk)}</p>

      <button class="next" id="ptBegin">${L10.ptBegin}</button></div>`;return}

function ptPick(i){

  const r=i<0?'idk':i===it.ans?'ok':'ng',ms=performance.now()-it.t0,x=r==='ng'&&it.q!=='s'?it.opts[i].id:0;
  LM.answer(it.d,{q:it.q,ok:r==='ok',ms,x,placement:true});LM.ptAnswer(pt.st,it,r);studied();
  if(i>=0)document.querySelector(`#ptOpts [data-p="${i}"]`)?.classList.add('pick');else $('ptIdk')?.classList.add('pick');
  setTimeout(()=>{if(!pt||pt.it!==it)return;pt.it=null;if(pt.st.items.length>=LM.PT.N)ptFinish();else renderPlacement()},160)}
function ptFinish(){const r=pt.res=LM.ptResult(pt.st);LM.placementDone(r);resetRun();renderCurLv();
  const l=LM.baseLevel();if(l!==state.level)setLevel(l);else refresh();toast(L10.ptDone(RN[LM.realm()]))}
view.addEventListener('click',e=>{
  if(state.screen!=='placement')return;

/* ---------- breakthrough (突破): 20 questions on the realm's words, no feedback until the end (LM.btStart/btFinish) ---------- */
let bt=null;
function renderBt(){
  if(!bt)bt={st:null,res:null};

  if(bt.res){const x=bt.res;
    view.innerHTML=x.pass?`<div class="qcard sum btres pass"><div class="q">突破 · ${L10.btPassT}</div>${realmHead(x.r,true)}<p class="sumnote">${L10.btPass(RN[x.r],esc(L10.realmM[x.r]))}</p><p class="sumnote">${L10.btScore(x.right,x.n)}</p>

        <div class="sumbtns"><button class="ghost" id="btHome">${L10.sumHome}</button>${x.weak.length?`<button class="next" id="btPractice">${L10.btPractice}</button>`:`<button class="next" id="btSoul">${L10.soulGo}</button>`}</div></div>`;
    return}

    if(!LM.btOpen()){view.innerHTML=`<div class="qcard ptintro">${realmHead(r)}${stageH(r)}<p class="sumnote">${L10.btNotOpen}</p><button class="next" id="btHome">${L10.sumHome}</button></div>`;return}
    if(!LM.canTest()){view.innerHTML=lockedH();return}
    view.innerHTML=`<div class="qcard ptintro btintro"><div class="btpath"><span lang="zh-CN" style="color:${rc(r)}">${RN[r]}</span><i aria-hidden="true">→</i><span lang="zh-CN" style="color:${rc(r+1)}">${RN[r+1]}</span></div>
      <h3>${esc(L10.btIntroT(L10.realmM[r+1]))}</h3><p class="sumnote">${L10.btIntro(realmLv(r)>=5?80:75)}</p><p class="sumnote">${L10.btIntro2}</p>
      <button class="next" id="btBegin">${L10.btBegin}</button></div>`;return}
  const st=bt.st,it=st.items[st.i];if(!it){btDone();return}
  if(!it.t0)it.t0=performance.now();
  view.innerHTML=`<div class="fcmeta"><span>${L10.qN(st.i+1,st.items.length)}</span>${progH(st.i,st.items.length)}</div>
    <div class="qcard qt-${it.q}">${qPrompt(it.d,it.q)}<div class="opts" id="btOpts">${it.opts.map((o,i)=>`<button data-b="${i}">${i+1}. ${qLab(o,it.q)}</button>`).join('')}</div>
    <button class="idkbtn" id="btIdk">${L10.idk}</button></div>`}
function btPick(i){const st=bt&&bt.st,it=st&&st.items[st.i];if(!it||it.busy)return;it.busy=true;
  const r=i<0?'idk':i===it.ans?'ok':'ng',x=r==='ng'&&it.q!=='s'?it.opts[i].id:0;it.r=r;if(r==='ok')st.right++;
  LM.answer(it.d,{q:it.q,ok:r==='ok',ms:performance.now()-it.t0,x,exam:true});studied();
  (i>=0?document.querySelector(`#btOpts [data-b="${i}"]`):$('btIdk'))?.classList.add('pick');

view.addEventListener('click',e=>{

/* ---------- Soul Sea (识海): the realm, the soul orb, the five elements (五行), today's trial, cultivation days, rest ----------
   Every number comes from the memory model and the answer log on this phone (LM.soul, LM.challenge, LM.streak, LM.restGain). */
const EL5=[['earth','土','root'],['wood','木','cult'],['water','水','sense'],['metal','金','dao'],['fire','火','insight']];
const ATZ={root:['根基','gēnjī'],cult:['修为','xiūwéi'],sense:['神识','shénshí'],dao:['道心','dàoxīn'],insight:['悟性','wùxìng']};
const TTL={root:['磐石','pánshí'],cult:['苦修','kǔxiū'],sense:['明镜','míngjìng'],dao:['剑心','jiànxīn'],insight:['慧根','huìgēn']};
const ELP={earth:'tǔ',wood:'mù',water:'shuǐ',metal:'jīn',fire:'huǒ'};
function soulRows(S){const known=EL5.filter(e=>S[e[2]]!==null),mn=known.length>1?known.reduce((a,b)=>S[b[2]]<S[a[2]]?b:a):null,
    mx=known.length>1?known.reduce((a,b)=>S[b[2]]>S[a[2]]?b:a):null,flat=mn&&mx&&S[mn[2]]===S[mx[2]];
  return EL5.map(e=>{const [k,g,a]=e,v=S[a],weak=!flat&&e===mn,strong=!flat&&e===mx&&v>=60;
    const val=v===null?L10.unknownV:a==='cult'?L10.cultV(fmt(S.cultDays)):a==='insight'?L10.insightV(S.insightDays):v+'%';
    return `<div class="elrow el-${k}${weak?' weak':''}"><span class="elg" aria-hidden="true"><b lang="zh-CN">${g}</b><small>${ELP[k]}</small></span><div class="elt">
      <div class="eln"><b lang="zh-CN">${ATZ[a][0]}</b><small class="hpy">${ATZ[a][1]}</small><span>${esc(L10.attrN[a])}</span><em>${esc(val)}</em></div>
      <span class="elbar"><i style="width:${v===null?0:Math.max(2,v)}%"></i></span><small>${esc(L10.attrD[a])}</small>
      ${weak?`<p class="eltip">${esc(L10.attrTip[a])}</p>`:''}${strong?`<p class="eltitle">${L10.titleL(`<span lang="zh-CN">${TTL[a][0]}</span> ${TTL[a][1]} · ${esc(L10.attrTitle[a])}`)}</p>`:''}</div></div>`}).join('')}
function weekH(){const S=LM.studyDays(),today=LM.dayOf(LM.now());let h='';
  for(let d=today-6;d<=today;d++){const w=new Date(Date.now()-(today-d)*864e5).getDay(),c=S.has(d)?'on':LM.isRest(d)?'rest':d===today?'today':'off';
    h+=`<span class="wd ${c}"><i aria-hidden="true">${c==='rest'?'闭':''}</i><small>${esc(wkName(w,'short'))}</small></span>`}return h}
function restH(g){if(!g)return `<p class="gnote">${L10.restEmpty}</p>`;
  const mx=Math.max(g.now,g.day,g.two)||1,f=x=>x<10?x.toLocaleString(L10.loc,{maximumFractionDigits:1}):fmt(Math.round(x));
  return `<p class="sumnote">${L10.restWhy(f(g.S))}</p><div class="rgain">${[[L10.restNow,g.now],[L10.restDay,g.day],[L10.restTwo,g.two]].map(([n,v])=>
    `<div class="skrow"><span>${n}</span><span class="mbar"><span class="stack"><i style="width:${Math.max(2,v/mx*100)}%;background:var(--el-water)"></i></span></span><b>+${f(v)}</b></div>`).join('')}</div>
    <p class="gnote">${L10.restNote}</p>`}
function renderSoul(){
  const r=LM.realm(),st=LM.stage(),S=LM.soul(),c=LM.challenge(),k=LM.streak(),info=LM.level,rest=LM.rest;
  $('soulTitle').textContent=L10.soulT;
  let hist=(info&&info.hist||[]).slice();if(!hist.length&&info&&info.src==='test')hist=[[r,info.at]];hist.reverse();
  const cc=Math.min(c.cnt,c.n);
  $('soulBody').innerHTML=`<div class="soulhero" style="--lc:${rc(r)}">
      <div class="orbwrap">${SOUL.wheel(S,300)}<canvas class="orb" id="orb" role="img" aria-label="${esc(L10.orbL(fmt(S.words)))}"></canvas></div>
      ${realmHead(r,true)}<p class="orbpick" id="orbPick" aria-live="polite">${S.words?L10.orbHint:L10.orbEmpty}</p></div>
    <section class="scard prog">${hd('修炼之路','xiūliàn zhī lù',L10.pathM)}${pathH(r)}${stageH(r)}${testH()}</section>
    <section class="scard advc">${hd('指点','zhǐdiǎn',L10.advM)}<p class="gnote advintro">${L10.advIntro}</p>${adviceH(6)}</section>
    <section class="scard">${hd('五行','wǔxíng',L10.elM)}${soulRows(S)}</section>
    <section class="scard chal${c.done?' done':''}">${hd('今日试炼','jīnrì shìliàn',L10.chalM)}<p class="chtxt">${L10.chalTxt(skName(c.k),c.n,c.a)}</p>
      <div class="skrow"><span>${cc}/${c.n}</span><span class="mbar"><span class="stack"><i style="width:${Math.min(100,c.cnt/c.n*100)}%;background:var(--acc)"></i></span></span><b>${c.cnt?c.acc+'%':'–'}</b></div>
      <p class="gnote">${c.done?L10.chalDone:L10.chalWhy}${c.total?' · '+L10.chalTot(c.total):''}</p>${c.done?'':`<button class="ghost wide" id="chalGo">${L10.chalGo}</button>`}</section>
    <section class="scard">${hd('修炼天数','xiūliàn tiānshù',L10.strM)}<div class="strk"><b>${L10.strDays(k.days)}</b><div class="week">${weekH()}</div></div>
      <p class="gnote">${L10.strNote}</p><p class="gnote">${rest.length?esc(L10.medDays(WK.filter(w=>rest.includes(w)).map(w=>wkName(w,'long')).join(', '))):L10.medNone} <button class="linkbtn" id="medSet">${L10.medSet}</button></p></section>
    <section class="scard">${hd('休息之道','xiūxi zhī dào',L10.restM)}${restH(LM.restGain())}</section>
    <section class="scard">${hd('境界历程','jìngjiè lìchéng',L10.histM)}${hist.length?`<div class="hist">${hist.map(([hr,t])=>`<div class="hrow" style="--lc:${rc(hr)}"><b lang="zh-CN">${RN[hr]}</b><small class="hpy">${RPY[hr]}</small><span>${esc(L10.realmM[hr])}</span><small>${dateS(tDate(t))}</small></div>`).join('')}</div>`:`<p class="gnote">${L10.histEmpty}</p>`}
      ${info&&info.per?`<div class="glbl">${L10.ptPer}</div>${perBars(info.per)}`:''}</section>`;
  SOUL.mount($('orb'),{realm:r,stage:st?st.i:0,onPick:d=>{const el=$('orbPick');if(!el)return;
    el.innerHTML=d?`<b class="hzs">${hzH(d)}</b> ${pyH(d)} · ${esc(M1(d))} · <span class="st">${stTxt(d)}</span>`:L10.orbHint}})}
scrSoul.addEventListener('click',e=>{
  const rp=e.target.closest('[data-rp]');if(rp){rpPick(rp);return}
  const ad=e.target.closest('[data-adv]');if(ad){advGo(+ad.dataset.adv);return}
  const id=e.target.closest('[id]')?.id;
  if(id==='soulBack'){back();return}
  if(id==='soulHelp'){openInfo('soul');return}
  if(id==='btGo'){go('bt');return}
  if(id==='ptGo'){go('placement');return}
  if(id==='medSet'){openGoal(false,null,'rest');return}
  if(id==='chalGo'){const c=LM.challenge();pendingRun={mode:'quiz',items:LM.quizRound(pool(),ROUND_Q,c.k)};go('quiz')}});

/* ---------- daily study reminder (Android): one notification a day at the chosen time, skipped on days with practice ---------- */
const canRemind=()=>NATIVE('setReminder');
let rem=Object.assign({on:false,h:19,m:0},ls.get('xc_rem',{})),remKey='',studiedMark='';
function remBody(){const P=LM.plan(),g=LM.goal,min=Math.max(5,P.minutes);
  return g&&g.t!=='none'?L10.remGoal(min,g.t==='exam'?L10.gExamChip(g.lv,dateS(g.date)):'HSK '+g.lv):L10.remFree(min)}
function syncReminder(){if(!canRemind())return;const body=remBody(),k=JSON.stringify([rem,body,L10.remTitle,L10.remChannel]);if(k===remKey)return;remKey=k;
  try{MMAndroid.setReminder(!!rem.on,rem.h|0,rem.m|0,L10.remTitle,body,L10.remChannel)}catch(e){}}
function syncRest(){if(NATIVE('setRestDays'))try{MMAndroid.setRestDays(LM.rest.join(','))}catch(e){}}
function studied(){if(!NATIVE('markStudied'))return;const d=new Date().toDateString();if(d===studiedMark)return;studiedMark=d;try{MMAndroid.markStudied()}catch(e){}}
const notifOK=()=>!NATIVE('notifStatus')||MMAndroid.notifStatus()==='granted';
function askNotif(cb){if(notifOK()){cb(true);return}
  window.mmNotifResult=g=>{window.mmNotifResult=null;cb(!!g)};try{MMAndroid.requestNotifications()}catch(e){window.mmNotifResult=null;cb(false)}}
const hhmm=r=>`${String(r.h).padStart(2,'0')}:${String(r.m).padStart(2,'0')}`;

let toastT;function toast(msg,ms){const t=$('toast');t.textContent=msg;t.hidden=false;t.classList.toggle('long',!!ms);clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||2000)}
$('toast').onclick=()=>{$('toast').hidden=true};
/* xc_note: which once-only notes were shown {night, back, amb:{d, n}} */
const note=(()=>{const o=ls.get('xc_note',{});return o&&typeof o==='object'&&!Array.isArray(o)?o:{}})(),saveNote=()=>ls.set('xc_note',note);
const lateNow=()=>{const h=new Date().getHours();return h>=23||h<4};
const nightKey=()=>new Date(Date.now()-4*36e5).toDateString();   /* 23:00–04:00 is one night */

/* ---------- keyboard + Android back ---------- */
/* Back closes the topmost layer: a menu, then the focused screen (back to Home). false lets the app exit. */
window.mmBack=function(){
  if(window.mmBusy&&mmBusy())return true;   /* a screen animation is still running */
  if(!lvlSheet.hidden){closeLvl();return true}
  if(!goalSheet.hidden){closeGoal();return true}
  if(!infoSheet.hidden){closeInfo();return true}
  if(!bkSheet.hidden){bkBack();return true}
  if(qMenuOpen()){qMenu(false);return true}
  if(!langMenu.hidden){closeLang(false);return true}
  if(!lvMenu.hidden){closeMenu(false);return true}
  if(!uMenu.hidden){closeUMenu(false);return true}
  if(state.screen!=='home'){back();return true}
  return false};
document.addEventListener('keydown',e=>{
  if(!lvMenu.hidden||!uMenu.hidden||!langMenu.hidden||!infoSheet.hidden||!bkSheet.hidden||!goalSheet.hidden||!lvlSheet.hidden||qMenuOpen())return;
  if(e.key==='Escape'&&state.screen!=='home'&&!/^(INPUT|SELECT)$/.test(e.target.tagName)){back();return}
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(state.screen==='placement'){if(/^[1-4]$/.test(e.key))document.querySelectorAll('#ptOpts button')[+e.key-1]?.click();
    else if(e.key==='0'||e.key==='5')$('ptIdk')?.click();else if(e.key==='Enter'&&e.target.tagName!=='BUTTON')$('ptBegin')?.click();return}
  if(state.screen==='bt'){if(/^[1-4]$/.test(e.key))document.querySelectorAll('#btOpts button')[+e.key-1]?.click();
    else if(e.key==='0'||e.key==='5')$('btIdk')?.click();else if(e.key==='Enter'&&e.target.tagName!=='BUTTON')$('btBegin')?.click();return}
  if(!run||!['card','quiz','session'].includes(state.screen))return;
  if(run.brk){if(e.key==='Enter'&&e.target.tagName!=='BUTTON')$('brSkip')?.click();return}
  const it=run.items[run.i],pick=(sel,k)=>document.querySelectorAll(sel)[+k-1]?.click();
  if(!it){if(e.key==='Enter'&&e.target.tagName!=='BUTTON')$('sumMore')?.click();return}
  if(it.k==='card'){
    if(it.st==='front'){if(e.key==='ArrowLeft')$('fcNo')?.click();if(e.key==='ArrowRight')$('fcYes')?.click()}
    else if(it.st==='check'){if(/^[1-4]$/.test(e.key))pick('#fcAct [data-c]',e.key)}
    else if(e.key==='Enter'&&e.target.tagName!=='BUTTON')$('fcNext')?.click();
    return}
  if(/^[1-4]$/.test(e.key))pick('.opts button',e.key);
  if(e.key==='Enter'&&e.target.tagName!=='BUTTON')$('qNext')?.click();
});

/* ---------- start on Home ---------- */
document.body.dataset.level=state.level;$('seal').textContent=NUM[state.level-1];
applyStatic();saveStats();document.body.dataset.screen='home';go('home');syncRest();
/* back after two or more days off: how much is still remembered (once a day) */
{const s=LM.sinceLast(),day=new Date().toDateString();if(s&&s.gap>=2&&s.recall!==null&&note.back!==day){note.back=day;saveNote();setTimeout(()=>toast(L10.backMsg(s.gap,s.recall),6500),900)}}
/* first start: ask for a goal once (can be skipped); later, fit the memory model to this learner when enough answers exist */
if(!LM.goal&&!ls.get('xc_onb',0))setTimeout(()=>{if(state.screen==='home'&&goalSheet.hidden&&bkSheet.hidden&&infoSheet.hidden)openGoal(true)},500);
setTimeout(()=>LM.maybeOptimize(),6000);
</script>
