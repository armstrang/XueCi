/* 'auto' follows the phone/browser language; unsupported languages fall back to English */
function sysLang(){const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||''];
  for(const n of list){const c=String(n).toLowerCase().slice(0,2);if(c==='id'||c==='in'||c==='ms')return 'id';if(c==='en'||c==='th'||c==='vi')return c}return 'en'}
let langPref=ls.get('mm_lang','auto');if(langPref!=='auto'&&!LANGS.includes(langPref))langPref='auto';
let lang=langPref==='auto'?sysLang():langPref;
let L10=I18N[lang];
const M=d=>lang==='en'?d.em:lang==='th'?d.hm:lang==='vi'?d.vm:d.m;
const TR=d=>lang==='en'?d.et:lang==='th'?d.ht:lang==='vi'?d.vt:d.t;
const M1=d=>M(d).split(';')[0].trim();
const fmt=n=>n.toLocaleString(L10.loc);

const TONE={1:'āēīōūǖĀĒĪŌŪ',2:'áéíóúǘÁÉÍÓÚ',3:'ǎěǐǒǔǚǍĚǏǑǓ',4:'àèìòùǜÀÈÌÒÙ'};
const tone=s=>{for(const t in TONE){for(const c of TONE[t]) if(s.includes(c)) return +t}return 5};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>s.normalize('NFD').replace(/\p{M}/gu,'').replace(/ü/g,'v').replace(/['\s]/g,'').toLowerCase();
const unmark=s=>s.normalize('NFD').replace(/\p{M}/gu,'').replace(/đ/g,'d').replace(/Đ/g,'D');
DATA.forEach(d=>{d.id=d.l+':'+d.h;d.pk=plain(d.p)});
function buildKeys(){DATA.forEach(d=>{const m=M(d).toLowerCase();d.key=d.h+' '+d.pk+' '+m+(lang==='vi'?' '+unmark(m):'')})}
buildKeys();
const IDX=new Map(DATA.map(d=>[d.id,d]));
function hzH(d){const c=[...d.h];return c.length===d.s.length?c.map((ch,i)=>`<span class="t${tone(d.s[i])}">${esc(ch)}</span>`).join(''):esc(d.h)}
function pyH(d){return d.s.map((s,i)=>(i&&/^[aeoāáǎàēéěèōóǒò]/.test(s)?"'":'')+`<span class="t${tone(s)}">${esc(s)}</span>`).join('')}
/* pinyin of the example sentence (vocab field zp; the learned word is in {braces}) */
function zpH(d){return d.zp?`<div class="zp">${esc(d.zp).replace(/\{([^}]*)\}/,'<mark>$1</mark>')}</div>`:''}
function exH(d){const z=esc(d.z),w=esc(d.h);return z.includes(w)?z.replace(w,`<mark>${w}</mark>`):z}
function mH(m){const p=m.split(';').map(x=>x.trim()).filter(Boolean);return `<b>${esc(p[0])}</b>`+p.slice(1).map(x=>`<span> · ${esc(x)}</span>`).join('')}
const chip=l=>`<span class="lvchip" style="background:var(--l${l})">HSK ${l}</span>`;
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

/* Mastery: every word has a level 0–20. A right answer raises it by 1, a wrong answer lowers it by 3,
   so a word needs about 20 good repetitions to mature. Levels 0–6 are red, 7–13 yellow, 14–20 green;
   inside each colour a light shade means young and a deep shade means mature. Level 20 = mastered. */
const MAXL=20,UP=1,DOWN=3;
const lvBand=s=>s>=14?'green':s>=7?'yellow':'red';
const lvAlpha=s=>{const [lo,hi]=s>=14?[14,20]:s>=7?[7,13]:[0,6];return Math.round(26+74*(s-lo)/(hi-lo))};
{let a='',b='';for(let s=0;s<=MAXL;s++){a+=`.m${s}{--mc:var(--s-${lvBand(s)})}`;b+=`.m${s}{--mc:color-mix(in srgb,var(--s-${lvBand(s)}) ${lvAlpha(s)}%,var(--surface))}`}
 const st=document.createElement('style');st.textContent=a+`@supports (color:color-mix(in srgb,red 50%,blue)){${b}}.mbg{background:var(--mc)}`;document.head.appendChild(st)}

let stats=ls.get('mm_stats',null);
if(!stats||typeof stats!=='object'){stats={};ls.get('hsk16_known',[]).forEach(id=>{if(IDX.has(id))stats[id]=[1,0]})}
/* entries are [right, wrong, level]; older [right, wrong] entries get a level from their history */
for(const k in stats){const e=stats[k];if(!Array.isArray(e)){delete stats[k];continue}if(e.length<3)e[2]=Math.max(0,Math.min(MAXL,(e[0]|0)-(e[1]|0)))}
const saveStats=()=>ls.set('mm_stats',stats);
const lvl=d=>{const e=stats[d.id];return e&&e[0]+e[1]>0?e[2]:-1};   // -1 = never practised
const bandOf=d=>{const s=lvl(d);return s<0?'none':lvBand(s)};
const isKnown=d=>lvl(d)>=MAXL;                                       // mastered
const mcls=d=>{const s=lvl(d);return s<0?'s-none':`m${s} mbg`};
function summary(arr){const lv=new Array(MAXL+1).fill(0);let none=0,pts=0;
  for(const d of arr){const s=lvl(d);if(s<0)none++;else{lv[s]++;pts+=s}}
  const sum=(a,b)=>lv.slice(a,b).reduce((x,y)=>x+y,0);
  return {lv,none,red:sum(0,7),yellow:sum(7,14),green:sum(14,MAXL+1),mature:lv[MAXL],n:arr.length,p:pts/(MAXL*arr.length)*100}}
const pctTxt=p=>(p>0&&p<10?p.toLocaleString(L10.loc,{maximumFractionDigits:1}):Math.floor(p).toLocaleString(L10.loc))+'%';
function stackH(S){let h='';for(let s=MAXL;s>=0;s--)if(S.lv[s])h+=`<i class="m${s} mbg" style="width:${S.lv[s]/S.n*100}%"></i>`;return h}
function stTxt(d){const s=lvl(d);if(s<0)return L10.band.none;const e=stats[d.id];return L10.stTxt(s,e[0],e[1])}
function stH(d){return `<span class="st"><i class="sd ${mcls(d)}"></i>${stTxt(d)}</span>`}
function record(d,ok){const e=stats[d.id]||[0,0,0];if(ok){e[0]++;e[2]=Math.min(MAXL,e[2]+UP)}else{e[1]++;e[2]=Math.max(0,e[2]-DOWN)}stats[d.id]=e;saveStats();afterChange()}

/* ---------- home ---------- */
const RING_C=2*Math.PI*52;
function renderHome(){
  const L=state.level,S=summary(BY[L]),pc=pctTxt(S.p);
  $('lvPills').innerHTML=LEVELS.map(l=>`<button class="lvpill" data-l="${l}" aria-pressed="${l===L}" style="--lc:var(--l${l})"><b>HSK ${l}</b><small>${pctTxt(summary(BY[l]).p)}</small></button>`).join('');
  /* one arc per level, deepest green first, so the ring fades from mature green to young red */
  let off=0,arcs='';
  for(let s=MAXL;s>=0;s--){if(!S.lv[s])continue;const len=S.lv[s]/S.n*RING_C;
    arcs+=`<circle class="sg m${s}" cx="60" cy="60" r="52" style="stroke:var(--mc)" stroke-dasharray="${len.toFixed(2)} ${RING_C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;off+=len}
  $('ringArcs').innerHTML=arcs;
  $('heroPct').textContent=pc;$('heroLbl').textContent=L10.memoWord;
  $('heroLv').textContent=`HSK ${L} · ${L10.words(fmt(S.n))}`;
  $('heroKeys').innerHTML=['green','yellow','red','none'].map(b=>`<div class="hkey"><i class="sd s-${b}"></i>${L10.band[b]}<b>${fmt(S[b])}</b></div>`).join('');
  $('heroCnt').innerHTML=L10.lvCount(fmt(S.mature),fmt(S.n));
  $('heroGo').textContent=L10.statsShort+' ›';
  hero.setAttribute('aria-label',`${L10.stTitle} · HSK ${L} · ${pc}`);
  $('allNote').innerHTML=L10.allLv(fmt(masteredAll()),fmt(DATA.length));
  if(window.mmHomeRendered)window.mmHomeRendered(S);
}

let deck=[],di=0,flipped=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

let qz={type:'meaning',cur:null,opts:[],answered:false,pick:-1,right:0,total:0,streak:0};
function startQuiz(){qz.right=0;qz.total=0;qz.streak=0;newQ()}
function newQ(){const p=pool();const weak=p.filter(d=>!isKnown(d));const src=weak.length&&Math.random()<.7?weak:p;const d=src[Math.random()*src.length|0];
  const lvl=BY[d.l],seen=new Set([M1(d)]),picks=[];
  for(const x of shuffle(lvl.filter(x=>x.id!==d.id&&(unit()?Math.abs(x.u-d.u)<=2:true)))){const k=M1(x);if(seen.has(k))continue;seen.add(k);picks.push(x);if(picks.length===3)break}
  qz.cur=d;qz.opts=shuffle([d,...picks]);qz.answered=false;qz.pick=-1}
function scoreH(){return `<span>${L10.right} <b>${qz.right}</b>/${qz.total}</span><span>${L10.streak} <b>${qz.streak}</b></span>`}
/* The whole question, including the answered state, is drawn from qz, so any re-render
   (language switch, level refresh) keeps the feedback and the "next" button. */
function renderQuiz(){
  if(!qz.cur||qz.cur.l!==state.level)newQ();const d=qz.cur,T=qz.type,mp=M(d).split(';'),ans=qz.answered,ok=ans&&qz.opts[qz.pick]?.id===d.id;
  const prompt=T==='meaning'?`<div class="q">${L10.qMean}</div><div class="big">${hzH(d)}</div>`
    :T==='hanzi'?`<div class="q">${L10.qHz}</div><div style="font-size:22px;font-weight:800">${esc(mp[0])}</div><div class="id">${esc(mp.slice(1).join(';'))}</div>`
    :`<div class="q">${L10.qCloze}</div><div class="zh" style="font-size:20px">${esc(d.z).replace(esc(d.h),'<mark>＿＿</mark>')}</div><div class="id">${esc(TR(d))}</div>`;
  const lab=o=>T==='meaning'?esc(M1(o)):`<span style="font-family:var(--f-hz);font-weight:900;font-size:20px">${esc(o.h)}</span>`;
  const cls=(o,i)=>!ans?'':o.id===d.id?' class="ok"':i===qz.pick?' class="ng"':'';
  const fb=!ans?'':`<div style="font-weight:800;color:var(${ok?'--good':'--bad'})">${ok?L10.ok:L10.ng}</div>
    <div class="head"><span class="hz" style="font-size:26px">${hzH(d)}</span><span class="py">${pyH(d)}</span>${spk(d.h)}</div><div class="mean">${mH(M(d))}</div>
    <div class="zh">${exH(d)}${spk(d.z,' sm')}</div>${zpH(d)}<div class="id">${esc(TR(d))}</div><div style="margin-top:6px">${stH(d)}</div><button class="next" id="qNext">${L10.nextQ}</button>`;
  const QT=[['meaning',L10.tMean,L10.dMean,'汉→a'],['hanzi',L10.tHz,L10.dHz,'a→汉'],['cloze',L10.tCloze,L10.dCloze,'汉＿']],cur=QT.find(q=>q[0]===T);
  view.innerHTML=`<div class="qhead"><div class="qsel" id="qsel">
      <button class="qtbtn" id="qTypeBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="${L10.qTypeL}: ${cur[1]}"><span class="qti">${cur[3]}</span><span class="qtl">${cur[1]}</span>${CHEV}</button>
      <div class="menu qmenu" id="qTypeMenu" role="listbox" aria-label="${L10.qTypeL}" hidden>${QT.map(q=>`<button class="qtrow" role="option" data-qt="${q[0]}" aria-selected="${q[0]===T}"><span class="qti">${q[3]}</span><span class="nm"><b>${q[1]}</b><small>${q[2]}</small></span>${CHECK}</button>`).join('')}</div>
     </div><div class="score">${scoreH()}</div></div>
   <div class="qcard">${prompt}
     <div class="opts">${qz.opts.map((o,i)=>`<button data-i="${i}"${cls(o,i)} ${ans?'disabled':''}>${i+1}. ${lab(o)}</button>`).join('')}</div>
     <div class="feedback" id="fb">${fb}</div></div>`;
}
const qMenuOpen=()=>{const m=$('qTypeMenu');return !!m&&!m.hidden};
function qMenu(open){const m=$('qTypeMenu'),b=$('qTypeBtn');if(!m)return;m.hidden=!open;b.setAttribute('aria-expanded',open);if(open)(m.querySelector('[aria-selected="true"]')||m.firstElementChild).focus()}

  if(e.key==='ArrowDown'){e.preventDefault();rows[(i+1)%rows.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();rows[(i-1+rows.length)%rows.length].focus()}
  else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();qMenu(false);$('qTypeBtn').focus()}});

const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z" fill="currentColor" stroke-width="1.6"/><path class="w1" d="M15.5 9a4 4 0 0 1 0 6"/><path class="w2" d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const canSpeak=()=>(window.MMAndroid&&typeof MMAndroid.speak==='function')||('speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function');
function spk(text,cls){return canSpeak()?`<button class="spk${cls||''}" data-say="${esc(text)}" aria-label="${esc(L10.listen)}" title="${esc(L10.listen)}">${SPK}</button>`:''}
let spkOn=null;
function spkMark(b){spkUnmark();if(b&&b.isConnected){b.classList.add('on');spkOn=b}}
function spkUnmark(){if(spkOn){spkOn.classList.remove('on');spkOn=null}}
window.mmSpeakEnd=spkUnmark;
function speak(text,btn){
  if(window.MMAndroid&&typeof MMAndroid.speak==='function'){
    const st=MMAndroid.ttsStatus?MMAndroid.ttsStatus():'ready';
    if(st==='missing'||st==='unsupported'){toast(L10.ttsMissing);if(MMAndroid.openTtsSettings)setTimeout(()=>MMAndroid.openTtsSettings(),1200);return}
    if(st==='none'){toast(L10.ttsNone);return}
    MMAndroid.speak(text,.9);spkMark(btn);return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.9;
    const v=speechSynthesis.getVoices().find(v=>/^zh[-_]?(CN|Hans)?/i.test(v.lang)&&!/TW|HK/i.test(v.lang));if(v)u.voice=v;
    u.onend=u.onerror=spkUnmark;speechSynthesis.speak(u);spkMark(btn)}catch(e){}}
/* capture phase, so tapping the speaker never flips a card or opens anything else */
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.spk');if(!b)return;e.preventDefault();e.stopPropagation();speak(b.dataset.say,b)},true);

/* ---------- progress backup / restore ----------
   A backup is one line of text: "XUECI1:" + base64url(deflate-raw(JSON)), or "XUECI0:" + base64url(JSON)
   where compression isn't available. It can be copied, shared, and pasted into another install. */
const bkSheet=$('bkSheet'),bkCode=$('bkCode'),bkMsg=$('bkMsg');
let bkMode=null,bkPending=null,bkOpener=null;
const NATIVE=n=>!!(window.MMAndroid&&typeof MMAndroid[n]==='function');
const canZip=typeof CompressionStream==='function'&&typeof DecompressionStream==='function';
const B64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const UNB64=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
const pipeBytes=async(u,stream)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(stream)).arrayBuffer());
const practisedN=st=>Object.values(st).filter(e=>e[0]+e[1]>0).length;
const bkDate=t=>new Date(t).toLocaleDateString(L10.loc,{day:'numeric',month:'long',year:'numeric'});
async function makeCode(){
  const raw=new TextEncoder().encode(JSON.stringify({app:'xueci',v:1,at:Date.now(),stats,ui:{level:state.level,unitBy:state.unitBy},lang:langPref,theme}));
  if(canZip){try{return 'XUECI1:'+B64(await pipeBytes(raw,new CompressionStream('deflate-raw')))}catch(e){}}
  return 'XUECI0:'+B64(raw)}
async function readCode(text){
  const m=String(text||'').replace(/\s+/g,'').match(/XUECI([01]):([A-Za-z0-9_-]+)/);if(!m)return null;
  try{let u=UNB64(m[2]);if(m[1]==='1'){if(!canZip)return null;u=await pipeBytes(u,new DecompressionStream('deflate-raw'))}
    const o=JSON.parse(new TextDecoder().decode(u));if(!o||o.app!=='xueci'||!o.stats||typeof o.stats!=='object')return null;
    const st={};
    for(const k in o.stats){const e=o.stats[k];
      if(!IDX.has(k)||!Array.isArray(e)||e.length<2||!e.every(x=>Number.isFinite(x)&&x>=0))continue;
      const r=Math.floor(e[0]),w=Math.floor(e[1]);st[k]=[r,w,Math.max(0,Math.min(MAXL,Math.floor(e.length>2?e[2]:r-w)))]}
    return {stats:st,at:+o.at||Date.now(),ui:o.ui,lang:o.lang,theme:o.theme}}catch(e){return null}}
function bkRow(){
  const r=$('bkRow');
  if(bkMode==='make')r.innerHTML=`<button class="ghost" id="bkCopy">${L10.bkCopy}</button>${NATIVE('shareText')||navigator.share?`<button class="ghost pri" id="bkShare">${L10.bkShare}</button>`:''}`;
  else if(bkPending)r.innerHTML=`<button class="ghost" id="bkCancel">${L10.cancel}</button><button class="danger solid" id="bkApply">${L10.bkApply}</button>`;
  else r.innerHTML=`<button class="ghost" id="bkPaste">${L10.bkPaste}</button><button class="ghost pri" id="bkCheck">${L10.bkCheck}</button>`}
function say(msg,bad){bkMsg.textContent=msg||'';bkMsg.classList.toggle('bad',!!bad)}
function bkShow(mode){
  bkMode=mode;bkPending=null;say('');
  const menu=mode==='menu',make=mode==='make';
  $('bkOpts').hidden=!menu;$('bkWork').hidden=menu;
  $('bkTitle').textContent=menu?L10.bkT:make?L10.bkTitleMake:L10.bkTitleRestore;
  $('bkLead').textContent=menu?L10.bkNote:make?L10.bkLeadMake(fmt(practisedN(stats))):L10.bkLeadRestore;
  bkCode.readOnly=make;bkCode.value='';bkRow();
  if(make)makeCode().then(c=>{if(bkMode==='make')bkCode.value=c});
  (menu?bkSheet.querySelector('.bkopt'):make?$('bkCopy'):$('bkPaste'))?.focus()}
function openBackup(){bkOpener=document.activeElement;bkSheet.hidden=false;document.body.style.overflow='hidden';bkShow('menu')}
/* Back / Escape: from a code view go back to the two choices, then close */
function bkBack(){if(bkMode&&bkMode!=='menu')bkShow('menu');else closeBk()}
function closeBk(){bkSheet.hidden=true;bkMode=null;bkPending=null;document.body.style.overflow='';bkOpener?.focus?.()}
async function bkCopyCode(){
  const t=bkCode.value;if(!t)return;
  if(NATIVE('copyText')){MMAndroid.copyText(t);toast(L10.bkCopied);return}
  try{await navigator.clipboard.writeText(t);toast(L10.bkCopied)}catch(e){bkCode.focus();bkCode.select();try{document.execCommand('copy')&&toast(L10.bkCopied)}catch(_){}}}
async function bkShareCode(){
  const t=bkCode.value;if(!t)return;const title=L10.bkShareText(bkDate(Date.now()));
  if(NATIVE('shareText')){MMAndroid.shareText(title,title+':\n'+t);return}
  try{await navigator.share({title,text:t})}catch(e){}}
async function bkPasteCode(){
  let t='';
  if(NATIVE('pasteText'))t=MMAndroid.pasteText()||'';else{try{t=await navigator.clipboard.readText()}catch(e){}}
  if(t){bkCode.value=t;bkPending=null;say('');bkRow()}else bkCode.focus()}
async function bkCheckCode(){
  const b=await readCode(bkCode.value);
  if(!b){say(L10.bkBad,true);return}
  bkPending=b;say(L10.bkConfirm(fmt(practisedN(b.stats)),bkDate(b.at),fmt(practisedN(stats))));bkRow();$('bkApply')?.focus()}
function bkApply(){
  const b=bkPending;if(!b)return;
  stats=b.stats;saveStats();
  if(b.ui&&LEVELS.includes(b.ui.level)){
    const ub=b.ui.unitBy||{};LEVELS.forEach(l=>{const u=ub[l];state.unitBy[l]=Number.isInteger(u)&&u>=0&&u<=UNITS[l]?u:1});
    state.level=b.ui.level}
  if((b.lang==='auto'||LANGS.includes(b.lang))&&b.lang!==langPref)setLang(b.lang,true);
  if(themeList().includes(b.theme)&&b.theme!==theme)applyTheme(b.theme,true);
  closeBk();setLevel(state.level);          /* saves the level/unit, restarts cards and quiz, redraws */
  toast(L10.bkDone)}
$('bkBtn').onclick=openBackup;
bkSheet.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeBk();return}
  const opt=e.target.closest('[data-bk]');if(opt){bkShow(opt.dataset.bk);return}
  const id=e.target.id;
  if(id==='bkCopy')bkCopyCode();else if(id==='bkShare')bkShareCode();else if(id==='bkPaste')bkPasteCode();
  else if(id==='bkCheck')bkCheckCode();else if(id==='bkApply')bkApply();
  else if(id==='bkCancel'){bkPending=null;say('');bkRow()}});
bkSheet.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();bkBack()}});
bkCode.addEventListener('input',()=>{if(bkMode==='restore'&&(bkPending||bkMsg.textContent)){bkPending=null;say('');bkRow()}});

let toastT;function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2000)}

/* ---------- keyboard + Android back ---------- */
/* Back closes the topmost layer: a menu, then the focused screen (back to Home). false lets the app exit. */
window.mmBack=function(){
  if(window.mmBusy&&mmBusy())return true;   /* a screen animation is still running */
  if(!infoSheet.hidden){closeInfo();return true}
  if(!bkSheet.hidden){bkBack();return true}
  if(qMenuOpen()){qMenu(false);return true}
  if(!langMenu.hidden){closeLang(false);return true}
  if(!lvMenu.hidden){closeMenu(false);return true}
  if(!uMenu.hidden){closeUMenu(false);return true}
  if(state.screen!=='home'){back();return true}
  return false};
document.addEventListener('keydown',e=>{
  if(!lvMenu.hidden||!uMenu.hidden||!langMenu.hidden||!infoSheet.hidden||!bkSheet.hidden||qMenuOpen())return;
  if(e.key==='Escape'&&state.screen!=='home'&&!/^(INPUT|SELECT)$/.test(e.target.tagName)){back();return}
  if(/^(INPUT|SELECT)$/.test(e.target.tagName))return;
  if(state.screen==='card'){if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();flipped=!flipped;$('flip')?.classList.toggle('on',flipped)}
    if(e.key==='ArrowRight')fcAnswer(true);if(e.key==='ArrowLeft')fcAnswer(false)}
  if(state.screen==='quiz'){if(/^[1-4]$/.test(e.key))document.querySelectorAll('.opts button')[+e.key-1]?.click();if(e.key==='Enter'&&e.target.tagName!=='BUTTON'&&$('qNext'))$('qNext').click()}
});

/* ---------- start on Home ---------- */
document.body.dataset.level=state.level;$('seal').textContent=NUM[state.level-1];
applyStatic();saveStats();startCards();startQuiz();go('home');
</script>
