<div class="wrap">

<!-- ===== Home ===== -->
<section class="screen home" id="scr-home">
  <header class="top">
    <div class="brand">
      <div class="seal" id="seal" aria-hidden="true">一</div>
      <h1 class="wm"><span class="wm1">Xue<i>Ci</i></span> <span class="wm2">Mandarin</span></h1>
    </div>
    <button class="curlv" id="curLvBtn" aria-haspopup="dialog"><i aria-hidden="true"></i><b id="curLvName" lang="zh-CN">凡人</b><small id="curLvSub">HSK 1</small></button>
    <div class="langwrap" id="langwrap">
      <button class="langbtn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3C9.5 5.6 8.2 8.6 8.2 12s1.3 6.4 3.8 9"/></svg><b id="langCode">ID</b></button>
      <div class="menu langmenu" id="langMenu" hidden>
        <div class="mhead" data-i18n="langHead"></div>
        <div id="langList" role="listbox" data-i18n-aria="langHead"></div>
      </div>
    </div>
    <button class="iconbtn" id="themeBtn"></button>
  </header>

  <section class="plan" id="plan" aria-labelledby="planT"></section>

  <div class="lvpills" id="lvPills" role="group" data-i18n-aria="pickLv"></div>

  <div class="hero" id="hero" role="button" tabindex="0">
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="trk" cx="60" cy="60" r="52"/>
        <g id="ringArcs"></g>
      </svg>
      <div class="rc"><b id="heroPct">0%</b><small id="heroLbl"></small></div>
    </div>
    <div class="hinfo"><div class="hlv" id="heroLv"></div><div class="hkeys" id="heroKeys"></div>
      <div class="hfoot"><span class="cnt" id="heroCnt"></span><span class="go" id="heroGo"></span></div></div>
  </div>

  <nav class="tiles" data-i18n-aria="modesL">
    <button class="tile" data-go="list"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg></span><b data-i18n="list"></b><small data-i18n="subList"></small></button>
    <button class="tile" data-go="card"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2.5"/><path d="M7.5 3.5H18a2.5 2.5 0 0 1 2.5 2.5v10.5"/></svg></span><b data-i18n="card"></b><small data-i18n="subCard"></small></button>
    <button class="tile" data-go="quiz"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.9.8c0 1.7-2.5 2.1-2.5 3.6"/><circle cx="12" cy="17.2" r="1.1" fill="currentColor" stroke="none"/></svg></span><b data-i18n="quiz"></b><small data-i18n="subQuiz"></small></button>
  </nav>

  <div class="homeacts">
  <button class="toneinfo" id="toneInfo" aria-haspopup="dialog" data-i18n-aria="infoBtn"><span class="excl" aria-hidden="true">!</span><span class="tz"><b class="t1">妈</b><b class="t2">麻</b><b class="t3">马</b><b class="t4">骂</b><b class="t5">吗</b></span><span class="tl" data-i18n="infoBtn"></span><span class="chev" aria-hidden="true">›</span></button>
    <button class="toneinfo bkbtn" id="bkBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.6 4.5L20 16"/><path d="M20 20.5V16h-4.5"/></svg><span class="tl" data-i18n="bkBtn"></span></button>
  </div>
</section>

<!-- ===== List / Cards / Quiz (one focused task at a time) ===== -->
<section class="screen focus" id="scr-focus" hidden>
  <div class="fbar">
    <div class="frow">
      <button class="backbtn" id="backBtn" data-i18n-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="fTitle" tabindex="-1"></h2>
      <button class="pchip" id="lvbtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="lvMenu"><b id="lvName">HSK 1</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="pchip" id="ubtn" aria-haspopup="true" aria-expanded="false" aria-controls="uMenu"><span id="uName">Unit 01</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="lvMenu" hidden>
        <div class="mhead" id="allHead"></div>
        <div id="lvList" role="listbox" data-i18n-aria="pickLv"></div>
        <div class="msep"></div>
        <button class="mstats" id="openStats"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/></svg><span data-i18n="fullStats"></span></span>›</button>
      </div>
      <div class="menu umenu" id="uMenu" hidden><div class="ugrid" id="uGrid" role="group" data-i18n-aria="pickU"></div></div>
    </div>
  </div>
  <div class="tools" id="listTools">
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" data-i18n-ph="search" data-i18n-aria="searchL" autocomplete="off"></label>
    <button class="tchip" id="hideMean" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3.2 4.2M6.2 6.2A13 13 0 0 0 2 12c1 2.5 5 7 10 7a9.8 9.8 0 0 0 4.3-1"/></svg><span data-i18n="hide"></span></button>
    <button class="tchip" id="onlyNew" aria-pressed="false"><i class="sd s-yellow"></i><span data-i18n="weak"></span></button>
  </div>
  <main id="view"></main>
  <div class="foot-note" id="footNote">
    <div class="legend" id="legend" data-i18n-aria="toneL"></div>
    <p id="footP"></p>
  </div>
</section>

<!-- ===== Stats ===== -->
<section class="screen stats" id="scr-stats" hidden>
  <div class="fbar">
    <div class="frow">
      <button class="backbtn" id="stBack" data-i18n-aria="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="stTitle" tabindex="-1" data-i18n="stTitle"></h2>
    </div>
  </div>
  <div class="stbody">
    <div class="insights" id="stIns"></div>
    <div class="lvpills" id="stLevels" role="group" data-i18n-aria="level"></div>
    <div class="stsum" id="stSum"></div>
    <div class="stbar"><div class="stack" id="stStack"></div></div>
    <div class="keys" id="stKeys"></div>
    <div class="scalewrap" id="stScale"></div>
    <div class="grid-wrap" id="stGrid"></div>
    <div class="stdetail" id="stDetail"></div>
    <div class="stfoot" id="stFoot"></div>
  </div>
</section>

<!-- ===== Soul Sea (识海): realm and stage, the soul orb, the five elements, today's trial, cultivation days, rest ===== -->

  <div class="soulbody" id="soulBody"></div>
</section>
