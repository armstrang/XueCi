<title>XueCi Mandarin</title>
<script>/* text size: Android's font scale (or ?fs= for testing) → --fs for text, --fsd (half the change) for big display text */
(function(){var f=1;try{var q=new URLSearchParams(location.search).get('fs');if(q)f=+q;else if(window.MMAndroid&&MMAndroid.fontScale)f=+MMAndroid.fontScale()}catch(e){}
if(!(f>0))f=1;f=Math.min(1.6,Math.max(.85,f));var d=document.documentElement,r=d.style;r.setProperty('--fs',f);r.setProperty('--fsd',1+(f-1)/2);if(f>=1.15)d.classList.add('bigtext')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap">
<style>
/* Two kinds of screen: Home (logo · language · theme → level pills → big progress ring → three mode tiles)
   and focused screens (List / Cards / Quiz / Stats) that show only that task, with a back button and compact pickers.
   Level accent per HSK; tone colors on hanzi/pinyin; green/yellow/red = understanding. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --sunk:#e8ebf1; --fg:#161a22; --soft:#4f5767; --mute:#636a78; --line:#e1e5ec;
  --mark:#ffe1a8; --on-acc:#ffffff; --shadow:0 18px 50px rgba(22,26,34,.18);
  --l1:#2f8a4c; --l2:#0f7f88; --l3:#1f78b4; --l4:#3c4fb8; --l5:#7a46b8; --l6:#a3386f;
  --t1:#c4362a; --t2:#a85c06; --t3:#1d7d4d; --t4:#2a62c0; --t5:#6a716d;   /* v1.15: tone colours meet 4.5:1 on light glass */
  --s-red:#e5484d; --s-yellow:#f0bf26; --s-green:#3fae4c; --s-none:#d3d8e0;
  --good:#1d7a4d; --bad:#c2412d;
  --acc:var(--l1);
  --bar:var(--bg); --bar2:var(--bg);   /* Android status / navigation bar colours */
  --f-ui:"Plus Jakarta Sans","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hz:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b24; --sunk:#232937; --fg:#e8ebf1; --soft:#a6aebd; --mute:#7c8496; --line:#2a303d;
  --mark:#5a4515; --on-acc:#0f1218; --shadow:0 18px 50px rgba(0,0,0,.6);
  --l1:#6fd08f; --l2:#5cc8cf; --l3:#6dbbea; --l4:#94a3f5; --l5:#bf9af0; --l6:#ec8dbd;
  --t1:#ff7a66; --t2:#f2a64a; --t3:#5fd38f; --t4:#79a6ff; --t5:#9aa39e;
  --s-red:#ff6b6b; --s-yellow:#f5d04a; --s-green:#62d26f; --s-none:#3a4150;
  --good:#5fd38f; --bad:#ff7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b24; --sunk:#232937; --fg:#e8ebf1; --soft:#a6aebd; --mute:#7c8496; --line:#2a303d;
  --mark:#5a4515; --on-acc:#0f1218; --shadow:0 18px 50px rgba(0,0,0,.6);
  --l1:#6fd08f; --l2:#5cc8cf; --l3:#6dbbea; --l4:#94a3f5; --l5:#bf9af0; --l6:#ec8dbd;
  --t1:#ff7a66; --t2:#f2a64a; --t3:#5fd38f; --t4:#79a6ff; --t5:#9aa39e;
  --s-red:#ff6b6b; --s-yellow:#f5d04a; --s-green:#62d26f; --s-none:#3a4150;
  --good:#5fd38f; --bad:#ff7a66; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body[data-level="1"]{--acc:var(--l1)} body[data-level="2"]{--acc:var(--l2)} body[data-level="3"]{--acc:var(--l3)}
body[data-level="4"]{--acc:var(--l4)} body[data-level="5"]{--acc:var(--l5)} body[data-level="6"]{--acc:var(--l6)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 40px;transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent}
.wrap{max-width:920px;margin:0 auto}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h2[tabindex]:focus{outline:none}
.s-red{background:var(--s-red)}.s-yellow{background:var(--s-yellow)}.s-green{background:var(--s-green)}.s-none{background:var(--s-none)}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.stack{display:flex;width:100%;height:100%;background:var(--sunk)}
.stack i{display:block;height:100%}
.mbar{display:block;width:76px;height:6px;border-radius:99px;overflow:hidden;flex:none}
.screen{animation:scrIn .22s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Home ---------- */
.home{max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;gap:8px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.seal{width:40px;height:40px;flex:none;border-radius:12px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--f-hz);font-weight:900;font-size:22px;transition:background .25s}
/* wordmark: XueCi (Ci in the level colour) over a spaced-out MANDARIN */
.wm{margin:0;display:flex;flex-direction:column;line-height:1;min-width:0}
.wm1{font-size:calc(23px*var(--fsd,1));font-weight:800;letter-spacing:-.045em;color:var(--fg);white-space:nowrap}
.wm1 i{font-style:normal;color:var(--acc);transition:color .25s}
.wm2{font-size:calc(9px*var(--fsd,1));font-weight:800;letter-spacing:.42em;text-transform:uppercase;color:var(--soft);margin-top:5px;white-space:nowrap}
/* current HSK level, beside the language button */
.curlv{height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:7px;padding:0 12px 0 11px;font-size:calc(12.5px*var(--fsd,1));font-weight:800;color:var(--fg);white-space:nowrap;--lc:var(--l1)}
.curlv i{width:9px;height:9px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 24%,transparent);flex:none}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--soft);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{color:var(--fg);border-color:var(--mute)}

.lvpills{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:6px;margin-bottom:10px}
.lvpills.n9 .hl{display:none}   /* nine levels: the pills show only the number */
.lvpills.n9 .lvpill b{font-size:calc(14px*var(--fsd,1))}
.lvpill{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2;min-width:0;transition:background .2s,border-color .2s}
.lvpill b{font-size:calc(13px*var(--fsd,1));font-weight:800;white-space:nowrap}
.lvpill small{font-size:calc(10.5px*var(--fsd,1));font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.lvpill:hover{border-color:var(--lc)}
.lvpill[aria-pressed="true"]{background:var(--lc);border-color:var(--lc);color:var(--on-acc)}
.lvpill[aria-pressed="true"] small{color:inherit;opacity:.85}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;align-items:center;cursor:pointer;transition:border-color .2s,transform .12s}
.hero:hover{border-color:var(--acc)}
.ring{position:relative;width:clamp(100px,18.5vh,156px);height:clamp(100px,18.5vh,156px)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:12}
.ring .trk{stroke:var(--sunk)}
.ring .sg{transition:stroke-dasharray .6s ease,stroke-dashoffset .6s ease}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center}
.rc b{font-size:clamp(26px,4.6vh,38px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rc small{font-size:12.5px;font-weight:700;color:var(--soft);margin-top:3px}
.hlv{font-size:12.5px;font-weight:800;color:var(--acc);margin-bottom:6px;white-space:nowrap}
.hkeys{display:flex;flex-direction:column;gap:4px}
.hkey{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft);line-height:1.25}
.hkey b{margin-left:auto;color:var(--fg);font-size:14px;font-variant-numeric:tabular-nums}
.hfoot{display:flex;align-items:center;justify-content:space-between;gap:2px 10px;border-top:1px dashed var(--line);padding-top:6px;margin-top:6px;font-size:12px;flex-wrap:wrap}
.hfoot .cnt{color:var(--soft);font-variant-numeric:tabular-nums}
.hfoot .cnt b{color:var(--fg)}
.hfoot .go{color:var(--acc);font-weight:800;white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:11px 11px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-height:clamp(84px,12.5vh,116px);transition:border-color .2s,transform .12s}
.tile .ic{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 15%,var(--surface));color:var(--acc);margin-bottom:4px}
.tile .ic svg{width:20px;height:20px}
.tile b{font-size:15.5px;font-weight:800;line-height:1.2}
.tile small{font-size:calc(11.5px*var(--fsd,1));color:var(--soft);line-height:1.3;overflow-wrap:anywhere}
.tile b{overflow-wrap:anywhere}
/* larger phone text: the "14" mark under the stats scale makes room for the "20 · mature" label */
.bigtext .tile small{display:none}   /* larger phone text: Home still fits one screen */
.bigtext .scalelbl span:nth-child(3){display:none}.bigtext .scalelbl .end{grid-column:9/21}
.tile:hover{border-color:var(--acc)}
.tile:active,.hero:active{transform:scale(.98)}

/* menus (shared) */
.menu{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px;min-width:280px}
.mhead{font-size:12px;color:var(--soft);padding:6px 12px 6px;font-variant-numeric:tabular-nums}
.mhead b{color:var(--fg)}
.msep{height:1px;background:var(--line);margin:6px 8px}

/* study-language picker */
.langwrap{position:relative;flex:none}
.langbtn{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--soft);display:flex;align-items:center;gap:6px;padding:0 10px}
.langbtn svg{width:17px;height:17px}
.langbtn b{font-size:12.5px;font-weight:800;letter-spacing:.05em;color:var(--fg)}
.langbtn:hover{color:var(--fg);border-color:var(--mute)}
.langbtn[aria-expanded="true"]{border-color:var(--acc)}
.langmenu{left:auto;right:0;min-width:240px}
.lgrow{width:100%;min-height:48px;border:0;border-radius:13px;background:transparent;display:flex;align-items:center;gap:12px;padding:7px 12px;text-align:left}
.lgrow:hover{background:var(--sunk)}
.lgrow .lgcode{width:34px;height:26px;flex:none;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--soft)}
.lgrow .nm{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.lgrow b{font-size:14.5px;font-weight:700}
.lgrow small{font-size:11.5px;color:var(--soft)}
.lgrow .ck{width:16px;height:16px;flex:none;color:var(--acc);visibility:hidden}
.lgrow[aria-selected="true"]{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.lgrow[aria-selected="true"] .lgcode{background:var(--acc);color:var(--on-acc)}
.lgrow[aria-selected="true"] .ck{visibility:visible}
html[lang="th"] .id{font-style:normal}

/* ---------- Focused screens ---------- */
.focus[data-mode="card"],.focus[data-mode="quiz"],.stats{max-width:620px;margin:0 auto}
/* today's session spans every level, so the HSK and unit pickers are hidden there */
.focus[data-mode="session"]{max-width:620px;margin:0 auto}
.focus[data-mode="session"] #lvbtn,.focus[data-mode="session"] #ubtn{display:none}
.fbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px;transition:background .25s}
.frow{position:relative;display:flex;align-items:center;gap:8px}
.backbtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--fg)}
.backbtn svg{width:19px;height:19px}
.backbtn:hover{border-color:var(--acc)}
.frow h2{margin:0 0 0 2px;flex:1 1 auto;min-width:0;font-size:calc(18px*var(--fsd,1));font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip{height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:6px;padding:0 9px 0 12px;font-size:calc(13.5px*var(--fsd,1));font-weight:800;white-space:nowrap}
.pchip svg{width:14px;height:14px;color:var(--mute);transition:transform .2s}
.pchip:hover,.pchip[aria-expanded="true"]{border-color:var(--acc)}
.pchip[aria-expanded="true"] svg{transform:rotate(180deg)}
#lvName{color:var(--acc)}
.frow .menu{left:auto;right:0;width:min(100%,440px)}
.lvrow{width:100%;min-height:52px;border:0;border-radius:13px;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;text-align:left}
.lvrow .l{display:flex;align-items:center;gap:10px;min-width:0}
.lvrow .r{display:flex;align-items:center;gap:10px;flex:none}
.lvrow:hover{background:var(--sunk)}
.lvrow[aria-selected="true"]{background:color-mix(in srgb,var(--lc) 13%,transparent)}
.lvrow[aria-selected="true"] b{color:var(--lc)}
.lvrow .nm{display:flex;flex-direction:column;line-height:1.25}
.lvrow b{font-size:14.5px;font-weight:800}
.lvrow small{font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.lvrow .mbar{width:92px}
.lvrow .pct{width:38px;text-align:right;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.mstats{width:100%;border:0;background:transparent;color:var(--acc);font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px}
.mstats:hover{background:var(--sunk)}
.mstats span{display:flex;align-items:center;gap:8px}
.umenu{max-height:min(380px,60vh);overflow:auto;padding:8px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.ucell{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 8px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.ucell b{font-size:13px;font-weight:800}
.ucell small{font-size:11px;color:var(--soft);font-variant-numeric:tabular-nums}
.ucell .mbar{width:100%;height:5px}
.ucell:hover{border-color:var(--acc)}
.ucell[aria-current="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}
.ucell[aria-current="true"] b{color:var(--acc)}
.ucell.done b::after{content:" ✓";color:var(--s-green)}
.ucell.uall{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px}
.ucell.uall .mbar{flex:1;width:auto}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;height:40px;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:inherit;font-size:14px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute)}
.tchip{height:36px;border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:99px;padding:0 13px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tchip svg{width:14px;height:14px}
.tchip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surface))}
.meta{font-size:12.5px;color:var(--soft);margin:0 0 10px;font-variant-numeric:tabular-nums}

/* list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ihead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.hz{font-family:var(--f-hz);font-weight:900;font-size:26px;line-height:1.1}
.py{font-weight:700;font-size:14px}
.nos{display:flex;gap:7px;align-items:center;flex:none}
.no{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.lvchip{font-size:10.5px;font-weight:800;letter-spacing:.03em;border-radius:6px;padding:1px 6px;color:var(--on-acc)}
.mean{font-size:14px}
.mean b{font-weight:700}.mean span{color:var(--soft)}
.ex{border-top:1px dashed var(--line);padding-top:7px;margin-top:2px}
.zh{font-family:var(--f-zh);font-size:15px;line-height:1.6}
.zh mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;font-weight:700}
.id{color:var(--soft);font-size:12.5px;font-style:italic}
.hidemean .mean,.hidemean .id{filter:blur(6px);transition:filter .2s}
.hidemean .item:hover .mean,.hidemean .item:hover .id,.hidemean .item:focus-within .mean,.hidemean .item:focus-within .id{filter:none}
.more{display:block;margin:16px auto 0;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 14px;font-size:13px;font-weight:700}
.empty{padding:40px;text-align:center;color:var(--soft)}
.st{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}

/* flashcards */
.fcmeta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--soft);margin-bottom:10px;font-variant-numeric:tabular-nums}
.fcmeta .mbar{width:120px;height:5px}
.flip{perspective:1400px;height:340px;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.face:first-child{border-top:4px solid var(--acc)}
.face.back{transform:rotateY(180deg);align-items:stretch;text-align:left;justify-content:flex-start;overflow:auto}
.face .big{font-family:var(--f-hz);font-weight:900;font-size:clamp(56px,16vw,92px);line-height:1}
.face .hint{position:absolute;bottom:14px;font-size:12px;color:var(--mute)}
.face .st{position:absolute;top:14px;right:16px}
.face.back .hz{font-size:34px}
.face.back .mean{font-size:16px;margin-block:4px 8px}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fcbtns button{border:0;border-radius:14px;padding:13px;font-weight:800;font-size:15px}
.no-btn{background:var(--sunk);color:var(--bad)}
.yes-btn{background:var(--acc);color:var(--on-acc)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 12px;font-size:13px;font-weight:600}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:10px}
.score{display:flex;gap:12px;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.score b{color:var(--fg);font-size:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:22px;padding:20px 18px;text-align:center}
.qcard .big{font-family:var(--f-hz);font-weight:900;font-size:clamp(48px,13vw,72px);line-height:1.1}
.qcard .q{color:var(--soft);font-size:13px;margin-bottom:6px}
.opts{display:grid;gap:8px;margin-top:14px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:11px 14px;font-size:15px;font-weight:600}
@media (hover:hover){.opts button:hover:not(:disabled){border-color:var(--acc)}}
.opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opts button.ng{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.feedback{margin-top:14px;text-align:left}
.feedback:empty{display:none}
.next{margin-top:14px;border:0;background:var(--acc);color:var(--on-acc);border-radius:13px;padding:12px 20px;font-weight:800;width:100%}
.foot-note{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:26px;font-size:12px;color:var(--mute);text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;color:var(--soft)}
.legend b{font-family:var(--f-hz);font-size:14px}
.foot-note p{margin:0;max-width:640px;text-wrap:balance}
.foot-note a{color:var(--soft)}

/* quiz type dropdown */
.qsel{position:relative}
.qtbtn{height:38px;display:flex;align-items:center;gap:8px;padding:0 10px 0 5px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:800;white-space:nowrap}
.qtbtn svg{width:14px;height:14px;color:var(--mute);transition:transform .2s}
.qtbtn[aria-expanded="true"]{border-color:var(--acc)}
.qtbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.qti{width:48px;flex:none;height:28px;padding:0;border-radius:999px;display:grid;place-items:center;font-size:11.5px;font-weight:800;letter-spacing:.02em;font-family:var(--f-zh),var(--f-ui);color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent);white-space:nowrap}
.qmenu{left:0;right:auto;top:calc(100% + 8px);width:min(330px,calc(100vw - 32px));min-width:0}
.qtrow{width:100%;border:0;background:transparent;border-radius:13px;display:flex;align-items:center;gap:12px;padding:9px 10px;text-align:left}
.qtrow:hover{background:var(--sunk)}
.qtrow .nm{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.qtrow b{font-size:14px;font-weight:800}
.qtrow small{font-size:11.5px;color:var(--soft)}
.qtrow .ck{width:16px;height:16px;flex:none;color:var(--acc);visibility:hidden}
.qtrow[aria-selected="true"]{background:color-mix(in srgb,var(--acc) 11%,transparent)}
.qtrow[aria-selected="true"] .qti{background:var(--acc);color:var(--on-acc)}
.qtrow[aria-selected="true"] .ck{visibility:visible}

/* tone colours & info */
.excl{width:24px;height:24px;flex:none;border-radius:50%;border:1.8px solid currentColor;display:grid;place-items:center;font-size:13px;font-weight:900;line-height:1;font-family:var(--f-ui)}
.toneinfo{display:flex;align-items:center;gap:10px;margin:14px auto 0;padding:8px 14px 8px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-size:12.5px;font-weight:700;max-width:100%}
.toneinfo .excl{color:var(--acc)}
.toneinfo .tz{display:flex;gap:3px;font-family:var(--f-hz);font-weight:900;font-size:15px;line-height:1}
.toneinfo .tl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toneinfo .chev{color:var(--mute);font-size:16px;line-height:1}
.toneinfo:hover{border-color:var(--acc)}
.zp{font-size:12.5px;line-height:1.45;color:var(--soft);margin:1px 0 3px;letter-spacing:.005em}
.zp mark{background:none;color:var(--acc);font-weight:700}
.spk{display:inline-grid;place-items:center;width:32px;height:32px;flex:none;padding:0;border:0;border-radius:50%;vertical-align:middle;
  background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);margin-left:8px}
.spk svg{width:17px;height:17px}
.spk.sm{width:26px;height:26px;margin-left:6px}.spk.sm svg{width:14px;height:14px}
.spk.lg{width:46px;height:46px;margin:6px auto 0;display:grid}.spk.lg svg{width:22px;height:22px}
.spk.on{background:var(--acc);color:var(--on-acc)}
.spk.on .w1{animation:spkw .9s ease-in-out infinite}.spk.on .w2{animation:spkw .9s ease-in-out .15s infinite}
@keyframes spkw{50%{opacity:.25}}
.head .spk{align-self:center}
.homeacts{display:flex;justify-content:center;align-items:stretch;gap:8px;margin-top:10px;max-width:100%}
/* Home fits one screen: less padding under it */
body[data-screen="home"]{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.homeacts .toneinfo{margin:0;min-width:0}
.bkbtn{flex:none;gap:7px;padding-left:13px}
.bkbtn svg{width:17px;height:17px;flex:none;color:var(--acc)}
.bkbtn .tl{color:var(--fg)}
@media (max-width:479px){.homeacts #toneInfo .tl{display:none}}
.bkopts{display:grid;gap:8px}
.bkopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.bkopt .bi{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.bkopt .bi svg{width:20px;height:20px}
.bkopt .bt{flex:1;min-width:0}.bkopt b{display:block;font-size:15px;font-weight:800}.bkopt small{display:block;font-size:12.5px;color:var(--soft);line-height:1.35}
.bkopt .chev{color:var(--mute);font-size:18px}
.bkopt:hover{border-color:var(--acc)}
/* when the last backup was made (v1.12); after a month a quiet dot on the Home button, no notification */
.bklast{margin:4px 2px 0;font-size:12.5px;line-height:1.4;color:var(--mute)}
.bklast.old{color:var(--soft);font-weight:700}
.bklast.old::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s-yellow);margin-right:7px;vertical-align:1px}
.bkbtn{position:relative}
.bkbtn.due::before{content:"";position:absolute;z-index:3;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--s-yellow);box-shadow:0 0 0 2px var(--surface)}
.sheetwrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.scrim2{position:absolute;inset:0;background:rgba(10,12,18,.45);animation:fadeIn .25s ease both}
.isheet{position:relative;width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:26px 26px 0 0;box-shadow:var(--shadow);padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .35s cubic-bezier(.22,1,.36,1) both}
@media (min-width:600px){.sheetwrap{align-items:center}.isheet{border-radius:26px}}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
.ihead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.ihead .excl{color:var(--acc)}
.ihead h2{margin:0;flex:1;font-size:18px;font-weight:800}
.xbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);color:var(--soft);font-size:20px;line-height:1}
.ilead{margin:0 0 12px;font-size:13.5px;color:var(--soft)}
.tones{display:flex;flex-direction:column;gap:6px}
.tone{display:grid;grid-template-columns:34px 38px 40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--sunk)}
.tone .tz{font-family:var(--f-hz);font-weight:900;font-size:24px;line-height:1;text-align:center}
.tone .tp{font-weight:800;font-size:14px}
.tone .tc{width:40px;height:24px}
.tone .tn{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.tone .tn b{font-size:13.5px}.tone .tn small{font-size:11.5px;color:var(--soft)}
.tone .tm{font-size:12px;color:var(--soft);font-style:italic;text-align:right}
.isec{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.isec h3{margin:0 0 4px;font-size:14px;font-weight:800}
.isec p{margin:0 0 10px;font-size:13px;color:var(--soft)}
.gh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:800;font-size:14px}
.gh svg{width:20px;height:20px;flex:none}.gh span:nth-child(2){flex:1}.gh .ext{opacity:.7}
.plink{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:700;font-size:14px}
.plink .ext{opacity:.6}
.isec .icred{margin:12px 0 0;font-size:11.5px;color:var(--mute)}
.isec .icred a{color:var(--soft)}
@media (max-width:400px){.tone{grid-template-columns:30px 34px 34px minmax(0,1fr);gap:8px}.tone .tm{display:none}}

/* stats screen */
.stbody{display:flex;flex-direction:column;gap:12px}
.stbody .lvpills{margin-bottom:0}
.stsum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.stsum .big{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stsum .big small{font-size:14px;font-weight:700;color:var(--soft);margin-left:4px}
.stsum .tot{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.stbar{height:10px;border-radius:99px;overflow:hidden}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:11.5px;color:var(--soft);line-height:1.3}
.key b{display:flex;align-items:center;gap:5px;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.scale{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:14px}
.scale i{border-radius:3px}
.scalelbl{display:grid;grid-template-columns:repeat(20,1fr);font-size:calc(11px*var(--fsd,1));color:var(--mute);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.scalelbl .end{grid-column:15/21;text-align:right;font-weight:700;color:var(--soft)}
.grid-wrap{display:flex;flex-direction:column;gap:10px}
.ublock .ulabel{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.06em;margin-bottom:5px;font-variant-numeric:tabular-nums}
.ublock .ulabel span{font-weight:600;letter-spacing:0}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(17px,1fr));gap:5px}
.dots button{border:0;padding:0;aspect-ratio:1;max-width:100%;border-radius:50%;cursor:pointer}
.dots button[aria-current="true"]{outline:2.5px solid var(--fg);outline-offset:1.5px}
.stdetail{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stdetail .w{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.stdetail .w .hz{font-size:24px}
.stdetail .hint{font-size:13px;color:var(--mute)}
.ans{display:flex;gap:6px}
.ans button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 11px;font-size:12.5px;font-weight:700}
.bkcode{display:block;width:100%;min-height:104px;max-height:32vh;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--sunk);color:var(--fg);padding:10px 12px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.bkmsg{margin:8px 0 0;font-size:13px;color:var(--soft);min-height:1.2em}.bkmsg.bad{color:var(--bad)}
.bkrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.bkrow button{min-width:96px}
.ghost.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:800}
.stfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.stfoot p{margin:0;font-size:12px;color:var(--mute);flex:1 1 220px}
.danger{border:1.5px solid color-mix(in srgb,var(--bad) 50%,var(--line));background:transparent;color:var(--bad);border-radius:11px;padding:8px 12px;font-size:13px;font-weight:800}
.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--on-acc)}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:11px;font-size:13px;font-weight:700;z-index:60;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

/* ---------- guided learning ---------- */
/* Home: today's plan */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:11px 14px 13px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.pmain{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
/* the text keeps at least ~150px (scaled with the phone's text size); when it can't, the button moves below it and
   spans the card, instead of squeezing the text into a column of single words (big text, long labels) */
.ptxt{flex:999 1 calc(150px*var(--fs,1));min-width:0;display:flex;flex-direction:column;gap:3px}
.pmain .planbtn{flex:1 0 auto}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.ptop h2{margin:0;font-size:calc(17px*var(--fsd,1));font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.gchip{height:32px;min-width:0;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:12.5px;font-weight:800;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pline{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.pline span{color:var(--soft);font-weight:600}
.pst{display:flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--soft);line-height:1.4}
.pst .sd{flex:none;transform:translateY(-1px)}
.planbtn{flex:none;border:0;border-radius:999px;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:15px;padding:12px 18px 12px 15px;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.planbtn.wide{width:100%;margin:4px 0 12px;padding:13px 16px}
.planbtn svg{width:15px;height:15px;flex:none}
/* goal sheet */
.gsec{margin-top:12px}
.glbl{display:block;font-size:11.5px;font-weight:800;color:var(--soft);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.gsegs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.gsegs.lv{grid-auto-flow:row;grid-template-columns:repeat(6,minmax(0,1fr))}
.gseg,.gnum{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:13px;padding:9px 4px;font-size:13px;font-weight:700;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.gseg[aria-pressed="true"],.gnum[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.gsegs.lv .gseg{font-size:12px;padding:9px 0}
.gsegs.lv .gseg[aria-pressed="true"]{background:var(--lc);border-color:var(--lc)}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gnum{padding:7px 12px;border-radius:999px}
.gdate{width:100%;height:44px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--fg);font:inherit;font-size:15px;padding:0 12px}
.gfc{margin-top:14px;padding:11px 13px;border-radius:14px;background:var(--sunk);font-size:13.5px;line-height:1.45}
.gfc.good{background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.gfc.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.gfix{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.gfix .ghost{font-weight:700}
.bkrow button:disabled{opacity:.45}
/* cards: claim → check → result */
/* during the quick check the card shrinks to the word, so the options fit on the screen */
.flip.checking{height:230px}.flip.checking .face .hint{display:none}
.fcact{margin-top:12px}
.chk{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px}
.chk .q{font-size:13px;font-weight:800;color:var(--acc);margin-bottom:8px;text-align:center}
.chk .opts{margin-top:0}
.res{font-size:13.5px;font-weight:700;padding:10px 13px;border-radius:14px;margin-bottom:10px;line-height:1.4}
.res.ok{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.res.over{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.res.no,.res.trust{color:var(--soft);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.fcbtns.one{grid-template-columns:1fr}
.fcbtns .next{margin-top:0}
.face .newtag{font-weight:800;color:var(--acc)}
.fcmeta .tlabel{font-weight:800;color:var(--acc);margin-left:auto;margin-right:10px}
/* questions */
.pyo{font-weight:700;letter-spacing:.01em}
.hzo{font-family:var(--f-hz);font-weight:900;font-size:20px}
.spk.xl{width:76px;height:76px;margin:8px auto 2px;display:grid}.spk.xl svg{width:34px;height:34px}
.fbv{font-weight:800}.fbv.good{color:var(--good)}.fbv.bad{color:var(--bad)}
.picked{font-size:13px;color:var(--soft);margin:2px 0 6px}.picked .hzs{font-family:var(--f-hz);font-weight:900;color:var(--fg);font-size:16px}
.timer{font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums}
/* end of a run */
.sum h3{margin:2px 0 10px;font-size:18px;font-weight:800}
.sum .big{font-family:var(--f-hz)}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 10px}
.sumgrid div{background:color-mix(in srgb,var(--fg) 6%,transparent);border-radius:14px;padding:9px 6px;display:flex;flex-direction:column;line-height:1.25}
.sumgrid b{font-size:20px;font-variant-numeric:tabular-nums}.sumgrid small{font-size:11.5px;color:var(--soft)}
.sumnote{font-size:13px;color:var(--soft);margin:6px 0;line-height:1.45}
.sumrow,.sumwords{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0;font-size:13px;color:var(--soft)}
.sumwords .lbl{width:100%;font-size:12px;font-weight:800}
.wchip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 6%,transparent);font-size:12.5px;max-width:100%;color:var(--fg)}
.wchip b{font-family:var(--f-hz);font-weight:900;font-size:16px}
.pair{display:inline-flex;align-items:baseline;gap:4px;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--fg)}
.pair b{font-family:var(--f-hz);font-weight:900;font-size:16px}.pair small{color:var(--soft);font-size:11px;margin-left:2px}
.sumbtns{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:14px}.sumbtns .next{margin-top:0}
/* stats: insights and word detail */
.insights{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:13px 14px;display:flex;flex-direction:column;gap:10px}
.ihd{display:flex;align-items:baseline;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}.ihd b{font-size:15px;font-weight:800}.ihd small{font-size:11.5px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kpis div{background:color-mix(in srgb,var(--fg) 6%,transparent);border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.kpis b{font-size:18px;font-variant-numeric:tabular-nums}.kpis small{font-size:11px;color:var(--soft);overflow-wrap:anywhere}
.skills{display:flex;flex-direction:column;gap:6px}
.skrow{display:grid;grid-template-columns:minmax(70px,auto) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12.5px}
