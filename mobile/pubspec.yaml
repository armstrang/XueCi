name: xueci
description: XueCi Mandarin, HSK vocabulary with a learning engine on the device.
publish_to: 'none'
version: 1.0.0+2000

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: any
  crypto: ^3.0.6
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/i18n/
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/pjs-400.ttf
          weight: 400
        - asset: assets/fonts/pjs-500.ttf
          weight: 500
        - asset: assets/fonts/pjs-600.ttf
          weight: 600
        - asset: assets/fonts/pjs-700.ttf
          weight: 700
        - asset: assets/fonts/pjs-800.ttf
          weight: 800
        - asset: assets/fonts/pjs-italic-500.ttf
          weight: 500
          style: italic
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/thai-400.ttf
          weight: 400
        - asset: assets/fonts/thai-600.ttf
          weight: 600
        - asset: assets/fonts/thai-700.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/sans-sc-400.ttf
          weight: 400
        - asset: assets/fonts/sans-sc-700.ttf
          weight: 700
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/serif-sc-700.ttf
          weight: 700
        - asset: assets/fonts/serif-sc-900.ttf
          weight: 900
