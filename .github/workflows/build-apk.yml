name: Build APK

# The app in mobile/. Push to main → assets from content/ (word data, interface text, the sealed part) → analyzer →
# tests (engine against its recorded runs, screens, contrast, backup, the secret) → a signed APK and the Play bundle →
# GitHub release v1.N. Only when Josh says a version is ready; test builds come from flutter.yml as v1.0-alpha-N.
on:
  push:
    branches: [main]
    # Notes, artwork and store graphics don't change the app, so they don't make a new release.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'art/**'
      - 'store/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # v1.N from run 19 of this workflow. versionCode = 2000 + run: above every earlier build (100 + run) and every test
      # build (1000 + run), so each release installs over what is on the phone.
      - name: Version
        run: |
          n=$(( GITHUB_RUN_NUMBER - 19 ))
          if [ "$n" -lt 0 ]; then n=0; fi
          echo "VER=1.$n" >> "$GITHUB_ENV"
          echo "CODE=$(( 2000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"

      - name: Assets (word data, interface text, the sealed part)
        run: |
          npm install --silent --no-save --prefix mobile/tool acorn@8.15.0
          python3 mobile/tool/make_assets.py

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      # No APK when a test fails.
      - name: Tests
        working-directory: mobile
        run: flutter test --update-goldens

      - name: Keep the test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: mobile/test/goldens/
          if-no-files-found: ignore

      - name: Build signed APK
        working-directory: mobile
        run: |
          flutter build apk --release --build-number=$CODE --build-name=$VER
          cp build/app/outputs/flutter-apk/app-release.apk ../XueCiMandarin.apk

      # Google Play bundle, signed with the upload key from the repository secrets when they are set
      - name: Build Play bundle (AAB)
        working-directory: mobile
        env:
          KS_B64: ${{ secrets.XC_UPLOAD_KEYSTORE_B64 }}
          XC_UPLOAD_STORE_PASSWORD: ${{ secrets.XC_UPLOAD_STORE_PASSWORD }}
          XC_UPLOAD_KEY_ALIAS: ${{ secrets.XC_UPLOAD_KEY_ALIAS }}
          XC_UPLOAD_KEY_PASSWORD: ${{ secrets.XC_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export XC_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
            echo "Signing the bundle with the Play upload key"
          else
            echo "::notice title=No upload key::XC_UPLOAD_KEYSTORE_B64 is not set; the bundle is signed with the sideload key (not for Play)"
          fi
          XC_PLAY=1 flutter build appbundle --release --build-number=$CODE --build-name=$VER
          cp build/app/outputs/bundle/release/app-release.aab ../XueCiMandarin.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: XueCiMandarin-apk
          path: XueCiMandarin.apk

      # Never mix a new build into an old release that happens to share its name.
      - name: Check the version name is free
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "::error title=Release v$VER already exists::Delete the old release and tag v$VER on GitHub, then re-run this workflow. The APK is still attached to this run as an artifact."
            exit 1
          fi

      # Release notes: the "## v1.N" section of CHANGELOG.md, then how to install.
      - name: Release notes
        run: |
          awk -v v="## v$VER" 'index($0,"## ")==1{if(p)exit; p=($0==v||index($0,v" ")==1)} p' CHANGELOG.md | tail -n +2 > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning title=No changelog entry::CHANGELOG.md has no section for v$VER"
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." > notes.md
          fi
          printf '\n---\n\nDownload **XueCiMandarin.apk** below and open it on an Android phone to install (the .aab file is the Google Play bundle).\nUpdates install over the previous version; your study progress is kept.\n' >> notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: XueCi Mandarin v${{ env.VER }}
          body_path: notes.md
          files: |
            XueCiMandarin.apk
            XueCiMandarin.aab
          make_latest: true
