name: Build APK

on:
  push:
    branches: [main]
    # Notes, artwork and tests don't change the app, so they don't make a new release.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'art/**'
      - 'tests/**'
      - 'store/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Version shown to people: 1.0, 1.1, ... (matches versionName in app/build.gradle)
      - name: Version
        run: |
          n=$(( GITHUB_RUN_NUMBER - 1 ))
          if [ "$n" -lt 0 ]; then n=0; fi
          echo "VER=1.$n" >> "$GITHUB_ENV"

      # The app page is built from web/src + web/data, so the APK always matches the source.
      - name: Build app page
        run: python3 web/build.py

      - name: Build signed APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            # Surface the Gradle error as an annotation so it shows on the run summary page.
            msg=$(grep -A 30 "What went wrong" build.log | head -60)
            [ -z "$msg" ] && msg=$(grep -iE "error|exception" build.log | head -40)
            [ -z "$msg" ] && msg=$(tail -40 build.log)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk XueCiMandarin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XueCiMandarin-apk
          path: XueCiMandarin.apk

      # Never mix a new build into an old release that happens to share its name (e.g. an old v1.3).
      - name: Check the version name is free
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "::error title=Release v$VER already exists::Delete the old release and tag v$VER on GitHub, then re-run this workflow. The APK is still attached to this run as an artifact."
            exit 1
          fi

      # Release notes: the "## v1.N" section of CHANGELOG.md, then how to install.
      - name: Release notes
        run: |
          awk -v v="## v$VER" 'index($0,"## ")==1{if(p)exit; p=($0==v||index($0,v" ")==1)} p' CHANGELOG.md | tail -n +2 > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning title=No changelog entry::CHANGELOG.md has no section for v$VER"
            echo "Lihat [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." > notes.md
          fi
          printf '\n---\n\nUnduh **XueCiMandarin.apk** di bawah, lalu buka di HP Android untuk memasang.\nPembaruan bisa langsung dipasang di atas versi sebelumnya; progres belajar tetap tersimpan.\n' >> notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: XueCi Mandarin v${{ env.VER }}
          body_path: notes.md
          files: XueCiMandarin.apk
          make_latest: true
