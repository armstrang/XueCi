name: Play test bundle

# A Google Play bundle (.aab) for internal or closed testing, signed with the upload key from the repository secrets.
# Run by hand (Actions → Play test bundle → Run workflow on main). Publishes nothing on GitHub: download the .aab from
# the run's artifacts (kept 3 days) and upload it in Play Console. versionCode = 1500 + run: above the alphas (1000 + run) and below
# the official releases (2000 + run), so each bundle is accepted by Play and v1.0 later installs over it.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        run: |
          echo "VER=1.0.0-beta.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "CODE=$(( 1500 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"

      - name: Assets (word data, interface text, the sealed part)
        run: |
          npm install --silent --no-save --prefix mobile/tool acorn@8.15.0
          python3 mobile/tool/make_assets.py

      - name: Pub get
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Tests
        working-directory: mobile
        run: flutter test --update-goldens

      - name: Build Play bundle (AAB)
        working-directory: mobile
        env:
          KS_B64: ${{ secrets.XC_UPLOAD_KEYSTORE_B64 }}
          XC_UPLOAD_STORE_PASSWORD: ${{ secrets.XC_UPLOAD_STORE_PASSWORD }}
          XC_UPLOAD_KEY_ALIAS: ${{ secrets.XC_UPLOAD_KEY_ALIAS }}
          XC_UPLOAD_KEY_PASSWORD: ${{ secrets.XC_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error title=No upload key::Set the XC_UPLOAD_* secrets first (docs/play-store.md, part 2). A bundle signed with the public test key can't go to Play."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export XC_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          XC_PLAY=1 flutter build appbundle --release --build-number=$CODE --build-name=$VER
          cp build/app/outputs/bundle/release/app-release.aab "../XueCiMandarin-$VER.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "### Play test bundle $VER (versionCode $CODE)" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the artifact below and upload it in Play Console → Testing." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: XueCiMandarin-play-${{ env.VER }}
          path: XueCiMandarin-*.aab
          if-no-files-found: error
          retention-days: 3 # public repo: any signed-in GitHub user can download artifacts
