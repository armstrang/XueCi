name: Check build

# Builds the APK for branches named build/... without publishing anything,
# so changes to the Android side can be compiled before they reach main.
on:
  push:
    branches: ['build/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app page
        run: python3 web/build.py

      # Tests: the engine in Node, then every screen in Chromium. No APK when a test fails.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Engine tests
        run: node tests/engine.js

      - name: Browser smoke test
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          # timing on a shared runner can vary; a real failure fails twice
          python tests/smoke.py || { echo "::warning title=Smoke test retried::first run failed, running again"; python tests/smoke.py; }

      - name: Keep the test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tests/out/
          if-no-files-found: ignore

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log; then
            msg=$(grep -A 30 "What went wrong" build.log | head -60)
            [ -z "$msg" ] && msg=$(grep -iE "error|exception" build.log | head -40)
            [ -z "$msg" ] && msg=$(tail -40 build.log)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi
          grep -E "^w: |warning:" build.log | head -20 || true

      # Google Play bundle, signed with the upload key from the repository secrets when they are set
      - name: Build Play bundle (AAB)
        shell: bash
        env:
          KS_B64: ${{ secrets.XC_UPLOAD_KEYSTORE_B64 }}
          XC_UPLOAD_STORE_PASSWORD: ${{ secrets.XC_UPLOAD_STORE_PASSWORD }}
          XC_UPLOAD_KEY_ALIAS: ${{ secrets.XC_UPLOAD_KEY_ALIAS }}
          XC_UPLOAD_KEY_PASSWORD: ${{ secrets.XC_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export XC_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
            echo "Signing the bundle with the Play upload key"
          else
            echo "::notice title=No upload key::XC_UPLOAD_KEYSTORE_B64 is not set; the bundle is signed with the sideload key (not for Play)"
          fi
          ./gradlew bundlePlay --no-daemon --stacktrace
          cp app/build/outputs/bundle/play/app-play.aab XueCiMandarin.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: check-apk
          path: app/build/outputs/apk/release/app-release.apk
