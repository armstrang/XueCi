name: Flutter SDK for cloud sessions

# Development only. Claude's cloud sessions cannot reach Flutter's download servers or pub.dev, only GitHub. This
# packs the pinned Flutter SDK (Linux, with the test engine and the Dart SDK) and the pub cache for mobile/ into a
# pre-release, so a session can download it and run `flutter analyze` and `flutter test` itself. Not an app release.
# Run by hand (Actions → Flutter SDK for cloud sessions → Run workflow) after changing the Flutter version.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Warm up (tool snapshot, test engine, packages)
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter --disable-analytics || true
          cd "$RUNNER_TEMP"
          flutter create --platforms android warm >/dev/null
          cd warm && flutter test && (flutter analyze || true)
          cd "$GITHUB_WORKSPACE/mobile" && flutter pub get && (flutter analyze --no-fatal-infos --no-fatal-warnings || true)

      - name: Pack
        run: |
          FL="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          PC="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "flutter at $FL, pub cache at $PC"
          du -sh "$FL" "$PC" || true
          du -sh "$FL"/bin/cache/artifacts/engine/* || true
          mkdir -p "$RUNNER_TEMP/out"
          tar -C "$(dirname "$FL")" \
            --exclude='*/bin/cache/artifacts/engine/android-*' \
            --exclude='*/bin/cache/artifacts/engine/ios*' \
            --exclude='*/bin/cache/artifacts/engine/darwin*' \
            --exclude='*/bin/cache/artifacts/engine/windows*' \
            --exclude='*/bin/cache/artifacts/engine/fuchsia*' \
            --exclude='*/bin/cache/artifacts/gradle_wrapper' \
            --exclude='*/bin/cache/downloads' \
            --transform "s|^$(basename "$FL")|flutter|" \
            -cf - "$(basename "$FL")" | xz -T0 -3 > "$RUNNER_TEMP/out/flutter-sdk.tar.xz"
          tar -C "$(dirname "$PC")" --transform "s|^$(basename "$PC")|pub-cache|" -cf - "$(basename "$PC")" | xz -T0 -3 > "$RUNNER_TEMP/out/pub-cache.tar.xz"
          cd "$RUNNER_TEMP/out"
          split -b 1900m -d flutter-sdk.tar.xz flutter-sdk.tar.xz.part && rm flutter-sdk.tar.xz
          ls -la
          sha256sum * > SHA256SUMS

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-flutter-sdk"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" "$RUNNER_TEMP"/out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Flutter SDK cache (development tool, not an app release)" \
            --notes "Flutter ${FLUTTER_VERSION} for Linux x64 with the pub cache, used while porting the app to Flutter. Will be removed."
